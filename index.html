    const usStockMarketValUSD = usStocks.reduce((sum, u) => {
      const curP = Number(u.currentPrice) || Number(u.price) || 0;
      return sum + ((u.shares || 0) * curP);
    }, 0);
    const usStockMarketValTWD = Math.round(usStockMarketValUSD * USD_EXCHANGE_RATE);

    const fundCostTWD = funds.reduce((sum, f) => {
      const c = Number(f.cost) || 0;
      return sum + (f.currency === "USD" ? c * USD_EXCHANGE_RATE : c);
    }, 0);
    const fundMarketValTWD = funds.reduce((sum, f) => {
      // 基金若有淨值 nav 與單位數 shares 則計算現值，否則以成本計
      if (f.nav && f.shares) {
        const val = Number(f.nav) * Number(f.shares);
        return sum + (f.currency === "USD" ? val * USD_EXCHANGE_RATE : val);
      }
      const c = Number(f.cost) || 0;
      return sum + (f.currency === "USD" ? c * USD_EXCHANGE_RATE : c);
    }, 0);

    const goldCostTWD = golds.reduce((sum, g) => {
      const w = Number(g.weight) || 0;
      const p = Number(g.avgPrice) || 0;
      return sum + (w * p);
    }, 0);

    const goldMarketValTWD = golds.reduce((sum, g) => {
      const w = Number(g.weight) || 0;
      const cp = Number(g.currentPrice) || Number(g.avgPrice) || 0;
      return sum + (w * cp);
    }, 0);

    const totalPortfolioCostTWD = twStockCostTWD + usStockCostTWD + fundCostTWD + goldCostTWD;
    const totalPortfolioMarketValTWD = twStockMarketValTWD + usStockMarketValTWD + fundMarketValTWD + goldMarketValTWD;
    const totalUnrealizedPnlTWD = totalPortfolioMarketValTWD - totalPortfolioCostTWD;
    const totalUnrealizedPnlPct = totalPortfolioCostTWD > 0 ? (totalUnrealizedPnlTWD / totalPortfolioCostTWD) * 100 : 0;

    const avgProfitPct = totalPortfolioCostTWD > 0 ? (totalNetAnnualTWD / totalPortfolioCostTWD) * 100 : 0;
    const avgGrossProfitPct = totalPortfolioCostTWD > 0 ? (totalGrossAnnualTWD / totalPortfolioCostTWD) * 100 : 0;
    const totalPortfolioCount = twStocks.length + usStocks.length + funds.length + golds.length;

    // 5. 分頁處理 (各類別超過 5 筆時自動啟用分頁)
    const PAGE_SIZE = 5;

    // 台股分頁
    const twTotalPages = Math.ceil(twStocks.length / PAGE_SIZE) || 1;
    const safeTwPage = Math.min(Math.max(1, twPage), twTotalPages);
    const pagedTwStocks = twStocks.length > PAGE_SIZE
      ? twStocks.slice((safeTwPage - 1) * PAGE_SIZE, safeTwPage * PAGE_SIZE)
      : twStocks;

    // 美股分頁
    const usTotalPages = Math.ceil(usStocks.length / PAGE_SIZE) || 1;
    const safeUsPage = Math.min(Math.max(1, usPage), usTotalPages);
    const pagedUsStocks = usStocks.length > PAGE_SIZE
      ? usStocks.slice((safeUsPage - 1) * PAGE_SIZE, safeUsPage * PAGE_SIZE)
      : usStocks;

    // 基金分頁
    const fundTotalPages = Math.ceil(funds.length / PAGE_SIZE) || 1;
    const safeFundPage = Math.min(Math.max(1, fundPage), fundTotalPages);
    const pagedFunds = funds.length > PAGE_SIZE
      ? funds.slice((safeFundPage - 1) * PAGE_SIZE, safeFundPage * PAGE_SIZE)
      : funds;

    // 黃金買賣分頁
    const goldTotalPages = Math.ceil(golds.length / PAGE_SIZE) || 1;
    const safeGoldPage = Math.min(Math.max(1, goldPage), goldTotalPages);
    const pagedGolds = golds.length > PAGE_SIZE
      ? golds.slice((safeGoldPage - 1) * PAGE_SIZE, safeGoldPage * PAGE_SIZE)
      : golds;

    return (
      <section>
        {/* 頂部控制列 */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 12 }}>
          <div>
            <h2 style={{ ...SF, fontSize: 18, ...ink, margin: 0 }}>📈 投資組合 (台股 / 美股複委託 / 銀行基金 / 黃金買賣)</h2>
            <p style={{ fontSize: 12, ...soft, margin: "4px 0 0" }}>全市場資產與被動現金流配置一覽 ｜ 支援即時自行新增與管理刪除</p>
          </div>
          <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
            <button
              className="btn"
              onClick={() => {
                const totalPortfolioCount = twStocks.length + usStocks.length + funds.length + golds.length;
                if (!isPremier && totalPortfolioCount >= 10) {
                  alert("🔒 提醒：普通版投資組合（台股＋美股＋基金＋黃金）目前共 " + totalPortfolioCount + " 筆。超過 10 筆如欲再增加新標的，必須升級 Premier 會員或輸入優惠代碼解鎖！");
                  setShowUpgradeModal(true);
                  return;
                }
                setShowAddInvestModal(true);
              }}
            >
              ＋ 新增
            </button>
            <button
              className="btn"
              style={{ background: "#fff", color: "var(--seal)", border: "1px solid var(--seal)" }}
              onClick={() => setShowManageDeleteModal(true)}
            >
              🗑️ 刪除目前持有標的
            </button>
          </div>
        </div>

        {/* 🌟 核心需求 2：本年度實領總配息 ＆ 每個月平均實領配息 彙總卡片 (位於最上方，已全扣手續費/管理費/稅) */}
        <div className="card" style={{ background: "linear-gradient(135deg, #1C2430 0%, #2A3B4C 100%)", color: "#fff", marginBottom: 20, border: "none", boxShadow: "0 4px 16px rgba(0,0,0,0.1)" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid rgba(255,255,255,0.15)", paddingBottom: 12, marginBottom: 16, flexWrap: "wrap", gap: 8 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
              <span style={{ fontSize: 18 }}>💰</span>
              <span style={{ ...SF, fontSize: 16, fontWeight: 700, color: "#fff" }}>全投資組合被動現金流精算 (已扣除手續費/管理費/健保稅費實領額)</span>
              <span style={{ fontSize: 12, background: "rgba(220, 38, 38, 0.25)", color: "#FCA5A5", border: "1px solid rgba(248, 113, 113, 0.4)", padding: "2px 8px", borderRadius: 4, fontWeight: 600 }}>
                ⚠️ 本區不建議短線炒作而是長線規劃
              </span>
            </div>
            <span style={{ fontSize: 11, background: "rgba(255,255,255,0.18)", padding: "2px 8px", borderRadius: 4, color: "#E2E8F0" }}>
              匯率基準 1 USD = 32.2 TWD ｜ 實領淨現金流精算
            </span>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(210px, 1fr))", gap: 16 }}>
            {/* 🌟 核心需求：在現金流精算欄位增加「目前總資產」 */}
            <div style={{ background: "rgba(255,255,255,0.08)", padding: 14, borderRadius: 6, border: "1px solid rgba(253, 224, 71, 0.3)" }}>
              <div style={{ fontSize: 12, color: "#cbd5e1", marginBottom: 4 }}>💎 目前總資產 (現值總計)</div>
              <div style={{ ...SF, fontSize: 24, fontWeight: 700, color: "#FDE047" }}>
                {fmt(totalPortfolioMarketValTWD)}
              </div>
              <div style={{ fontSize: 11, color: "#cbd5e1", marginTop: 4, display: "flex", flexDirection: "column", gap: 2 }}>
                <span>總成本：{fmt(totalPortfolioCostTWD)}</span>
                <span>未實現損益：<b style={{ color: totalUnrealizedPnlTWD >= 0 ? "#4ADE80" : "#F87171" }}>{totalUnrealizedPnlTWD >= 0 ? "+" : ""}{fmt(totalUnrealizedPnlTWD)} ({totalUnrealizedPnlPct >= 0 ? "+" : ""}{totalUnrealizedPnlPct.toFixed(2)}%)</b></span>
              </div>
            </div>

            <div style={{ background: "rgba(255,255,255,0.08)", padding: 14, borderRadius: 6 }}>
              <div style={{ fontSize: 12, color: "#cbd5e1", marginBottom: 4 }}>📅 每月平均配息 (實領淨額)</div>
              <div style={{ ...SF, fontSize: 24, fontWeight: 700, color: "#FDE047" }}>
                {fmt(avgMonthlyNetDivTWD)}
                <span style={{ fontSize: 13, color: "#cbd5e1", fontWeight: 400, marginLeft: 4 }}>/ 月</span>
              </div>
              <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 4 }}>扣除手續費、管理費與健保稅費後實領</div>
            </div>

            <div style={{ background: "rgba(255,255,255,0.08)", padding: 14, borderRadius: 6 }}>
              <div style={{ fontSize: 12, color: "#cbd5e1", marginBottom: 4 }}>🏆 本年度累積配息 (實領淨額)</div>
              <div style={{ ...SF, fontSize: 24, fontWeight: 700, color: "#4ADE80" }}>
                {fmt(totalNetAnnualTWD)}
                <span style={{ fontSize: 13, color: "#cbd5e1", fontWeight: 400, marginLeft: 4 }}>/ 年</span>
              </div>
              <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 4 }}>總毛息 {fmt(totalGrossAnnualTWD)} ｜ 累計扣除費用 -{fmt(totalCostAnnualTWD)}</div>
            </div>

            <div style={{ background: "rgba(255,255,255,0.08)", padding: 14, borderRadius: 6 }}>
              <div style={{ fontSize: 12, color: "#cbd5e1", marginBottom: 4 }}>💸 年度費用與稅費扣除總額</div>
              <div style={{ ...SF, fontSize: 22, fontWeight: 700, color: "#F87171" }}>
                -{fmt(totalCostAnnualTWD)}
                <span style={{ fontSize: 13, color: "#cbd5e1", fontWeight: 400, marginLeft: 4 }}>/ 年</span>
              </div>
              <div style={{ fontSize: 11, color: "#cbd5e1", marginTop: 4, display: "flex", flexDirection: "column", gap: 2 }}>
                <span>手續費: -{fmt(totalFeeTWD)} ｜ 管理費: -{fmt(totalMgmtTWD)}</span>
                <span>二代健保/美股稅: -{fmt(totalTaxNhiTWD)}</span>
              </div>
            </div>

            <div style={{ background: "rgba(255,255,255,0.08)", padding: 14, borderRadius: 6 }}>
              <div style={{ fontSize: 12, color: "#cbd5e1", marginBottom: 4 }}>📈 平均獲利% (年化實領殖利率)</div>
              <div style={{ ...SF, fontSize: 24, fontWeight: 700, color: "#38BDF8" }}>
                {avgProfitPct.toFixed(2)}%
                <span style={{ fontSize: 13, color: "#cbd5e1", fontWeight: 400, marginLeft: 4 }}>/ 年</span>
              </div>
              <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 4 }}>
                毛獲利率 {avgGrossProfitPct.toFixed(2)}% ｜ 投入本金 {fmt(totalPortfolioCostTWD)}
              </div>
            </div>

            <div style={{ background: "rgba(255,255,255,0.08)", padding: 14, borderRadius: 6 }}>
              <div style={{ fontSize: 12, color: "#cbd5e1", marginBottom: 4 }}>📊 實領現金流來源佔比</div>
              <div style={{ fontSize: 12, color: "#e2e8f0", display: "flex", flexDirection: "column", gap: 3, marginTop: 4 }}>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <span>台股個股與高股息：</span>
                  <b>{fmt(twStockNetAnnual)} ({totalNetAnnualTWD ? Math.round((twStockNetAnnual / totalNetAnnualTWD) * 100) : 0}%)</b>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <span>美股複委託：</span>
                  <b>{fmt(usStockNetAnnualTWD)} ({totalNetAnnualTWD ? Math.round((usStockNetAnnualTWD / totalNetAnnualTWD) * 100) : 0}%)</b>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <span>海外/境內基金：</span>
                  <b>{fmt(fundNetAnnualTWD)} ({totalNetAnnualTWD ? Math.round((fundNetAnnualTWD / totalNetAnnualTWD) * 100) : 0}%)</b>
                </div>
              </div>
            </div>
          </div>
        </div>

        {/* 頁籤切換：與保險頁面風格完全一致 (tab-pill) */}
        <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap" }}>
          <button
            className={`tab-pill ${investSubTab === "twStock" ? "active" : ""}`}
            onClick={() => setInvestSubTab("twStock")}
          >
            🇹🇼 台股個股與高股息 ({twStocks.length})
          </button>
          <button
            className={`tab-pill ${investSubTab === "usStock" ? "active" : ""}`}
            onClick={() => setInvestSubTab("usStock")}
          >
            🇺🇸 美股複委託 / 海外券商 ({usStocks.length})
          </button>
          <button
            className={`tab-pill ${investSubTab === "fund" ? "active" : ""}`}
            onClick={() => setInvestSubTab("fund")}
          >
            🏦 境內與海外銀行基金 ({funds.length})
          </button>
          <button
            className={`tab-pill ${investSubTab === "gold" ? "active" : ""}`}
            onClick={() => setInvestSubTab("gold")}
          >
            🪙 黃金買賣 ({golds.length})
          </button>
        </div>

        {/* 1. 台股個股與高股息持股表 (全部顯示，不分頁) */}
            {investSubTab === "twStock" && (
          <div className="card" style={{ marginBottom: 20 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 6 }}>
              <div style={{ fontSize: 14, fontWeight: 700, ...ink }}>
                🇹🇼 台股個股與高股息 (共 {twStocks.length} 檔)
              </div>
            </div>
            <div className="ft-table-wrapper">
              <table className="ft">
                <thead>
                  <tr>
                    <th>代號</th>
                    <th>名稱</th>
                    <th style={{ textAlign: "right" }}>買進均價</th>
                    <th style={{ textAlign: "right" }}>現價</th>
                    <th style={{ textAlign: "right" }}>持股數</th>
                    <th>配息方式</th>
                    <th style={{ textAlign: "right" }}>每股配息</th>
                    <th style={{ textAlign: "right" }}>本次配息 (實領)</th>
                    <th style={{ textAlign: "right" }}>本年度累積配息 (實領)</th>
                    <th style={{ textAlign: "right" }}>平均獲利%</th>
                    <th style={{ textAlign: "center" }}>券商手續費</th>
                    <th style={{ textAlign: "center" }}>ETF經理管理費</th>
                    <th style={{ textAlign: "center" }}>二代健保 2.11%</th>
                  </tr>
                </thead>
                <tbody>
                  {twStocks.length === 0 ? (
                    <tr>
                      <td colSpan="13" style={{ textAlign: "center", padding: "36px 16px", color: "var(--soft)" }}>
                        <div style={{ fontSize: 24, marginBottom: 6 }}>📊</div>
                        <div style={{ fontWeight: 700, fontSize: 14, color: "var(--ink)" }}>尚未建立台股持有標的</div>
                        <div style={{ fontSize: 12, marginTop: 4, color: "var(--ink-soft)" }}>點擊上方「＋ 新增」開始記錄您的台股個股、高股息 ETF 與配息</div>
                      </td>
                    </tr>
                  ) : twStocks.map(s => {
                    const mult = s.divFreq === "年配" ? 1 : s.divFreq === "月配" ? 12 : s.divFreq === "半年配" ? 2 : s.divFreq === "不配息" ? 0 : 4;
                    const singleGross = (s.shares || 0) * (Number(s.divPerShare) || 0);
                    const annGross = singleGross * mult;
                    const feeAmt = Math.round(annGross * ((Number(s.feeRate) || 0) / 100));
                    const mgmtAmt = Math.round(annGross * ((Number(s.mgmtFee) || 0) / 100));
                    const singleNhi = singleGross >= 20000 ? Math.round(singleGross * 0.0211) : 0;
                    const annNhi = singleNhi * mult;
                    const totalCost = feeAmt + mgmtAmt + annNhi;
                    const annNet = Math.max(0, annGross - totalCost);
                    const singleNet = mult > 0 ? Math.round(annNet / mult) : 0;
                    const over20k = singleGross >= 20000;
                    const itemCost = (s.shares || 0) * (Number(s.price) || 0);
                    const itemProfitPct = itemCost > 0 ? (annNet / itemCost) * 100 : 0;
                    const nowP = Number(s.currentPrice) || Number(s.price) || 0;
                    const pnlDiff = nowP - (Number(s.price) || 0);
                    const pnlDiffPct = Number(s.price) > 0 ? (pnlDiff / Number(s.price)) * 100 : 0;
                    return (
                      <tr key={s.id}>
                        <td style={{ fontFamily: "monospace", fontWeight: 700 }}>{s.code}</td>
                        <td style={{ fontWeight: 600 }}>{s.name}</td>
                        <td style={{ textAlign: "right" }}>{s.price ? `$${s.price}` : "-"}</td>
                        <td style={{ textAlign: "right" }}>
                          <div style={{ fontWeight: 700, color: pnlDiff > 0 ? "var(--green)" : pnlDiff < 0 ? "var(--seal)" : "var(--ink)" }}>
                            ${nowP}
                          </div>
                          {s.price && pnlDiff !== 0 && (
                            <div style={{ fontSize: 11, color: pnlDiff > 0 ? "var(--green)" : "var(--seal)" }}>
                              {pnlDiff > 0 ? `+${pnlDiffPct.toFixed(1)}%` : `${pnlDiffPct.toFixed(1)}%`}
                            </div>
                          )}
                        </td>
                        <td style={{ textAlign: "right" }}>{fmtN(s.shares)} 股</td>
                        <td>
                          <span className={s.divFreq === "不配息" ? "tag-s" : "tag-g"}>{s.divFreq}</span>{" "}
                          {s.divMonths && <span style={{ fontSize: 11, color: "var(--ink-soft)" }}>({s.divMonths})</span>}
                        </td>
                        <td style={{ textAlign: "right", fontWeight: 700 }}>${s.divPerShare}</td>
                        <td style={{ textAlign: "right" }}>
                          <div style={{ color: "var(--seal)", fontWeight: 700 }}>{fmt(singleNet)}</div>
                          <div style={{ fontSize: 11, color: "var(--ink-soft)" }}>毛息 {fmt(singleGross)}</div>
                        </td>
                        <td style={{ textAlign: "right" }}>
                          <div style={{ color: "var(--green)", fontWeight: 700 }}>{fmt(annNet)}</div>
                          <div style={{ fontSize: 11, color: "var(--ink-soft)" }}>扣費 {fmt(totalCost)}</div>
                        </td>
                        <td style={{ textAlign: "right", fontWeight: 700, color: "#0284C7" }}>
                          {itemProfitPct > 0 ? `${itemProfitPct.toFixed(2)}%` : "-"}
                        </td>
                        <td style={{ textAlign: "center", fontSize: 12 }}>
                          <div>{s.feeRate || 0.1425}%</div>
                          {feeAmt > 0 && <div style={{ fontSize: 11, color: "var(--ink-soft)" }}>年約 -{fmt(feeAmt)}</div>}
                        </td>
                        <td style={{ textAlign: "center", fontSize: 12 }}>
                          <div>{s.mgmtFee ? `${s.mgmtFee}%/年` : "個股無"}</div>
                          {mgmtAmt > 0 && <div style={{ fontSize: 11, color: "var(--ink-soft)" }}>年約 -{fmt(mgmtAmt)}</div>}
                        </td>
                        <td style={{ textAlign: "center" }}>
                          {singleGross === 0 ? (
                            <span style={{ fontSize: 11, color: "var(--ink-soft)" }}>-</span>
                          ) : over20k ? (
                            <span className="tag-s" title={`單次配息 ${fmt(singleGross)} 達 2 萬門檻，單次扣繳 ${fmt(singleNhi)}，年扣 ${fmt(annNhi)}`}>
                              ⚠️ 強制扣 2.11% (年扣{fmt(annNhi)})
                            </span>
                          ) : (
                            <span className="tag-g" title={`單次配息 ${fmt(singleGross)} 未達 2 萬，免扣補充保費`}>
                              ✓ 單筆&lt;2萬 免扣
                            </span>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {/* 2. 美股複委託 / 國外券商標的 (USD) */}
        {investSubTab === "usStock" && (
          <div className="card" style={{ marginBottom: 20 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 6 }}>
              <div style={{ fontSize: 14, fontWeight: 700, ...ink }}>
                🇺🇸 美股複委託 / 國外券商標的 (USD) ({usStocks.length} 檔{usStocks.length > PAGE_SIZE ? ` ｜ 每頁 5 筆，第 ${safeUsPage}/${usTotalPages} 頁` : ""})
              </div>
            </div>
            <div className="ft-table-wrapper">
              <table className="ft">
                <thead>
                  <tr>
                    <th>代號</th>
                    <th>標的名稱</th>
                    <th>交易券商</th>
                    <th style={{ textAlign: "right" }}>買進均價</th>
                    <th style={{ textAlign: "right" }}>現價 (USD)</th>
                    <th style={{ textAlign: "right" }}>股數</th>
                    <th style={{ textAlign: "right" }}>每股配息</th>
                    <th style={{ textAlign: "right" }}>實領年息 (USD)</th>
                    <th style={{ textAlign: "right" }}>實領年息 (TWD)</th>
                    <th style={{ textAlign: "right" }}>平均獲利%</th>
                    <th style={{ textAlign: "center" }}>複委託/交易手續費</th>
                    <th style={{ textAlign: "center" }}>ETF內扣管理費</th>
                    <th style={{ textAlign: "center" }}>二代健保檢核</th>
                  </tr>
                </thead>
                <tbody>
                  {usStocks.length === 0 ? (
                    <tr>
                      <td colSpan="13" style={{ textAlign: "center", padding: "36px 16px", color: "var(--soft)" }}>
                        <div style={{ fontSize: 24, marginBottom: 6 }}>🇺🇸</div>
                        <div style={{ fontWeight: 700, fontSize: 14, color: "var(--ink)" }}>尚未建立美股或海外標的</div>
                        <div style={{ fontSize: 12, marginTop: 4, color: "var(--ink-soft)" }}>點擊上方「＋ 新增」開始記錄美股複委託或海外券商投資標的</div>
                      </td>
                    </tr>
                  ) : pagedUsStocks.map(u => {
                    const mult = u.divFreq === "年配" ? 1 : u.divFreq === "月配" ? 12 : u.divFreq === "半年配" ? 2 : 4;
                    const grossUSD = (u.shares || 0) * (Number(u.divPerShare) || 0) * mult;
                    const irsTax = grossUSD * 0.3; // 30% IRS 扣除
                    const feeAmt = grossUSD * ((Number(u.feeRate) || 0) / 100);
                    const mgmtAmt = grossUSD * ((Number(u.mgmtFee) || 0) / 100);
                    const netUSD = Math.max(0, grossUSD - irsTax - feeAmt - mgmtAmt);
                    const netTWD = Math.round(netUSD * USD_EXCHANGE_RATE);
                    const itemCostUSD = (u.shares || 0) * (Number(u.price) || 0);
                    const itemProfitPct = itemCostUSD > 0 ? (netUSD / itemCostUSD) * 100 : 0;
                    const nowP = Number(u.currentPrice) || Number(u.price) || 0;
                    const pnlDiff = nowP - (Number(u.price) || 0);
                    const pnlDiffPct = Number(u.price) > 0 ? (pnlDiff / Number(u.price)) * 100 : 0;
                    return (
                      <tr key={u.id}>
                        <td style={{ fontFamily: "monospace", fontWeight: 700 }}>{u.code}</td>
                        <td style={{ fontWeight: 600 }}>{u.name}</td>
                        <td><span className="tag-blue">{u.broker}</span></td>
                        <td style={{ textAlign: "right" }}>${u.price || "-"}</td>
                        <td style={{ textAlign: "right" }}>
                          <div style={{ fontWeight: 700, color: pnlDiff > 0 ? "var(--green)" : pnlDiff < 0 ? "var(--seal)" : "var(--ink)" }}>
                            ${nowP}
                          </div>
                          {u.price && pnlDiff !== 0 && (
                            <div style={{ fontSize: 11, color: pnlDiff > 0 ? "var(--green)" : "var(--seal)" }}>
                              {pnlDiff > 0 ? `+${pnlDiffPct.toFixed(1)}%` : `${pnlDiffPct.toFixed(1)}%`}
                            </div>
                          )}
                        </td>
                        <td style={{ textAlign: "right" }}>{fmtN(u.shares)} 股</td>
                        <td style={{ textAlign: "right" }}>${u.divPerShare} USD</td>
                        <td style={{ textAlign: "right" }}>
                          <div style={{ color: "var(--seal)", fontWeight: 700 }}>{fmtUSD(netUSD)}</div>
                          <div style={{ fontSize: 11, color: "var(--ink-soft)" }}>毛息 {fmtUSD(grossUSD)}</div>
                        </td>
                        <td style={{ textAlign: "right" }}>
                          <div style={{ color: "var(--green)", fontWeight: 700 }}>{fmt(netTWD)}</div>
                          <div style={{ fontSize: 11, color: "var(--ink-soft)" }}>扣費稅 -{fmtUSD(irsTax + feeAmt + mgmtAmt)}</div>
                        </td>
                        <td style={{ textAlign: "right", fontWeight: 700, color: "#0284C7" }}>
                          {itemProfitPct > 0 ? `${itemProfitPct.toFixed(2)}%` : "-"}
                        </td>
                        <td style={{ textAlign: "center", fontSize: 12 }}>
                          <div>{u.feeRate || 0.1}%</div>
                          {feeAmt > 0 && <div style={{ fontSize: 11, color: "var(--ink-soft)" }}>約 -{fmtUSD(feeAmt)}</div>}
                        </td>
                        <td style={{ textAlign: "center", fontSize: 12 }}>
                          <div>{u.mgmtFee ? `${u.mgmtFee}%/年` : "個股無"}</div>
                          {mgmtAmt > 0 && <div style={{ fontSize: 11, color: "var(--ink-soft)" }}>約 -{fmtUSD(mgmtAmt)}</div>}
                        </td>
                        <td style={{ textAlign: "center" }}>
                          <span className="tag-blue" title="海外所得非境內來源，依法不納入二代健保 2.11% 補充保費，僅計入最低稅負制海外所得 100 萬申報門檻">
                            依法免扣 (海外所得)
                          </span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <TablePagination
              current={safeUsPage}
              totalPages={usTotalPages}
              totalItems={usStocks.length}
              pageSize={PAGE_SIZE}
              onPageChange={setUsPage}
            />
          </div>
        )}

        {/* 3. 銀行基金持倉 */}
        {investSubTab === "fund" && (
          <div className="card">
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 6 }}>
              <div style={{ fontSize: 14, fontWeight: 700, ...ink }}>
                🏦 境內與海外銀行基金 ({funds.length} 檔{funds.length > PAGE_SIZE ? ` ｜ 每頁 5 筆，第 ${safeFundPage}/${fundTotalPages} 頁` : ""})
              </div>
            </div>
            <div className="ft-table-wrapper">
              <table className="ft">
                <thead>
                  <tr>
                    <th>基金名稱</th>
                    <th>往來銀行</th>
                    <th>幣別</th>
                    <th style={{ textAlign: "right" }}>投入成本</th>
                    <th style={{ textAlign: "right" }}>每月配息</th>
                    <th style={{ textAlign: "right" }}>全年度累積配息 (實領)</th>
                    <th style={{ textAlign: "right" }}>平均獲利%</th>
                    <th style={{ textAlign: "center" }}>申購/贖回手續費</th>
                    <th style={{ textAlign: "center" }}>經理費與保管費</th>
                    <th style={{ textAlign: "center" }}>二代健保課徵規定</th>
                  </tr>
                </thead>
                <tbody>
                  {funds.length === 0 ? (
                    <tr>
                      <td colSpan="11" style={{ textAlign: "center", padding: "36px 16px", color: "var(--soft)" }}>
                        <div style={{ fontSize: 24, marginBottom: 6 }}>🏦</div>
                        <div style={{ fontWeight: 700, fontSize: 14, color: "var(--ink)" }}>尚未建立境內外基金標的</div>
                        <div style={{ fontSize: 12, marginTop: 4, color: "var(--ink-soft)" }}>點擊上方「＋ 新增」開始記錄銀行定期定額或單筆申購基金</div>
                      </td>
                    </tr>
                  ) : pagedFunds.map(f => {
                    const grossAnnCurr = (Number(f.monthlyDiv) || 0) * 12;
                    const feeAmt = grossAnnCurr * ((Number(f.feeRate) || 0) / 100);
                    const mgmtAmt = grossAnnCurr * ((Number(f.mgmtFee) || 0) / 100);
                    const isOverseas = f.currency === "USD" || (f.name && (f.name.includes("環球") || f.name.includes("全球")));
                    const nhiAmt = (!isOverseas && f.currency === "TWD" && (Number(f.monthlyDiv) || 0) >= 20000) ? Math.round((Number(f.monthlyDiv) || 0) * 0.0211) * 12 : 0;
                    const totalCostFund = feeAmt + mgmtAmt + nhiAmt;
                    const netAnnCurr = Math.max(0, grossAnnCurr - totalCostFund);
                    const fundCost = Number(f.cost) || 0;
                    const fundProfitPct = fundCost > 0 ? (netAnnCurr / fundCost) * 100 : 0;
                    return (
                      <tr key={f.id}>
                        <td style={{ fontWeight: 600 }}>{f.name}</td>
                        <td><span className="tag-g">{f.bank}</span></td>
                        <td><span className="tag-gold">{f.currency}</span></td>
                        <td style={{ textAlign: "right" }}>{fmtCurr(f.cost, f.currency)}</td>
                        <td style={{ textAlign: "right", color: "var(--green)", fontWeight: 700 }}>{fmtCurr(f.monthlyDiv, f.currency)} /月</td>
                        <td style={{ textAlign: "right" }}>
                          <div style={{ color: "var(--green)", fontWeight: 700 }}>{fmtCurr(netAnnCurr, f.currency)} /年</div>
                          <div style={{ fontSize: 11, color: "var(--ink-soft)" }}>扣費 {fmtCurr(totalCostFund, f.currency)}</div>
                        </td>
                        <td style={{ textAlign: "right", fontWeight: 700, color: "#0284C7" }}>
                          {fundProfitPct > 0 ? `${fundProfitPct.toFixed(2)}%` : "-"}
                        </td>
                        <td style={{ textAlign: "center", fontSize: 12 }}>{f.feeRate || 0}% (銀行專案0手續費)</td>
                        <td style={{ textAlign: "center", fontSize: 12 }}>約 {f.mgmtFee || 1.2}%/年</td>
                        <td style={{ textAlign: "center" }}>
                          {isOverseas ? (
                            <span className="tag-blue" title="註冊於盧森堡或愛爾蘭等境外基金，配息屬於海外所得，免扣二代健保 2.11%">
                              境外免扣 (海外所得)
                            </span>
                          ) : (
                            <span className="tag-s" title="境內投信發行之台幣基金，若單次國內股利所得分配達 2 萬元須扣 2.11%">
                              單筆&gt;2萬 需扣 2.11%
                            </span>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <TablePagination
              current={safeFundPage}
              totalPages={fundTotalPages}
              totalItems={funds.length}
              pageSize={PAGE_SIZE}
              onPageChange={setFundPage}
            />
          </div>
        )}

        {/* 4. 黃金買賣持倉 (黃金存摺 / 實體黃金 / 黃金ETF) */}
        {investSubTab === "gold" && (
          <div className="card">
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 6 }}>
              <div style={{ fontSize: 14, fontWeight: 700, ...ink }}>
                🪙 黃金買賣配置 ({golds.length} 筆{golds.length > PAGE_SIZE ? ` ｜ 每頁 5 筆，第 ${safeGoldPage}/${goldTotalPages} 頁` : ""})
              </div>
              <div style={{ fontSize: 12, ...soft }}>
                總投入成本：<b>{fmt(goldCostTWD)}</b> ｜ 預估現值：<b style={{ color: "var(--gold)" }}>{fmt(goldMarketValTWD)}</b> ｜ 未實現損益：<b style={{ color: goldMarketValTWD >= goldCostTWD ? "var(--green)" : "var(--seal)" }}>{goldMarketValTWD >= goldCostTWD ? "+" : ""}{fmt(goldMarketValTWD - goldCostTWD)}</b>
              </div>
            </div>
            <div className="ft-table-wrapper">
              <table className="ft">
                <thead>
                  <tr>
                    <th>標的名稱</th>
                    <th>黃金類別</th>
                    <th>承作機構/券商</th>
                    <th style={{ textAlign: "right" }}>持有重量/單位</th>
                    <th style={{ textAlign: "right" }}>買進均價 (NT$)</th>
                    <th style={{ textAlign: "right" }}>參考市價 (NT$)</th>
                    <th style={{ textAlign: "right" }}>總投入成本</th>
                    <th style={{ textAlign: "right" }}>預估現值</th>
                    <th style={{ textAlign: "right" }}>未實現損益</th>
                    <th style={{ textAlign: "right" }}>報酬率%</th>
                    <th style={{ textAlign: "center" }}>交易手續費率</th>
                    <th>備註用途</th>
                  </tr>
                </thead>
                <tbody>
                  {golds.length === 0 ? (
                    <tr>
                      <td colSpan="10" style={{ textAlign: "center", padding: "36px 16px", color: "var(--soft)" }}>
                        <div style={{ fontSize: 24, marginBottom: 6 }}>🪙</div>
                        <div style={{ fontWeight: 700, fontSize: 14, color: "var(--ink)" }}>尚未建立黃金買賣標的</div>
                        <div style={{ fontSize: 12, marginTop: 4, color: "var(--ink-soft)" }}>點擊上方「＋ 新增」開始記錄黃金存摺、實體條塊或黃金 ETF</div>
                      </td>
                    </tr>
                  ) : pagedGolds.map(g => {
                    const weight = Number(g.weight) || 0;
                    const buyPrice = Number(g.avgPrice) || 0;
                    const nowPrice = Number(g.currentPrice) || buyPrice;
                    const totalCost = weight * buyPrice;
                    const totalVal = weight * nowPrice;
                    const pnl = totalVal - totalCost;
                    const pnlPct = totalCost > 0 ? (pnl / totalCost) * 100 : 0;
                    return (
                      <tr key={g.id}>
                        <td style={{ fontWeight: 600 }}>{g.name}</td>
                        <td><span className="tag-gold">{g.type}</span></td>
                        <td><span className="tag-g">{g.institution}</span></td>
                        <td style={{ textAlign: "right", fontWeight: 600 }}>{weight} {g.unit || "公克"}</td>
                        <td style={{ textAlign: "right" }}>{fmt(buyPrice)}</td>
                        <td style={{ textAlign: "right", color: "var(--gold)", fontWeight: 700 }}>{fmt(nowPrice)}</td>
                        <td style={{ textAlign: "right" }}>{fmt(totalCost)}</td>
                        <td style={{ textAlign: "right", fontWeight: 700 }}>{fmt(totalVal)}</td>
                        <td style={{ textAlign: "right", fontWeight: 700, color: pnl >= 0 ? "var(--green)" : "var(--seal)" }}>
                          {pnl >= 0 ? `+${fmt(pnl)}` : `-${fmt(Math.abs(pnl))}`}
                        </td>
                        <td style={{ textAlign: "right", fontWeight: 700, color: pnlPct >= 0 ? "var(--green)" : "var(--seal)" }}>
                          {pnlPct >= 0 ? `+${pnlPct.toFixed(2)}%` : `${pnlPct.toFixed(2)}%`}
                        </td>
                        <td style={{ textAlign: "center", fontSize: 12 }}>
                          {g.feeRate ? `${g.feeRate}%` : "免手續費"}
                        </td>
                        <td style={{ fontSize: 12, ...soft }}>{g.note || "長線避險保值"}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <TablePagination
              current={safeGoldPage}
              totalPages={goldTotalPages}
              totalItems={golds.length}
              pageSize={PAGE_SIZE}
              onPageChange={setGoldPage}
            />
          </div>
        )}
      </section>
    );
  };

  // =========================================================================
  // 頁面 7: 節稅規劃（財政部綜合所得稅電子結算申報系統模擬）
  // =========================================================================
  const renderTaxPlan = () => {
    // 報稅資料庫精算常數 (民國114/115年度報稅適用最新課稅級距與標準)
    const EXEMPTION_BASE = 97000; // 一般免稅額
    const EXEMPTION_SENIOR = 145500; // 年滿70歲尊親屬免稅額
    const SALARY_DEDUCTION_CAP = 218000; // 薪資特別扣除額上限
    const STD_DEDUCTION_JOINT = 262000; // 夫妻合併標準扣除額
    const STD_DEDUCTION_SINGLE = 131000; // 單身標準扣除額

    // 本人與配偶收入資料
    const mySalary = Number(userProfile.annualIncome) || 1250000;
    const spouse = (familyData.spouseAndParents || []).find(m => m.relationship === "配偶");
    const spouseSalary = spouse ? (Number(spouse.annualIncome) || 1400000) : 0;
    const spouseName = spouse ? spouse.name : "配偶 (未登記)";

    // 投資組合之台股與基金股利收入
    const twStockDividends = twStocks.reduce((sum, s) => {
      const shares = Number(s.shares) || 0;
      const dps = Number(s.divPerShare) || 0;
      let freqTimes = 1;
      if (s.divFreq === "季配") freqTimes = 4;
      else if (s.divFreq === "月配") freqTimes = 12;
      return sum + (shares * dps * freqTimes);
    }, 0);

    const fundDividends = funds.reduce((sum, f) => {
      if (f.currency === "USD") return sum; // 海外所得屬於最低稅負制，不計入一般綜所稅
      return sum + (Number(f.monthlyDiv) || 0) * 12;
    }, 0);

    const totalDividends = Math.round(twStockDividends + fundDividends);

    // 扶養親屬名單計算
    const seniors = (familyData.spouseAndParents || []).filter(m => m.relationship !== "配偶");
    const kids = familyData.children || [];
    const totalDependents = seniors.length + kids.length;

    // 免稅額總計：本人 + 配偶 + 長輩 + 子女
    let totalExemptions = EXEMPTION_BASE; // 本人
    if (spouse) totalExemptions += EXEMPTION_BASE; // 配偶
    seniors.forEach(s => {
      const age = s.birthDate ? (2026 - parseInt(s.birthDate.slice(0, 4))) : 66;
      totalExemptions += (age >= 70 ? EXEMPTION_SENIOR : EXEMPTION_BASE);
    });
    kids.forEach(() => {
      totalExemptions += EXEMPTION_BASE;
    });

    // 扣除額計算：標準扣除額 vs 列舉扣除額
    const stdDeduction = spouse ? STD_DEDUCTION_JOINT : STD_DEDUCTION_SINGLE;
    const itemizedTotal = customMortgageInterest + customDonation + customMedical + customInsuranceDeduction;
    const appliedDeduction = deductionMethod === "standard" ? stdDeduction : itemizedTotal;

    // 特別扣除額：薪資特別扣除額 (本人與配偶各限 21.8 萬) + 幼兒學前扣除額 (子女 6 歲以下每名 15 萬)
    const mySalaryDed = Math.min(mySalary, SALARY_DEDUCTION_CAP);
    const spouseSalaryDed = spouse ? Math.min(spouseSalary, SALARY_DEDUCTION_CAP) : 0;
    const salarySpecialDed = mySalaryDed + spouseSalaryDed;

    // 幼兒學前特別扣除 (每名 15 萬)
    const preschoolKidsCount = kids.filter(k => {
      const birthY = k.birthDate ? parseInt(k.birthDate.slice(0, 4)) : 2022;
      return (2026 - birthY) <= 6;
    }).length;
    const preschoolDeduction = preschoolKidsCount * 150000;

    // 長照特別扣除額 (長輩有身障或長照風險者每名 12 萬)
    const ltcCount = seniors.filter(s => s.longTermCareRisk || s.disabilityStatus).length;
    const ltcDeduction = ltcCount * 120000;

    const totalSpecialDeductions = salarySpecialDed + preschoolDeduction + ltcDeduction;

    // 課稅計算函數 (台灣 5 級累進稅率表)
    const calcTaxFromNet = (netIncome) => {
      if (netIncome <= 0) return 0;
      if (netIncome <= 590000) return netIncome * 0.05;
      if (netIncome <= 1330000) return netIncome * 0.12 - 41300;
      if (netIncome <= 2660000) return netIncome * 0.20 - 147700;
      if (netIncome <= 4980000) return netIncome * 0.30 - 413700;
      return netIncome * 0.40 - 911700;
    };

    // 方案 1：夫妻全部合併計稅 (股利採 8.5% 抵減)
    const grossIncomeA = mySalary + spouseSalary + totalDividends;
    const netIncomeA = Math.max(0, grossIncomeA - totalExemptions - appliedDeduction - totalSpecialDeductions);
    const initialTaxA = calcTaxFromNet(netIncomeA);
    const divCreditA = Math.min(80000, totalDividends * 0.085); // 8.5% 抵減稅額，上限 8 萬
    const finalTaxA = Math.max(0, Math.round(initialTaxA - divCreditA));

    // 方案 2：薪資分開計稅（以薪資較高者分開，另一方合併）
    // 陳怡君: 125萬, 林建宏: 140萬 -> 以林建宏(配偶)分開計稅
    const spouseNetB = Math.max(0, spouseSalary - EXEMPTION_BASE - spouseSalaryDed);
    const spouseTaxB = calcTaxFromNet(spouseNetB);
    const mainNetB = Math.max(0, (mySalary + totalDividends) - (totalExemptions - EXEMPTION_BASE) - appliedDeduction - mySalaryDed - preschoolDeduction - ltcDeduction);
    const mainTaxB = Math.max(0, calcTaxFromNet(mainNetB) - divCreditA);
    const finalTaxB = Math.round(spouseTaxB + mainTaxB);

    // 方案 3：股利採 28% 單一稅率分開計稅，薪資合併
    const grossIncomeC = mySalary + spouseSalary;
    const netIncomeC = Math.max(0, grossIncomeC - totalExemptions - appliedDeduction - totalSpecialDeductions);
    const finalTaxC = Math.round(calcTaxFromNet(netIncomeC) + (totalDividends * 0.28));

    // 評估最佳節稅方案
    let bestOption = "A";
    let minTax = finalTaxA;
    if (finalTaxB < minTax) {
      bestOption = "B";
      minTax = finalTaxB;
    }
    if (finalTaxC < minTax) {
      bestOption = "C";
      minTax = finalTaxC;
    }

    const currentTax = taxFilingMode === "joint" ? finalTaxA : taxFilingMode === "separateSpouse" ? finalTaxB : finalTaxC;
    const savedAmount = Math.max(0, Math.max(finalTaxA, finalTaxB, finalTaxC) - minTax);

    return (
      <section>
        {/* 財政部線上申報系統經典外框 */}
        <div className="gov-tax-container">
          {/* 系統頂部 Header */}
          <div className="gov-tax-header">
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <div style={{ background: "#f59e0b", color: "#1e3a8a", width: 34, height: 34, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900, fontSize: 18 }}>
                稅
              </div>
              <div>
                <div style={{ fontSize: 16, fontWeight: 800, letterSpacing: 0.5 }}>
                  財政部電子申報繳稅服務網 ｜ 綜合所得稅線上結算申報模擬系統
                </div>
                <div style={{ fontSize: 11, opacity: 0.85 }}>
                  申報年度：民國 114 年度（2025年所得）/ 115年5月申報期適用 ｜ 憑證檢核：會員號碼識別 + 數位憑證已通過認證
                </div>
              </div>
            </div>
            <div style={{ textAlign: "right", fontSize: 12 }}>
              <span className="gov-highlight" style={{ background: "#10b981", color: "#fff" }}>系統連線正常 (TLS 1.3)</span>
            </div>
          </div>

          {/* 申報流程 5 步驟 Step-bar */}
          <div className="gov-step-bar">
            {[
              { s: 1, title: "1. 申報人基本資料" },
              { s: 2, title: "2. 扶養親屬與免稅額" },
              { s: 3, title: "3. 各類所得總額清單" },
              { s: 4, title: "4. 一般與特別扣除額" },
              { s: 5, title: "5. 稅額計算與最佳化" }
            ].map(step => (
              <div
                key={step.s}
                className={`gov-step-item ${taxStep === step.s ? "active" : taxStep > step.s ? "completed" : ""}`}
                onClick={() => setTaxStep(step.s)}
              >
                <span className="gov-badge">{taxStep > step.s ? "✓" : step.s}</span>
                <span>{step.title}</span>
              </div>
            ))}
          </div>

          {/* 步驟內容 Panel */}
          <div className="gov-panel">
            {/* 步驟 1: 申報人基本資料 */}
            {taxStep === 1 && (
              <div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "2px solid #e2e8f0", paddingBottom: 10, marginBottom: 16 }}>
                  <h3 style={{ margin: 0, color: "#1e3a8a", fontSize: 16, display: "flex", alignItems: "center", gap: 8 }}>
                    <span>👤 納稅義務人及配偶基本資料檢核</span>
                  </h3>
                  <span style={{ fontSize: 12, color: "#64748b" }}>戶籍註記：已婚（合併申報）</span>
                </div>

                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 16, marginBottom: 20 }}>
                  <div style={{ border: "1px solid #cbd5e1", borderRadius: 6, padding: 14, background: "#f8fafc" }}>
                    <div style={{ fontWeight: 800, color: "#1e3a8a", marginBottom: 8, fontSize: 14, borderBottom: "1px solid #cbd5e1", paddingBottom: 4 }}>
                      【納稅義務人 (本人)】
                    </div>
                    <table style={{ width: "100%", fontSize: 13, lineHeight: 1.8 }}>
                      <tbody>
                        <tr><td style={{ width: 100, color: "#64748b" }}>姓名：</td><td><b>{userProfile.name}</b></td></tr>
                        <tr><td style={{ color: "#64748b" }}>會員號碼識別：</td><td><span style={{ fontFamily: "monospace", fontWeight: 700 }}>{userProfile.memberNumber || userProfile.idNumber}</span></td></tr>
                        <tr><td style={{ color: "#64748b" }}>出生年月日：</td><td>{userProfile.birthDate} (36歲)</td></tr>
                        <tr><td style={{ color: "#64748b" }}>服務事業：</td><td>{userProfile.company}</td></tr>
                        <tr><td style={{ color: "#64748b" }}>扣繳憑單所得：</td><td style={{ color: "var(--green)", fontWeight: 700 }}>{fmt(mySalary)}</td></tr>
                      </tbody>
                    </table>
                  </div>

                  <div style={{ border: "1px solid #cbd5e1", borderRadius: 6, padding: 14, background: "#f8fafc" }}>
                    <div style={{ fontWeight: 800, color: "#1e3a8a", marginBottom: 8, fontSize: 14, borderBottom: "1px solid #cbd5e1", paddingBottom: 4 }}>
                      【配偶資料】
                    </div>
                    <table style={{ width: "100%", fontSize: 13, lineHeight: 1.8 }}>
                      <tbody>
                        <tr><td style={{ width: 100, color: "#64748b" }}>配偶姓名：</td><td><b>{spouseName}</b></td></tr>
                        <tr><td style={{ color: "#64748b" }}>出生年月日：</td><td>{spouse ? spouse.birthDate : "--"}</td></tr>
                        <tr><td style={{ color: "#64748b" }}>服務事業：</td><td>{spouse ? spouse.company : "--"}</td></tr>
                        <tr><td style={{ color: "#64748b" }}>申報身分關係：</td><td>配偶 (民法合法登記婚姻)</td></tr>
                        <tr><td style={{ color: "#64748b" }}>扣繳憑單所得：</td><td style={{ color: "var(--green)", fontWeight: 700 }}>{spouse ? fmt(spouseSalary) : "$0"}</td></tr>
                      </tbody>
                    </table>
                  </div>
                </div>

                <div style={{ background: "#eef2ff", border: "1px solid #c7d2fe", borderRadius: 6, padding: 12, fontSize: 13, color: "#3730a3" }}>
                  💡 <b>系統自動檢核：</b>納稅義務人與配偶所得已依稅捐稽徵機關提供之電子資料清單比對無誤。可直接點擊「下一步」審查受扶養親屬名單。
                </div>

                <div style={{ marginTop: 20, textAlign: "right" }}>
                  <button className="gov-btn-primary" onClick={() => setTaxStep(2)}>
                    下一步：扶養親屬與免稅額 →
                  </button>
                </div>
              </div>
            )}

            {/* 步驟 2: 扶養親屬與免稅額 */}
            {taxStep === 2 && (
              <div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "2px solid #e2e8f0", paddingBottom: 10, marginBottom: 16 }}>
                  <h3 style={{ margin: 0, color: "#1e3a8a", fontSize: 16 }}>
                    <span>👨‍👩‍👧‍👦 受扶養親屬申報明細與免稅額核定</span>
                  </h3>
                  <span className="gov-highlight">免稅額總計：{fmt(totalExemptions)}</span>
                </div>

                <p style={{ fontSize: 13, color: "#475569", margin: "0 0 12px" }}>
                  依所得稅法規定，納稅人、配偶及未滿70歲之扶養親屬每人免稅額為 <b>$97,000</b>；年滿70歲之直系尊親屬（父母、祖父母）免稅額加成 50% 為 <b>$145,500</b>。
                </p>

                <div className="ft-table-wrapper">
                  <table className="gov-table">
                    <thead>
                      <tr>
                        <th>稱謂</th>
                        <th>受扶養親屬姓名</th>
                        <th>出生年 / 年齡</th>
                        <th>身分資格審查</th>
                        <th>免稅額度</th>
                        <th>備註說明</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td><b>納稅義務人</b></td>
                        <td>{userProfile.name}</td>
                        <td>1990 (36歲)</td>
                        <td>本人親自申報</td>
                        <td style={{ fontWeight: 700 }}>$97,000</td>
                        <td>基本免稅額</td>
                      </tr>
                      {spouse && (
                        <tr>
                          <td><b>配偶</b></td>
                          <td>{spouse.name}</td>
                          <td>1988 (38歲)</td>
                          <td>配偶合併申報</td>
                          <td style={{ fontWeight: 700 }}>$97,000</td>
                          <td>配偶基本免稅額</td>
                        </tr>
                      )}
                      {seniors.map((s, idx) => {
                        const birthY = s.birthDate ? parseInt(s.birthDate.slice(0, 4)) : 1960;
                        const age = 2026 - birthY;
                        const isSeniorOver70 = age >= 70;
                        return (
                          <tr key={`tax-senior-${idx}`} style={{ background: isSeniorOver70 ? "#fffbeb" : "#fff" }}>
                            <td><span className="tag-gold">{s.relationship}</span></td>
                            <td><b>{s.name}</b></td>
                            <td>{s.birthDate} ({age}歲)</td>
                            <td>直系尊親屬 (同戶籍無謀生能力)</td>
                            <td style={{ fontWeight: 700, color: isSeniorOver70 ? "#d97706" : "#1e293b" }}>
                              {isSeniorOver70 ? "$145,500 (年滿70歲加成)" : "$97,000"}
                            </td>
                            <td style={{ fontSize: 12, color: "#64748b" }}>
                              {isSeniorOver70 ? "🎉 符合直系尊親屬年滿70歲特別加成" : "一般直系尊親屬扶養"}
                            </td>
                          </tr>
                        );
                      })}
                      {kids.map((k, idx) => (
                        <tr key={`tax-kid-${idx}`}>
                          <td><span className="tag-blue">{k.relationship || "子女"}</span></td>
                          <td><b>{k.name}</b></td>
                          <td>{k.birthDate} ({k.birthDate ? 2026 - parseInt(k.birthDate.slice(0, 4)) : 4}歲)</td>
                          <td>未成年受扶養子女</td>
                          <td style={{ fontWeight: 700 }}>$97,000</td>
                          <td style={{ fontSize: 12, color: "#64748b" }}>未成年子女或就學在校生</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div style={{ marginTop: 16, padding: 12, background: "#f1f5f9", borderRadius: 6, fontSize: 13, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span>申報總口數：<b>{2 + totalDependents} 口</b> ｜ 合計總免稅額度：</span>
                  <span style={{ fontSize: 18, fontWeight: 800, color: "#1e3a8a" }}>{fmt(totalExemptions)}</span>
                </div>

                <div style={{ marginTop: 20, display: "flex", justifyContent: "space-between" }}>
                  <button className="gov-btn-sec" onClick={() => setTaxStep(1)}>← 上一步</button>
                  <button className="gov-btn-primary" onClick={() => setTaxStep(3)}>下一步：所得總額清單 →</button>
                </div>
              </div>
            )}

            {/* 步驟 3: 所得總額清單 */}
            {taxStep === 3 && (
              <div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "2px solid #e2e8f0", paddingBottom: 10, marginBottom: 16 }}>
                  <h3 style={{ margin: 0, color: "#1e3a8a", fontSize: 16 }}>
                    <span>💰 全戶各類所得總額資料清單 (54C、50薪資等)</span>
                  </h3>
                  <span className="gov-highlight">全戶總所得：{fmt(mySalary + spouseSalary + totalDividends)}</span>
                </div>

                <div className="ft-table-wrapper">
                  <table className="gov-table">
                    <thead>
                      <tr>
                        <th>所得人</th>
                        <th>所得代號與類別</th>
                        <th>給付單位 (扣繳單位)</th>
                        <th>收入總額</th>
                        <th>必要費用/扣除</th>
                        <th>所得淨額</th>
                        <th>二代健保補充保費</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td><b>{userProfile.name} (本人)</b></td>
                        <td><span className="tag-blue">50 薪資所得</span></td>
                        <td>{userProfile.company}</td>
                        <td style={{ textAlign: "right" }}>{fmt(mySalary)}</td>
                        <td style={{ textAlign: "right", color: "#64748b" }}>--</td>
                        <td style={{ textAlign: "right", fontWeight: 700 }}>{fmt(mySalary)}</td>
                        <td style={{ textAlign: "center", fontSize: 12 }}>免扣繳</td>
                      </tr>
                      {spouse && (
                        <tr>
                          <td><b>{spouse.name} (配偶)</b></td>
                          <td><span className="tag-blue">50 薪資所得</span></td>
                          <td>{spouse.company}</td>
                          <td style={{ textAlign: "right" }}>{fmt(spouseSalary)}</td>
                          <td style={{ textAlign: "right", color: "#64748b" }}>--</td>
                          <td style={{ textAlign: "right", fontWeight: 700 }}>{fmt(spouseSalary)}</td>
                          <td style={{ textAlign: "center", fontSize: 12 }}>免扣繳</td>
                        </tr>
                      )}
                      <tr>
                        <td><b>{userProfile.name} (本人)</b></td>
                        <td><span className="tag-gold">54C 營利所得 (台股股利)</span></td>
                        <td>台灣集中保管結算所 / 券商彙報</td>
                        <td style={{ textAlign: "right" }}>{fmt(Math.round(twStockDividends))}</td>
                        <td style={{ textAlign: "right", color: "#64748b" }}>可抵減 8.5%</td>
                        <td style={{ textAlign: "right", fontWeight: 700 }}>{fmt(Math.round(twStockDividends))}</td>
                        <td style={{ textAlign: "center", fontSize: 12, color: twStockDividends > 20000 ? "#ef4444" : "#10b981" }}>
                          {twStockDividends > 20000 ? `扣 2.11% (約 ${fmt(twStockDividends * 0.0211)})` : "單筆未達 2 萬免扣"}
                        </td>
                      </tr>
                      <tr>
                        <td><b>全戶匯總</b></td>
                        <td><span className="tag-g">54C 境內基金配息</span></td>
                        <td>中國信託 / 台北富邦證券投信</td>
                        <td style={{ textAlign: "right" }}>{fmt(Math.round(fundDividends))}</td>
                        <td style={{ textAlign: "right", color: "#64748b" }}>可抵減 8.5%</td>
                        <td style={{ textAlign: "right", fontWeight: 700 }}>{fmt(Math.round(fundDividends))}</td>
                        <td style={{ textAlign: "center", fontSize: 12 }}>依單筆拆單稽核</td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <div style={{ background: "#f8fafc", border: "1px solid #cbd5e1", borderRadius: 6, padding: 14, marginTop: 16 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: "#1e3a8a", marginBottom: 6 }}>💡 股利節稅關鍵提點：</div>
                  <div style={{ fontSize: 12, color: "#475569", lineHeight: 1.6 }}>
                    1. <b>8.5% 抵減稅額政策：</b>全戶境內股利合計 {fmt(totalDividends)}，若採合併計稅，可享有 8.5% 之現金抵減稅額（共計 <b>{fmt(divCreditA)}</b> 直接扣抵應繳稅款）。<br/>
                    2. <b>海外美股所得：</b>您投資之美股複委託股利與海外基金，依所得基本稅額條例屬「海外所得」，全戶未達新台幣 100 萬元免予計入，且基本所得額在 750 萬元以下免課稅。
                  </div>
                </div>

                <div style={{ marginTop: 20, display: "flex", justifyContent: "space-between" }}>
                  <button className="gov-btn-sec" onClick={() => setTaxStep(2)}>← 上一步</button>
                  <button className="gov-btn-primary" onClick={() => setTaxStep(4)}>下一步：扣除額與特別扣除 →</button>
                </div>
              </div>
            )}

            {/* 步驟 4: 扣除額與特別扣除額試算 */}
            {taxStep === 4 && (
              <div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "2px solid #e2e8f0", paddingBottom: 10, marginBottom: 16 }}>
                  <h3 style={{ margin: 0, color: "#1e3a8a", fontSize: 16 }}>
                    <span>🧾 扣除額清單：標準扣除額 vs 列舉扣除額 最佳化評估</span>
                  </h3>
                  <span className="gov-highlight">特別扣除額總計：{fmt(totalSpecialDeductions)}</span>
                </div>

                {/* 扣除額方式選擇切換 */}
                <div style={{ display: "flex", gap: 14, marginBottom: 16 }}>
                  <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 14, fontWeight: 700, cursor: "pointer" }}>
                    <input
                      type="radio"
                      name="deductionMethod"
                      checked={deductionMethod === "standard"}
                      onChange={() => setDeductionMethod("standard")}
                    />
                    採用「標準扣除額」（系統自動核定：夫妻合併 $262,000）
                  </label>
                  <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 14, fontWeight: 700, cursor: "pointer" }}>
                    <input
                      type="radio"
                      name="deductionMethod"
                      checked={deductionMethod === "itemized"}
                      onChange={() => setDeductionMethod("itemized")}
                    />
                    採用「列舉扣除額」（房貸利息、保費、醫藥捐贈）
                  </label>
                </div>

                {/* 列舉項目細項調整 */}
                <div style={{ background: "#f8fafc", border: "1px solid #cbd5e1", borderRadius: 6, padding: 14, marginBottom: 16 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: "#1e3a8a", marginBottom: 10 }}>
                    📝 列舉扣除項目試算與調整（若列舉總和大於 $262,000 則採列舉更省稅）：
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 12 }}>
                    <div>
                      <label style={{ fontSize: 12, fontWeight: 600, color: "#475569", display: "block", marginBottom: 4 }}>
                        自用住宅購屋借款利息 (上限30萬)：
                      </label>
                      <input
                        className="gov-inp"
                        type="number"
                        value={customMortgageInterest}
                        onChange={e => setCustomMortgageInterest(Number(e.target.value) || 0)}
                      />
                    </div>
                    <div>
                      <label style={{ fontSize: 12, fontWeight: 600, color: "#475569", display: "block", marginBottom: 4 }}>
                        全家人身保險費 (每人每年上限2.4萬)：
                      </label>
                      <input
                        className="gov-inp"
                        type="number"
                        value={customInsuranceDeduction}
                        onChange={e => setCustomInsuranceDeduction(Number(e.target.value) || 0)}
                      />
                    </div>
                    <div>
                      <label style={{ fontSize: 12, fontWeight: 600, color: "#475569", display: "block", marginBottom: 4 }}>
                        合規醫藥及生育費 (實報實銷無上限)：
                      </label>
                      <input
                        className="gov-inp"
                        type="number"
                        value={customMedical}
                        onChange={e => setCustomMedical(Number(e.target.value) || 0)}
                      />
                    </div>
                    <div>
                      <label style={{ fontSize: 12, fontWeight: 600, color: "#475569", display: "block", marginBottom: 4 }}>
                        合法慈善公益捐贈收據：
                      </label>
                      <input
                        className="gov-inp"
                        type="number"
                        value={customDonation}
                        onChange={e => setCustomDonation(Number(e.target.value) || 0)}
                      />
                    </div>
                  </div>

                  <div style={{ marginTop: 12, display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13, borderTop: "1px solid #cbd5e1", paddingTop: 8 }}>
                    <span>目前試算列舉總額：<b>{fmt(itemizedTotal)}</b> ｜ 法定標準扣除額：<b>{fmt(stdDeduction)}</b></span>
                    <span style={{ fontWeight: 800, color: itemizedTotal > stdDeduction ? "#10b981" : "#d97706" }}>
                      {itemizedTotal > stdDeduction ? `🎉 建議改採列舉扣除！可多扣除 ${fmt(itemizedTotal - stdDeduction)}` : `✓ 採標準扣除額較為划算（多扣除 ${fmt(stdDeduction - itemizedTotal)}）`}
                    </span>
                  </div>
                </div>

                {/* 法定特別扣除額明細 */}
                <div className="ft-table-wrapper">
                  <table className="gov-table">
                    <thead>
                      <tr>
                        <th>特別扣除項目</th>
                        <th>適用法條</th>
                        <th>計算口數 / 對象</th>
                        <th>核准扣除金額</th>
                        <th>節稅審核狀態</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td><b>薪資所得特別扣除額</b></td>
                        <td>所得稅法第17條第1項第2款第3目之2</td>
                        <td>本人及配偶 (每人上限 $218,000)</td>
                        <td style={{ fontWeight: 700 }}>{fmt(salarySpecialDed)}</td>
                        <td><span className="tag-g">自動核准 (頂格扣除)</span></td>
                      </tr>
                      {preschoolKidsCount > 0 && (
                        <tr>
                          <td><b>幼兒學前特別扣除額</b></td>
                          <td>第17條 (6歲以下每名 $150,000)</td>
                          <td>{preschoolKidsCount} 名幼兒</td>
                          <td style={{ fontWeight: 700, color: "var(--green)" }}>{fmt(preschoolDeduction)}</td>
                          <td><span className="tag-g">自動採計無排富</span></td>
                        </tr>
                      )}
                      {ltcCount > 0 && (
                        <tr>
                          <td><b>長期照顧特別扣除額</b></td>
                          <td>第17條 (每名 $120,000)</td>
                          <td>{ltcCount} 位尊親屬</td>
                          <td style={{ fontWeight: 700, color: "var(--green)" }}>{fmt(ltcDeduction)}</td>
                          <td><span className="tag-g">符合長照資格</span></td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>

                <div style={{ marginTop: 20, display: "flex", justifyContent: "space-between" }}>
                  <button className="gov-btn-sec" onClick={() => setTaxStep(3)}>← 上一步</button>
                  <button className="gov-btn-primary" onClick={() => setTaxStep(5)}>下一步：稅額計算與方案比對 →</button>
                </div>
              </div>
            )}

            {/* 步驟 5: 稅額計算與三種報稅方案實測比對 */}
            {taxStep === 5 && (
              <div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "2px solid #e2e8f0", paddingBottom: 10, marginBottom: 16 }}>
                  <h3 style={{ margin: 0, color: "#1e3a8a", fontSize: 16 }}>
                    <span>⚖️ 申報稅額比對：三種合法申報計稅模式實測比較</span>
                  </h3>
                  <span className="gov-highlight" style={{ background: "#dcfce7", color: "#166534" }}>
                    系統推薦：方案 {bestOption}（預估最省稅）
                  </span>
                </div>

                {/* 方案選擇卡片 */}
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 16, marginBottom: 20 }}>
                  {/* 方案 A */}
                  <div
                    style={{
                      border: taxFilingMode === "joint" ? "2px solid #2563eb" : "1px solid #cbd5e1",
                      borderRadius: 8,
                      padding: 16,
                      background: taxFilingMode === "joint" ? "#eff6ff" : "#fff",
                      cursor: "pointer",
                      position: "relative"
                    }}
                    onClick={() => setTaxFilingMode("joint")}
                  >
                    {bestOption === "A" && (
                      <span style={{ position: "absolute", top: 10, right: 10, background: "#10b981", color: "#fff", fontSize: 10, padding: "2px 6px", borderRadius: 4, fontWeight: 700 }}>
                        ★ 最佳最省
                      </span>
                    )}
                    <div style={{ fontWeight: 800, fontSize: 14, color: "#1e3a8a", marginBottom: 6 }}>
                      方案 A：夫妻各類所得全數合併計稅
                    </div>
                    <div style={{ fontSize: 12, color: "#64748b", marginBottom: 10 }}>
                      股利採 8.5% 抵減稅額 (抵減 {fmt(divCreditA)})
                    </div>
                    <div style={{ fontSize: 22, fontWeight: 900, color: "#1e3a8a" }}>
                      {fmt(finalTaxA)}
                    </div>
                    <div style={{ fontSize: 11, color: "#64748b", marginTop: 6 }}>
                      綜合所得淨額：{fmt(netIncomeA)}
                    </div>
                  </div>

                  {/* 方案 B */}
                  <div
                    style={{
                      border: taxFilingMode === "separateSpouse" ? "2px solid #2563eb" : "1px solid #cbd5e1",
                      borderRadius: 8,
                      padding: 16,
                      background: taxFilingMode === "separateSpouse" ? "#eff6ff" : "#fff",
                      cursor: "pointer",
                      position: "relative"
                    }}
                    onClick={() => setTaxFilingMode("separateSpouse")}
                  >
                    {bestOption === "B" && (
                      <span style={{ position: "absolute", top: 10, right: 10, background: "#10b981", color: "#fff", fontSize: 10, padding: "2px 6px", borderRadius: 4, fontWeight: 700 }}>
                        ★ 最佳最省
                      </span>
                    )}
                    <div style={{ fontWeight: 800, fontSize: 14, color: "#1e3a8a", marginBottom: 6 }}>
                      方案 B：配偶薪資分開計稅，其餘合併
                    </div>
                    <div style={{ fontSize: 12, color: "#64748b", marginBottom: 10 }}>
                      避免高薪資推升全戶綜所稅累進稅率級距
                    </div>
                    <div style={{ fontSize: 22, fontWeight: 900, color: "#1e3a8a" }}>
                      {fmt(finalTaxB)}
                    </div>
                    <div style={{ fontSize: 11, color: "#64748b", marginTop: 6 }}>
                      配偶稅額 {fmt(spouseTaxB)} ＋ 主申報人稅額 {fmt(mainTaxB)}
                    </div>
                  </div>

                  {/* 方案 C */}
                  <div
                    style={{
                      border: taxFilingMode === "dividendSeparate" ? "2px solid #2563eb" : "1px solid #cbd5e1",
                      borderRadius: 8,
                      padding: 16,
                      background: taxFilingMode === "dividendSeparate" ? "#eff6ff" : "#fff",
                      cursor: "pointer",
                      position: "relative"
                    }}
                    onClick={() => setTaxFilingMode("dividendSeparate")}
                  >
                    {bestOption === "C" && (
                      <span style={{ position: "absolute", top: 10, right: 10, background: "#10b981", color: "#fff", fontSize: 10, padding: "2px 6px", borderRadius: 4, fontWeight: 700 }}>
                        ★ 最佳最省
                      </span>
                    )}
                    <div style={{ fontWeight: 800, fontSize: 14, color: "#1e3a8a", marginBottom: 6 }}>
                      方案 C：股利按 28% 單一稅率分開計稅
                    </div>
                    <div style={{ fontSize: 12, color: "#64748b", marginBottom: 10 }}>
                      適合綜所稅率達 30% 或 40% 之高所得領息大戶
                    </div>
                    <div style={{ fontSize: 22, fontWeight: 900, color: "#1e3a8a" }}>
                      {fmt(finalTaxC)}
                    </div>
                    <div style={{ fontSize: 11, color: "#64748b", marginTop: 6 }}>
                      薪資稅額 {fmt(Math.round(calcTaxFromNet(netIncomeC)))} ＋ 股利稅額 {fmt(Math.round(totalDividends * 0.28))}
                    </div>
                  </div>
                </div>

                {/* 當前選定方案申報試算總表 */}
                <div style={{ background: "#f8fafc", border: "1px solid #cbd5e1", borderRadius: 8, padding: 18 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, borderBottom: "1px solid #cbd5e1", paddingBottom: 8 }}>
                    <div style={{ fontWeight: 800, color: "#1e3a8a", fontSize: 15 }}>
                      📄 財政部綜合所得稅結算申報試算總表（當前選擇：{taxFilingMode === "joint" ? "方案 A 全數合併" : taxFilingMode === "separateSpouse" ? "方案 B 配偶薪資分開" : "方案 C 股利28%分開"}）
                    </div>
                    <div style={{ fontSize: 13 }}>
                      最終應納稅額：<b style={{ fontSize: 18, color: "var(--seal)" }}>{fmt(currentTax)}</b>
                    </div>
                  </div>

                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 12, fontSize: 13, lineHeight: 1.8 }}>
                    <div>全戶綜合所得總額：<b>{fmt(mySalary + spouseSalary + totalDividends)}</b></div>
                    <div>全戶免稅額總計：<b style={{ color: "#2563eb" }}>-{fmt(totalExemptions)}</b></div>
                    <div>一般扣除額 ({deductionMethod === "standard" ? "標準" : "列舉"})：<b style={{ color: "#2563eb" }}>-{fmt(appliedDeduction)}</b></div>
                    <div>特別扣除額總計：<b style={{ color: "#2563eb" }}>-{fmt(totalSpecialDeductions)}</b></div>
                    <div>綜合所得淨額：<b>{fmt(netIncomeA)}</b></div>
                    <div>適用累進稅率：<b>20% (累進差額 $147,700)</b></div>
                    <div>股利可抵減稅額 (8.5%)：<b style={{ color: "#10b981" }}>-{fmt(divCreditA)}</b></div>
                    <div>合法節稅效益差額：<b style={{ color: "#10b981" }}>省下 {fmt(savedAmount)}</b></div>
                  </div>

                  <div style={{ marginTop: 14, paddingTop: 12, borderTop: "1px dashed #cbd5e1", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
                    <div style={{ fontSize: 12, color: "#64748b" }}>
                      ✅ 試算結果符合中華民國財政部賦稅署最新綜所稅法規規範，可直接供作 5 月報稅申報參考。
                    </div>
                    <div style={{ display: "flex", gap: 8 }}>
                      <button className="gov-btn-sec" onClick={() => window.print()}>🖨️ 列印申報檢核試算表</button>
                      <button className="gov-btn-primary" onClick={() => alert("🎉 模擬申報完成！您的報稅試算資料已儲存完畢。")}>
                        確認申報試算完成
                      </button>
                    </div>
                  </div>
                </div>

                <div style={{ marginTop: 20 }}>
                  <button className="gov-btn-sec" onClick={() => setTaxStep(4)}>← 返回修改扣除額</button>
                </div>
              </div>
            )}
          </div>
        </div>
      </section>
    );
  };

  // =========================================================================
  // 頁面 8: 財務規劃診斷
  // =========================================================================
  const renderFinancePlan = () => (
    <section>
      <div style={{ marginBottom: 16 }}>
        <h2 style={{ ...SF, fontSize: 18, ...ink, margin: 0 }}>🧭 核心財務健康度規劃診斷</h2>
        <p style={{ fontSize: 12, ...soft, margin: "4px 0 0" }}>資產負債平衡、緊急預備金水準與家庭收支健康評估</p>
      </div>

      <div className="metric-grid" style={{ marginBottom: 20 }}>
        <div className="card">
          <div style={{ fontSize: 12, ...soft }}>流動性預備金水準</div>
          <div style={{ ...SF, fontSize: 20, fontWeight: 700, color: "var(--green)", margin: "4px 0" }}>8.5 個月</div>
          <div style={{ fontSize: 11, ...soft }}>建議維持 6~12 個月家庭生活支出</div>
        </div>
        <div className="card">
          <div style={{ fontSize: 12, ...soft }}>負債所得比 (DTI)</div>
          <div style={{ ...SF, fontSize: 20, fontWeight: 700, color: "var(--ink)", margin: "4px 0" }}>32.4%</div>
          <div style={{ fontSize: 11, color: "var(--green)" }}>位於優良安全區間 (&lt; 40%)</div>
        </div>
        <div className="card">
          <div style={{ fontSize: 12, ...soft }}>被動收入覆蓋率</div>
          <div style={{ ...SF, fontSize: 20, fontWeight: 700, color: "var(--gold)", margin: "4px 0" }}>41.8%</div>
          <div style={{ fontSize: 11, ...soft }}>股息與基金收入涵蓋 4 成生活開支</div>
        </div>
      </div>
    </section>
  );

  // =========================================================================
  // 頁面 8-B: 遺產 & 財產轉移規劃 (含遺產稅規定、財產移轉規定、諮詢專業人士)
  // =========================================================================
  const renderEstatePlan = () => (
    <section>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20, flexWrap: "wrap", gap: 12 }}>
        <div>
          <h2 style={{ ...SF, fontSize: 20, ...ink, margin: 0 }}>🏛️ 遺產 & 財產轉移規劃專區</h2>
          <p style={{ fontSize: 12, ...soft, margin: "4px 0 0" }}>
            全方位解析中華民國遺產及贈與稅法最新規定、財產跨代移轉路徑與高資產家族傳承避坑指南
          </p>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <span className="tag-gold" style={{ fontSize: 11, padding: "4px 10px" }}>依法傳承 ｜ 合法節稅</span>
          <span className="tag-blue" style={{ fontSize: 11, padding: "4px 10px" }}>防範爭產風險</span>
        </div>
      </div>

      {/* 多選項次級切換頁籤 (三大多選項) */}
      <div style={{ display: "flex", gap: 8, marginBottom: 22, flexWrap: "wrap" }}>
        {[
          { key: "estateTax", label: "📜 1. 遺產稅相關規定", desc: "免稅額、累進稅率、扣除額與特留分" },
          { key: "transferRules", label: "🔄 2. 財產移轉相關規定", desc: "生前贈與、買賣過戶、信託與保單實務" },
          { key: "consultPro", label: "🤝 3. 建議諮詢專業人士", desc: "會計師、地政士律師與信託顧問諮詢路徑" }
        ].map(tab => (
          <button
            key={tab.key}
            type="button"
            className={`tab-pill ${estateSubTab === tab.key ? "active" : ""}`}
            onClick={() => setEstateSubTab(tab.key)}
            style={{ display: "flex", flexDirection: "column", alignItems: "flex-start", padding: "8px 16px" }}
          >
            <span style={{ fontSize: 13, fontWeight: 700 }}>{tab.label}</span>
            <span style={{ fontSize: 10, opacity: 0.8, marginTop: 2 }}>{tab.desc}</span>
          </button>
        ))}
      </div>

      {/* =======================================================================
          選項 1: 遺產稅相關規定
          ======================================================================= */}
      {estateSubTab === "estateTax" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
          {/* 不動產淨值試算卡（房地產不列入退休可支配資產，僅作遺產規劃參考） */}
          {(() => {
            const mortgageBalAuto = (BACKEND_LOAN_DATA.mortgage || []).reduce(
              (sum, m) => sum + (Number(m.remaining) || 0), 0
            );
            const finalMortgageBal = mortgageBalAuto > 0 ? mortgageBalAuto : estateMortgageBalanceManual;
            const realEstateNet = estateRealEstateMarketVal - finalMortgageBal;
            return (
              <div className="card" style={{ borderLeft: "4px solid var(--blue)" }}>
                <h3 style={{ ...SF, fontSize: 16, ...ink, margin: "0 0 12px", display: "flex", alignItems: "center", gap: 8 }}>
                  <span>🏠</span> 不動產淨值試算（僅供遺產規劃參考，非退休可支配資產）
                </h3>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 14 }}>
                  <div>
                    <div style={{ fontSize: 12, ...soft, marginBottom: 4 }}>房產市場總估值</div>
                    <div style={{ ...SF, fontSize: 20, fontWeight: 700, ...ink }}>${fmt(estateRealEstateMarketVal)}</div>
                  </div>
                  <div>
                    <div style={{ fontSize: 12, ...soft, marginBottom: 4 }}>房貸剩餘總額</div>
                    <div style={{ ...SF, fontSize: 20, fontWeight: 700, color: "#dc2626" }}>${fmt(finalMortgageBal)}</div>
                    {mortgageBalAuto > 0 && (
                      <div style={{ fontSize: 10, color: "#94a3b8", marginTop: 2 }}>（已自動同步房貸模組資料）</div>
                    )}
                  </div>
                  <div>
                    <div style={{ fontSize: 12, ...soft, marginBottom: 4 }}>不動產淨值</div>
                    <div style={{ ...SF, fontSize: 20, fontWeight: 700, color: "var(--green)" }}>${fmt(realEstateNet)}</div>
                  </div>
                </div>
                <div style={{ marginTop: 12, fontSize: 11, ...soft, lineHeight: 1.6 }}>
                  此淨值僅列入遺產規劃／財產移轉試算的參考基礎，<b>不計入退休生活可支配資產</b>
                  （房屋預設僅供自住使用，退休試算不假設變現）。市場估值請自行依實價登錄或
                  最新市場行情更新，本試算不會自動追蹤房價變動。
                </div>
              </div>
            );
          })()}

          {/* 核心重點概覽卡 */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 14 }}>
            <div className="card" style={{ borderLeft: "4px solid var(--seal)" }}>
              <div style={{ fontSize: 12, ...soft, marginBottom: 4 }}>遺產稅基本免稅額 (2024~2026年)</div>
              <div style={{ ...SF, fontSize: 24, fontWeight: 700, color: "var(--seal)" }}>NT$ 1,333 萬元</div>
              <div style={{ fontSize: 11, ...soft, marginTop: 4 }}>軍公教公務殉職另加倍（2,666 萬）</div>
            </div>
            <div className="card" style={{ borderLeft: "4px solid var(--green)" }}>
              <div style={{ fontSize: 12, ...soft, marginBottom: 4 }}>配偶扣除額 (無條件可扣)</div>
              <div style={{ ...SF, fontSize: 24, fontWeight: 700, color: "var(--green)" }}>NT$ 553 萬元</div>
              <div style={{ fontSize: 11, ...soft, marginTop: 4 }}>民法第1030條之1配偶請求權可再扣除</div>
            </div>
            <div className="card" style={{ borderLeft: "4px solid var(--blue)" }}>
              <div style={{ fontSize: 12, ...soft, marginBottom: 4 }}>直系血親卑親屬扣除額</div>
              <div style={{ ...SF, fontSize: 24, fontWeight: 700, color: "var(--blue)" }}>NT$ 56 萬 / 每人</div>
              <div style={{ fontSize: 11, ...soft, marginTop: 4 }}>未成年者每年另加扣 56 萬元</div>
            </div>
            <div className="card" style={{ borderLeft: "4px solid var(--gold)" }}>
              <div style={{ fontSize: 12, ...soft, marginBottom: 4 }}>喪葬費不需單據定額扣除</div>
              <div style={{ ...SF, fontSize: 24, fontWeight: 700, color: "var(--gold)" }}>NT$ 138 萬元</div>
              <div style={{ fontSize: 11, ...soft, marginTop: 4 }}>重度身心障礙者每人另扣 693 萬元</div>
            </div>
          </div>

          {/* 累進稅率級距表 */}
