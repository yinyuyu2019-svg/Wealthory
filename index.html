// 依目前投資組合「市值佔比」加權平均各標的「近5年年化報酬率」，
// 取代退休試算原本的手動假設報酬率下拉選單。
// fiveYearReturn 未填的標的以 5% 保守值代入，並計入 missingCount 供畫面警示。
// 依據勞工保險條例第 58 條之 2 計算老年年金（含提前請領減額與延後請領展延機制）
// 法定全額請領年齡為 65 歲。
// 每提前 1 年減給 4%，最多提前 5 年減給 20%（60 歲請領為 80%）；
// 每延後 1 年增給 4%，最多延後 5 年增給 20%（70 歲請領為 120%）。
const calcLaborInsurancePension = (wageCap, workYears, targetAge) => {
  const LEGAL_RETIRE_AGE = 65;
  const ageDiff = targetAge - LEGAL_RETIRE_AGE; // < 0 提前, > 0 延後
  let rateAdj = 0;
  let statusText = "法定全額請領 (65歲基準 100%)";
  let tagType = "tag-g";

  if (ageDiff < 0) {
    const earlyYears = Math.min(5, Math.abs(ageDiff));
    rateAdj = -(earlyYears * 0.04);
    statusText = `提前請領減額 -${(Math.abs(rateAdj) * 100).toFixed(0)}% (提前 ${earlyYears} 年)`;
    tagType = "tag-s";
  } else if (ageDiff > 0) {
    const delayYears = Math.min(5, ageDiff);
    rateAdj = delayYears * 0.04;
    statusText = `延後請領展延 +${(rateAdj * 100).toFixed(0)}% (展延 ${delayYears} 年)`;
    tagType = "tag-gold";
  }

  const factor = 1 + rateAdj;
  // 法定兩式擇優計算：
  // 第 1 式：平均月投保薪資 × 年資 × 0.775% + 3,000 元
  // 第 2 式：平均月投保薪資 × 年資 × 1.55%
  const f1 = Math.round((wageCap * workYears * 0.00775 + 3000) * factor);
  const f2 = Math.round((wageCap * workYears * 0.0155) * factor);
  const monthly = Math.max(f1, f2);

  return {
    monthly,
    factor,
    rateAdj,
    ageDiff,
    statusText,
    tagType,
    formulaUsed: f2 >= f1 ? "第 2 式" : "第 1 式",
    rawMonthly: Math.round(wageCap * workYears * 0.0155),
    earlyOrDelayedText: ageDiff < 0 ? `提前 ${Math.min(5, Math.abs(ageDiff))} 年請領，依法終身減額 ${(Math.abs(rateAdj) * 100).toFixed(0)}%` : ageDiff > 0 ? `延後 ${Math.min(5, ageDiff)} 年請領，依法終身增給 ${(rateAdj * 100).toFixed(0)}%` : "達法定 65 歲請領年齡，享 100% 全額給付",
  };
};

const calcPortfolioWeighted5YReturn = (twStocks, usStocks, funds, golds) => {
  let weightedSum = 0;
  let totalMarketVal = 0;
  let missingCount = 0;
  const FALLBACK_RETURN = 5;

  const addHolding = (marketVal, fiveYearReturn) => {
    if (!marketVal || marketVal <= 0) return;
    const missing = fiveYearReturn === undefined || fiveYearReturn === null || fiveYearReturn === "";
    const r = missing ? FALLBACK_RETURN : Number(fiveYearReturn);
    if (missing) missingCount += 1;
    weightedSum += marketVal * r;
    totalMarketVal += marketVal;
  };

  (twStocks || []).forEach(s => addHolding((Number(s.currentPrice) || 0) * (Number(s.shares) || 0), s.fiveYearReturn));
  (usStocks || []).forEach(s => addHolding((Number(s.currentPrice) || 0) * (Number(s.shares) || 0) * 32.2, s.fiveYearReturn));
  (funds || []).forEach(f => {
    const rate = f.currency === "USD" ? 32.2 : 1;
    addHolding((Number(f.nav) || 0) * (Number(f.shares) || 0) * rate, f.fiveYearReturn);
  });
  (golds || []).forEach(g => addHolding((Number(g.currentPrice) || 0) * (Number(g.weight) || 0), g.fiveYearReturn));

  if (totalMarketVal <= 0) {
    return { weightedReturnPct: 5, totalMarketVal: 0, missingCount: 0, hasData: false };
  }
  return {
    weightedReturnPct: Math.round((weightedSum / totalMarketVal) * 10) / 10,
    totalMarketVal: Math.round(totalMarketVal),
    missingCount,
    hasData: true,
  };
};

const getMortalityLifeExp = (gender, age) => {
  const table = typeof TAIWAN_7TH_MORTALITY_TABLE !== "undefined" ? TAIWAN_7TH_MORTALITY_TABLE : [];
  if (!table.length) return { lifeExp: Math.max(10, 85 - age), expectedDeathAge: Math.max(85, age + 10) };
  const sorted = [...table].sort((a, b) => a.age - b.age);
  let matched = sorted[0];
  for (let i = 0; i < sorted.length; i++) {
    if (sorted[i].age <= age) matched = sorted[i];
    else break;
  }
  const isFemale = gender === "female" || gender === "女";
  const rawExp = isFemale ? matched.femaleLifeExp : matched.maleLifeExp;
  const lifeExp = Math.max(5, Math.round(rawExp * 10) / 10);
  return { lifeExp, expectedDeathAge: Math.round((age + lifeExp) * 10) / 10 };
};

const calcDays = (d1, d2) => {
  try {
    const diff = Math.abs(new Date(d2) - new Date(d1));
    return Math.ceil(diff / (1000 * 60 * 60 * 24));
  } catch (e) { return 0; }
};

function SealProgress({ percent }) {
  const r = 46, c = 2 * Math.PI * r, off = c - (Math.min(100, percent) / 100) * c;
  return (
    <div style={{ position: "relative", width: 116, height: 116, flexShrink: 0 }}>
      <svg viewBox="0 0 108 108" style={{ width: "100%", height: "100%", transform: "rotate(-90deg)" }}>
        <circle cx="54" cy="54" r={r} fill="none" stroke="var(--line)" strokeWidth="2.5" />
        <circle cx="54" cy="54" r={r} fill="none" stroke="var(--seal)" strokeWidth="3.5" strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off} style={{ transition: "stroke-dashoffset 700ms ease" }} />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
        <span style={{ fontFamily: "Noto Serif TC,serif", fontSize: 26, lineHeight: 1, color: "var(--ink)", fontWeight: 700 }}>{percent}</span>
        <span style={{ fontSize: 11, color: "var(--ink-soft)", marginTop: 2 }}>% 達成</span>
      </div>
    </div>
  );
}

function LoanBar({ total, remaining }) {
  const paid = total - remaining, pct = Math.round((paid / total) * 100);
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "var(--ink-soft)", marginBottom: 4 }}>
        <span>已清償 {pct}%</span><span>{fmt(paid)} / {fmt(total)}</span>
      </div>
      <div style={{ width: "100%", height: 6, borderRadius: 3, background: "var(--line-soft)" }}>
        <div style={{ width: `${pct}%`, height: 6, borderRadius: 3, background: "var(--seal)", transition: "width 600ms" }} />
      </div>
    </div>
  );
}

function Tag({ type }) {
  const iv = type === "invoice";
  return (
    <span style={{
      fontSize: 11,
      padding: "2px 8px",
      borderRadius: 999,
      background: iv ? "var(--seal-soft)" : "var(--line-soft)",
      color: iv ? "var(--seal)" : "var(--ink-soft)",
      fontWeight: 600
    }}>
      {iv ? "🧾 電子發票" : "✍️ 手動記帳"}
    </span>
  );
}

// 投資組合通用分頁組件 (資料超過 5 筆自動分頁)
function TablePagination({ current, totalPages, totalItems, pageSize, onPageChange }) {
  if (totalItems <= pageSize || totalPages <= 1) return null;

  return (
    <div style={{
      display: "flex",
      justifyContent: "space-between",
      alignItems: "center",
      padding: "10px 14px",
      borderTop: "1px solid var(--line-soft)",
      background: "#faf9f6",
      flexWrap: "wrap",
      gap: 8,
      fontSize: 12
    }}>
      <div style={{ color: "var(--ink-soft)" }}>
        顯示第 <b>{(current - 1) * pageSize + 1}</b> - <b>{Math.min(current * pageSize, totalItems)}</b> 筆 ｜ 共 <b>{totalItems}</b> 筆標的 (第 {current} / {totalPages} 頁)
      </div>
      <div style={{ display: "flex", gap: 5, alignItems: "center" }}>
        <button
          className="btn"
          style={{
            padding: "4px 10px",
            fontSize: 12,
            background: current === 1 ? "var(--line-soft)" : "#fff",
            color: current === 1 ? "var(--ink-soft)" : "var(--ink)",
            border: "1px solid var(--line)",
            cursor: current === 1 ? "not-allowed" : "pointer"
          }}
          disabled={current === 1}
          onClick={() => onPageChange(current - 1)}
        >
          上一頁
        </button>
        {Array.from({ length: totalPages }, (_, i) => i + 1).map(p => (
          <button
            key={p}
            style={{
              padding: "4px 9px",
              fontSize: 12,
              borderRadius: 4,
              border: p === current ? "1px solid var(--seal)" : "1px solid var(--line)",
              background: p === current ? "var(--seal)" : "#fff",
              color: p === current ? "#fff" : "var(--ink)",
              fontWeight: p === current ? 700 : 500,
              cursor: "pointer",
              minWidth: 28
            }}
            onClick={() => onPageChange(p)}
          >
            {p}
          </button>
        ))}
        <button
          className="btn"
          style={{
            padding: "4px 10px",
            fontSize: 12,
            background: current === totalPages ? "var(--line-soft)" : "#fff",
            color: current === totalPages ? "var(--ink-soft)" : "var(--ink)",
            border: "1px solid var(--line)",
            cursor: current === totalPages ? "not-allowed" : "pointer"
          }}
          disabled={current === totalPages}
          onClick={() => onPageChange(current + 1)}
        >
          下一頁
        </button>
      </div>
    </div>
  );
}

                  <th style={{ width: "30%" }}>比例視覺條</th>
                </tr>
              </thead>
              <tbody>
                {expByCat.map(([cat, v]) => {
                  const pct = expTotalFilt ? Math.round((v.amount / expTotalFilt) * 100) : 0;
                  return (
                    <tr key={cat}>
                      <td style={{ fontWeight: 600 }}>{cat}</td>
                      <td style={{ textAlign: "center" }}>{v.count} 筆</td>
                      <td style={{ textAlign: "right", fontWeight: 700 }}>{fmt(v.amount)}</td>
                      <td style={{ textAlign: "right", color: "var(--seal)", fontWeight: 700 }}>{pct}%</td>
                      <td>
                        <div style={{ width: "100%", height: 7, borderRadius: 4, background: "var(--line-soft)" }}>
                          <div style={{ width: `${pct}%`, height: 7, borderRadius: 4, background: "var(--seal)", transition: "width 0.4s" }} />
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {/* 手動新增一筆支出表單卡片 */}
      <div className="card" style={{ marginBottom: 24 }}>
        <div style={{ fontSize: 14, fontWeight: 700, ...ink, marginBottom: 14, display: "flex", alignItems: "center", gap: 6 }}>
          <span>✍️ 手動快速新增支出（【{scope === "personal" ? "個人" : "家庭"}】賬戶）</span>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 10, alignItems: "center" }}>
          <div>
            <div style={{ fontSize: 11, ...soft, marginBottom: 4 }}>消費日期</div>
            <input type="date" className="inp" value={eDate} onChange={e => setEDate(e.target.value)} />
          </div>
          <div>
            <div style={{ fontSize: 11, ...soft, marginBottom: 4 }}>消費類別</div>
            <select className="inp" value={eCat} onChange={e => setECat(e.target.value)}>
              {CATEGORIES.map(c => (
                <option key={c} value={c}>{c}</option>
              ))}
            </select>
          </div>
          <div>
            <div style={{ fontSize: 11, ...soft, marginBottom: 4 }}>消費說明 / 店名備註</div>
            <input className="inp" placeholder="例：午餐便當 / 超商買水" value={eNote} onChange={e => setENote(e.target.value)} />
          </div>
          <div>
            <div style={{ fontSize: 11, ...soft, marginBottom: 4 }}>消費金額 (NT$)</div>
            <input className="inp" placeholder="例：150" type="number" value={eAmt} onChange={e => setEAmt(e.target.value)} />
          </div>
          <div style={{ alignSelf: "flex-end" }}>
            <button className="btn" style={{ width: "100%", padding: "10px 0" }} onClick={addExp}>
              ＋ 儲存支出
            </button>
          </div>
        </div>
      </div>

      {/* 消費流水明細清單 */}
      <div className="card">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontSize: 14, fontWeight: 700, ...ink }}>
            📋 消費支出流水明細 ({expDetailList.length} 筆)
          </div>
          <div style={{ fontSize: 11, ...soft }}>包含電子發票自動彙入與手動自記流水</div>
        </div>
        {expDetailList.length === 0 ? (
          <div style={{ textAlign: "center", padding: "32px 0", ...soft, fontSize: 13 }}>目前尚無消費明細</div>
        ) : (
          <div className="ft-table-wrapper" style={{ maxHeight: 420, overflowY: "auto" }}>
            <table className="ft">
              <thead>
                <tr>
                  <th>日期</th>
                  <th>分類</th>
                  <th>來源管道</th>
                  <th>消費明細備註</th>
                  <th style={{ textAlign: "right" }}>金額 (NT$)</th>
                  <th style={{ textAlign: "center", width: 70 }}>操作</th>
                </tr>
              </thead>
              <tbody>
                {expDetailList.map(r => (
                  <tr key={r.id}>
                    <td style={{ whiteSpace: "nowrap", fontFamily: "monospace" }}>{r.date}</td>
                    <td><span className="tag-readonly">{r.category}</span></td>
                    <td><Tag type={r.type} /></td>
                    <td style={{ fontWeight: 500, color: "var(--ink)" }}>{r.note}</td>
                    <td style={{ textAlign: "right", fontWeight: 700, color: "var(--ink)" }}>{fmt(r.amount)}</td>
                    <td style={{ textAlign: "center" }}>
                      <button className="del" onClick={() => delExp(r.id)}>刪除</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </section>
  );

  // =========================================================================
  // 頁面 2: 資料表 (個人本人與家庭成員合一，配偶長輩/子女/寵物需訂閱解鎖)
  // =========================================================================
  const renderProfiles = () => (
    <section>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20, flexWrap: "wrap", gap: 10 }}>
        <div>
          <h2 style={{ ...SF, fontSize: 20, ...ink, margin: 0 }}>📑 核心資料表 (個人本人 ＆ 家庭成員)</h2>
          <p style={{ fontSize: 12, ...soft, margin: "4px 0 0" }}>
            本人基本資料永久開放 ｜ 配偶、長輩、子女培育與寵物照護檔案需 Premier 尊榮訂閱解鎖
          </p>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          {isPremier ? (
            <span className="tag-gold" style={{ padding: "6px 12px", fontSize: 12 }}>
              👑 Premier 尊榮方案會員（已解鎖全家檔案）
            </span>
          ) : (
            <button className="btn" style={{ background: "linear-gradient(135deg, #B8860B, #D4AF37)", color: "#1C2430" }} onClick={() => setShowUpgradeModal(true)}>
              ⭐ 升級 Premier 解鎖全家資料
            </button>
          )}
        </div>
      </div>

      {/* 1. 本人基本資料 (支援首次自行輸入、儲存鎖定、聯絡服務台與月薪/年薪雙軌) */}
      <div style={{ marginBottom: 28 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 18 }}>👤</span>
            <h3 style={{ ...SF, fontSize: 17, ...ink, margin: 0 }}>本人基本資料與任職檔案</h3>
          </div>

          {/* 需求 2, 3, 4: 未儲存鎖定時顯示儲存按鈕，已鎖定時顯示「聯絡服務台修改資料」與「後端鎖定(唯讀)」 */}
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            {isProfileLocked ? (
              <>
                <button
                  type="button"
                  className="btnl"
                  onClick={() => setShowContactSupportModal(true)}
                  style={{
                    fontSize: 12,
                    fontWeight: 700,
                    padding: "6px 14px",
                    background: "#ffffff",
                    color: "#1e40af",
                    border: "1px solid #bfdbfe",
                    borderRadius: 6,
                    display: "flex",
                    alignItems: "center",
                    gap: 6,
                    cursor: "pointer",
                    boxShadow: "0 1px 2px rgba(0,0,0,0.05)"
                  }}
                >
                  <span>📞</span> 聯絡服務台修改資料
                </button>
                <span className="tag-readonly" style={{ padding: "6px 12px", fontSize: 12, fontWeight: 700 }}>
                  🔒 個人資料後端鎖定（唯讀）
                </span>
              </>
            ) : (
              <button
                type="button"
                className="btn"
                onClick={handleLockProfile}
                style={{
                  background: "linear-gradient(135deg, #10b981, #059669)",
                  color: "#ffffff",
                  padding: "7px 18px",
                  fontSize: 12,
                  fontWeight: 800,
                  borderRadius: 6,
                  display: "flex",
                  alignItems: "center",
                  gap: 6,
                  boxShadow: "0 2px 5px rgba(16,185,129,0.3)",
                  cursor: "pointer"
                }}
              >
                <span>💾</span> 儲存個人資料 (僅此一次機會)
              </button>
            )}
          </div>
        </div>

        {/* 需求 3: 未鎖定時，醒目告示橫幅告知只有一次機會輸入 */}
        {!isProfileLocked && (
          <div style={{
            background: "linear-gradient(135deg, #fffbeb, #fef3c7)",
            border: "1px solid #fde68a",
            borderRadius: 8,
            padding: "12px 16px",
            marginBottom: 16,
            display: "flex",
            alignItems: "center",
            gap: 12
          }}>
            <span style={{ fontSize: 24 }}>⚠️</span>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 13, fontWeight: 800, color: "#92400e" }}>
                首次登入檔案填寫須知：本系統每人僅有「一次輸入機會」！
              </div>
              <div style={{ fontSize: 12, color: "#b45309", marginTop: 2, lineHeight: 1.5 }}>
                初次登入可自行完整輸入個人全部資料（包含姓名、會員號碼識別、所屬行業類別、起薪年齡、月收與年收等）。確認輸入無誤後點擊上方<b>「儲存個人資料」</b>，資料將立即<b>送交後端加密鎖定，之後即不可自行修改</b>。若日後需要更正，須點擊「聯絡服務台修改資料」申請人工核驗。
              </div>
            </div>
          </div>
        )}

        <div className="card" style={{ borderTop: "4px solid var(--ink)" }}>
          {/* 上半部：姓名、會員號碼識別與驗證狀態 */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, borderBottom: "1px solid var(--line-soft)", paddingBottom: 12, flexWrap: "wrap", gap: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12, flex: 1, minWidth: 260 }}>
              <div style={{ width: 48, height: 48, borderRadius: "50%", background: "var(--ink)", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, fontWeight: 700, flexShrink: 0 }}>
                {userProfile.name ? userProfile.name.slice(0, 1) : "👤"}
              </div>
              {isProfileLocked ? (
                <div>
                  <div style={{ fontSize: 18, fontWeight: 700, ...ink }}>{userProfile.name}</div>
                  <div style={{ fontSize: 12, ...soft }}>會員號碼識別：<span style={{ fontFamily: "monospace", fontWeight: 700, color: "var(--ink)" }}>{userProfile.memberNumber || userProfile.idNumber}</span></div>
                </div>
              ) : (
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, flex: 1 }}>
                  <div>
                    <label style={{ fontSize: 11, ...soft, display: "block", marginBottom: 2 }}>本人真實姓名：</label>
                    <input
                      className="inp"
                      placeholder="請輸入姓名"
                      value={userProfile.name || ""}
                      onChange={e => setUserProfile(prev => ({ ...prev, name: e.target.value }))}
                      style={{ padding: "6px 8px", fontSize: 14, fontWeight: 700 }}
                    />
                  </div>
                  <div>
                    <label style={{ fontSize: 11, ...soft, display: "block", marginBottom: 2 }}>會員號碼識別：</label>
                    <input
                      className="inp"
                      placeholder="例：MEM-88920412"
                      value={userProfile.memberNumber || userProfile.idNumber || ""}
                      onChange={e => setUserProfile(prev => ({ ...prev, memberNumber: e.target.value, idNumber: e.target.value }))}
                      style={{ padding: "6px 8px", fontSize: 13, fontFamily: "monospace" }}
                    />
                  </div>
                </div>
              )}
            </div>
            <span className="tag-g">
              {isProfileLocked ? "在職員工檔案已驗證鎖定" : "首次登入・資料輸入編輯中"}
            </span>
          </div>

          {/* 下半部：詳細各項資料 Grid */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(230px,1fr))", gap: 14 }}>
            {/* 1. 出生年月日與性別 */}
            <div style={{ background: "var(--paper)", padding: 12, borderRadius: 6 }}>
              <div style={{ fontSize: 11, ...soft, marginBottom: 4 }}>出生年月日 / 生理性別</div>
              {isProfileLocked ? (
                <div style={{ fontSize: 15, fontWeight: 700, ...ink }}>
                  {userProfile.birthDate} ({profileAge} 歲) ｜ {userProfile.gender === "female" ? "女性 ♀" : "男性 ♂"}
                </div>
              ) : (
                <div style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr", gap: 6 }}>
                  <input
                    type="date"
                    className="inp"
                    value={userProfile.birthDate || ""}
                    onChange={e => setUserProfile(prev => ({ ...prev, birthDate: e.target.value }))}
                    style={{ padding: "4px 6px", fontSize: 13 }}
                  />
                  <select
                    className="inp"
                    value={userProfile.gender || "female"}
                    onChange={e => setUserProfile(prev => ({ ...prev, gender: e.target.value }))}
                    style={{ padding: "4px 6px", fontSize: 13 }}
                  >
                    <option value="female">女性 ♀</option>
                    <option value="male">男性 ♂</option>
                  </select>
                </div>
              )}
            </div>

            {/* 2. 起薪投保年齡 (開始工作年齡) */}
            <div style={{ background: "var(--paper)", padding: 12, borderRadius: 6 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                <div style={{ fontSize: 11, ...soft }}>起薪投保年齡 (計算退休年資)</div>
                <span style={{ fontSize: 10, color: userProfile.startWorkAge ? "var(--green)" : "var(--amber)", fontWeight: 700 }}>
                  {userProfile.startWorkAge ? "✓ 已設定(連動退休頁)" : "未設定(退休頁自選)"}
                </span>
              </div>
              {isProfileLocked ? (
                <div style={{ fontSize: 14, fontWeight: 700, ...ink }}>
                  {userProfile.startWorkAge ? `${userProfile.startWorkAge} 歲起進入職場` : "未設定 (由退休規劃自選)"}
                </div>
              ) : (
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <input
                    type="number"
                    min="16"
                    max="40"
                    placeholder="例：25"
                    value={userProfile.startWorkAge !== undefined && userProfile.startWorkAge !== null ? userProfile.startWorkAge : ""}
                    onChange={e => {
                      const val = e.target.value === "" ? "" : Number(e.target.value);
                      setUserProfile(prev => ({ ...prev, startWorkAge: val }));
                    }}
                    style={{
                      width: 90,
                      padding: "4px 8px",
                      fontSize: 13,
                      fontWeight: 700,
                      borderRadius: 4,
                      border: "1px solid var(--line)",
                      background: "#fff",
                      color: "var(--ink)"
                    }}
                  />
                  <span style={{ fontSize: 13, fontWeight: 600, ...ink }}>歲起進入職場</span>
                </div>
              )}
            </div>

            {/* 3. 任職機構 / 公司 */}
            <div style={{ background: "var(--paper)", padding: 12, borderRadius: 6 }}>
              <div style={{ fontSize: 11, ...soft, marginBottom: 4 }}>任職機構 / 公司名稱</div>
              {isProfileLocked ? (
                <div style={{ fontSize: 14, fontWeight: 600, ...ink }}>{userProfile.company}</div>
              ) : (
                <input
                  className="inp"
                  placeholder="例：宏達數位科技股份有限公司"
                  value={userProfile.company || ""}
                  onChange={e => setUserProfile(prev => ({ ...prev, company: e.target.value }))}
                  style={{ padding: "4px 8px", fontSize: 13, width: "100%" }}
                />
              )}
            </div>

            {/* 4. 職位 / 職稱 */}
            <div style={{ background: "var(--paper)", padding: 12, borderRadius: 6 }}>
              <div style={{ fontSize: 11, ...soft, marginBottom: 4 }}>職位 / 專業職稱</div>
              {isProfileLocked ? (
                <div style={{ fontSize: 14, fontWeight: 600, ...ink }}>{userProfile.jobTitle}</div>
              ) : (
                <input
                  className="inp"
                  placeholder="例：資深軟體產品經理"
                  value={userProfile.jobTitle || ""}
                  onChange={e => setUserProfile(prev => ({ ...prev, jobTitle: e.target.value }))}
                  style={{ padding: "4px 8px", fontSize: 13, width: "100%" }}
                />
              )}
            </div>

            {/* 所屬行業類別 */}
            <div style={{ background: "var(--paper)", padding: 12, borderRadius: 6 }}>
              <div style={{ fontSize: 11, ...soft, marginBottom: 4 }}>所屬行業類別</div>
              {isProfileLocked ? (
                <div style={{ fontSize: 14, fontWeight: 700 }}>
                  <span className="tag-b" style={{ fontSize: 12, padding: "3px 8px" }}>
                    {userProfile.industry || "資訊軟體與高科技業"}
                  </span>
                </div>
              ) : (
                <select
                  className="inp"
                  value={userProfile.industry || "資訊軟體與高科技業"}
                  onChange={e => setUserProfile(prev => ({ ...prev, industry: e.target.value }))}
                  style={{ padding: "4px 8px", fontSize: 13, width: "100%" }}
                >
                  <option value="資訊軟體與高科技業">資訊軟體與高科技業</option>
                  <option value="金融證券與保險服務業">金融證券與保險服務業</option>
                  <option value="傳統製造與營造建築業">傳統製造與營造建築業</option>
                  <option value="醫療生技與公共衛生業">醫療生技與公共衛生業</option>
                  <option value="專業諮詢、會計與法律業">專業諮詢、會計與法律業</option>
                  <option value="批發零售與民生消費業">批發零售與民生消費業</option>
                  <option value="運輸物流與航運倉儲業">運輸物流與航運倉儲業</option>
                  <option value="觀光餐飲與休閒娛樂業">觀光餐飲與休閒娛樂業</option>
                  <option value="大眾傳播、出版與文化創意業">大眾傳播、出版與文化創意業</option>
                  <option value="教育學術與學術研究機構">教育學術與學術研究機構</option>
                  <option value="公共行政與公務機關">公共行政與公務機關</option>
                  <option value="自營商、自由職業或專案顧問">自營商、自由職業或專案顧問</option>
                  <option value="公教/勞工已退休領俸人員">公教/勞工已退休領俸人員</option>
                  <option value="家管 / 育嬰 / 其他行業類別">家管 / 育嬰 / 其他行業類別</option>
                </select>
              )}
            </div>

            {/* 5. 需求 5: 薪資增加每月份月收入 */}
            <div style={{ background: "var(--paper)", padding: 12, borderRadius: 6 }}>
              <div style={{ fontSize: 11, ...soft, marginBottom: 4 }}>每月份固定薪資 (月收)</div>
              {isProfileLocked ? (
                <div>
                  <div style={{ fontSize: 16, fontWeight: 800, color: "var(--green)" }}>
                    {fmt(userProfile.monthlyIncome || Math.round((userProfile.annualIncome || 0) / 12))} <span style={{ fontSize: 12, fontWeight: 500 }}>元/月</span>
                  </div>
                  <div style={{ fontSize: 11, color: "#64748b", marginTop: 2 }}>每月常態可支配現金流基準</div>
                </div>
              ) : (
                <div>
                  <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <input
                      type="number"
                      className="inp"
                      placeholder="例：85000"
                      value={userProfile.monthlyIncome !== undefined && userProfile.monthlyIncome !== null ? userProfile.monthlyIncome : ""}
                      onChange={e => {
                        const m = e.target.value === "" ? "" : Number(e.target.value);
                        setUserProfile(prev => ({
                          ...prev,
                          monthlyIncome: m,
                          // 自動建議年薪 (若年薪尚未手動指定，預設乘以 14 個月含年終)
                          annualIncome: m !== "" && (!prev.annualIncome || prev.annualIncome === (prev.monthlyIncome || 0) * 14) ? m * 14 : prev.annualIncome
                        }));
                      }}
                      style={{ padding: "4px 8px", fontSize: 14, fontWeight: 700, width: "100%" }}
                    />
                    <span style={{ fontSize: 12, fontWeight: 600, color: "#64748b", whiteSpace: "nowrap" }}>元/月</span>
                  </div>
                  <div style={{ fontSize: 10, color: "#64748b", marginTop: 2 }}>輸入月薪自動建議年收 (14個月)</div>
                </div>
              )}
            </div>

            {/* 6. 年度核定總薪資 (年收) */}
            <div style={{ background: "var(--paper)", padding: 12, borderRadius: 6 }}>
              <div style={{ fontSize: 11, ...soft, marginBottom: 4 }}>年度核定總薪資 (年收)</div>
              {isProfileLocked ? (
                <div>
                  <div style={{ fontSize: 16, fontWeight: 800, color: "var(--green)" }}>
                    {fmt(userProfile.annualIncome)} <span style={{ fontSize: 12, fontWeight: 500 }}>元/年</span>
                  </div>
                  <div style={{ fontSize: 11, color: "#64748b", marginTop: 2 }}>含固定本薪、績效獎金與年終</div>
                </div>
              ) : (
                <div>
                  <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <input
                      type="number"
                      className="inp"
                      placeholder="例：1250000"
                      value={userProfile.annualIncome !== undefined && userProfile.annualIncome !== null ? userProfile.annualIncome : ""}
                      onChange={e => {
                        const a = e.target.value === "" ? "" : Number(e.target.value);
                        setUserProfile(prev => ({ ...prev, annualIncome: a }));
                      }}
                      style={{ padding: "4px 8px", fontSize: 14, fontWeight: 700, width: "100%" }}
                    />
                    <span style={{ fontSize: 12, fontWeight: 600, color: "#64748b", whiteSpace: "nowrap" }}>元/年</span>
                  </div>

                      <input
                        className="inp"
                        placeholder="政府補助方案 (例如: 勞退/公保月退年金、敬老津貼、敬老悠遊卡)"
                        value={newMember.govSubsidy}
                        onChange={e => setNewMember({ ...newMember, govSubsidy: e.target.value })}
                      />
                      <input
                        className="inp"
                        placeholder="失能認定與身障津貼 (例如: 生活自理良好 / 具輕中度身障證明月領補助)"
                        value={newMember.disabilityStatus}
                        onChange={e => setNewMember({ ...newMember, disabilityStatus: e.target.value })}
                      />
                      <input
                        className="inp"
                        placeholder="長照 2.0 等級與隱形支出風險 (例如: 長照第2級 / 預估外籍看護月支出3.5萬)"
                        value={newMember.longTermCareRisk}
                        onChange={e => setNewMember({ ...newMember, longTermCareRisk: e.target.value })}
                      />
                    </div>
                  )}
                </>
              )}

              {addType === "children" && (
                <>
                  <div>
                    <div style={{ fontSize: 11, ...soft, marginBottom: 4 }}>行業 / 就學培育階段</div>
                    <select className="inp" value={newMember.industry || "國小/國中義務教育階段"} onChange={e => setNewMember({ ...newMember, industry: e.target.value })}>
                      <option value="幼兒/學齡前培育">幼兒/學齡前培育</option>
                      <option value="國小/國中義務教育階段">國小/國中義務教育階段</option>
                      <option value="高中職/專科教育階段">高中職/專科教育階段</option>
                      <option value="大專院校/研究所高等教育">大專院校/研究所高等教育</option>
                      <option value="海外留學/預備出國進修">海外留學/預備出國進修</option>
                      <option value="在學實習/職場新鮮人">在學實習/職場新鮮人</option>
                    </select>
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                    <input className="inp" placeholder="就讀學校" value={newMember.school} onChange={e => setNewMember({ ...newMember, school: e.target.value })} />
                    <input className="inp" placeholder="年級 (例如: 國小一年級)" value={newMember.grade} onChange={e => setNewMember({ ...newMember, grade: e.target.value })} />
                  </div>
                  <input className="inp" placeholder="已備教育準備金 (NT$)" type="number" value={newMember.educationFundReady} onChange={e => setNewMember({ ...newMember, educationFundReady: e.target.value })} />
                  <input className="inp" placeholder="培育規劃備註" value={newMember.note} onChange={e => setNewMember({ ...newMember, note: e.target.value })} />
                </>
              )}

              {addType === "pets" && (
                <>
                  <input className="inp" placeholder="晶片登記號碼 (15碼數字)" value={newMember.microchip} onChange={e => setNewMember({ ...newMember, microchip: e.target.value })} />
                  <input className="inp" placeholder="投保寵物保險公司與方案" value={newMember.insurance} onChange={e => setNewMember({ ...newMember, insurance: e.target.value })} />
                  <input className="inp" placeholder="照護紀錄或疫苗備註" value={newMember.note} onChange={e => setNewMember({ ...newMember, note: e.target.value })} />
                </>
              )}

              <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 10 }}>
                <button className="btnl" onClick={() => setShowAddModal(false)}>取消</button>
                <button className="btn" onClick={handleSaveMember}>儲存並加入家庭表</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </section>
  );

  // =========================================================================
  // =========================================================================
  // 頁面 3: 保險管理 (儲蓄型、投資型、人身醫療、財產保險，含頂部現金流精算收益框與原件圖片預覽)
  // =========================================================================
  const renderInsurance = () => {
    const totalInsuranceCount = (insuranceData.savings?.length || 0) + (insuranceData.investment?.length || 0) + (insuranceData.protective?.length || 0) + (insuranceData.property?.length || 0);

    // -----------------------------------------------------------------------
    // 保險收益精算 (1. 受益人限「本人」 2. 分幣別 TWD 與 USD 獨立統計)
    // -----------------------------------------------------------------------
    const USD_RATE = 32.2;

    // TWD 統計容器
    let twdSavGross = 0, twdSavNhi = 0, twdSavNet = 0, twdSavPrincipal = 0;
    let twdInvGross = 0, twdInvNet = 0, twdInvPrincipal = 0;

    // USD 統計容器
    let usdSavGross = 0, usdSavNet = 0, usdSavPrincipal = 0;
    let usdInvGross = 0, usdInvNet = 0, usdInvPrincipal = 0;

    // 排除非本人受益清單 (提供給 UI 透明提示)
    const excludedPolicies = [];

    // 1. 儲蓄險精算 (限「已付清」且受益人為「本人」方開始領利息；未付清處於供款累積期)
    insuranceData.savings?.forEach(s => {
      const isPaid = (Number(s.currentPeriod) || 0) >= (Number(s.totalPeriods) || 1);
      if (!isPaid) return; // ⚠️ 未付清保單處於供款累積期，尚未開始領利息！

      const isSelf = (s.interestBeneficiary || "").includes("本人");
      const mult = s.divFreq === "月配" ? 12 : s.divFreq === "季配" ? 4 : s.divFreq === "半年配" ? 2 : 1;
      const grossAnn = (Number(s.divAmt) || 0) * mult;
      const principal = Number(s.principal) || 0;

      if (!isSelf) {
        excludedPolicies.push({
          id: s.id,
          name: s.name,
          policyNo: s.policyNo,
          category: "儲蓄型保險",
          currency: s.currency,
          beneficiary: s.interestBeneficiary || "非本人",
          annualDiv: grossAnn
        });
        return; // ⚠️ 受益人非本人，不列入個人收益範圍！
      }

      if (s.currency === "USD") {
        usdSavGross += grossAnn;
        usdSavNet += grossAnn; // 美元保單依法免就源扣繳台灣二代健保
        usdSavPrincipal += principal;
      } else {
        // 新台幣儲蓄險 (單筆利息 >= 20,000 扣 2.11%)
        const isExceed20k = (Number(s.divAmt) || 0) >= 20000;
        const nhiCut = isExceed20k ? Math.round(grossAnn * 0.0211) : 0;
        const netAnn = Math.max(0, grossAnn - nhiCut);

        twdSavGross += grossAnn;
        twdSavNhi += nhiCut;
        twdSavNet += netAnn;
        twdSavPrincipal += principal;
      }
    });

    // 2. 投資型保單精算 (限「已付清」且受益人為「本人」方列入；投資型收益依法免扣二代健保)
    insuranceData.investment?.forEach(i => {
      const isPaid = (Number(i.currentPeriod) || 0) >= (Number(i.totalPeriods) || 1);
      if (!isPaid) return; // ⚠️ 未付清保單供款中，尚未開始領利息！

      const isSelf = (i.interestBeneficiary || "").includes("本人");
      const mult = i.divFreq === "年配" ? 1 : i.divFreq === "季配" ? 4 : 12; // 預設月配
      const grossAnn = (Number(i.divAmt) || 0) * mult;
      const principal = Number(i.principal) || 0;

      if (!isSelf) {
        excludedPolicies.push({
          id: i.id,
          name: i.name,
          policyNo: i.policyNo,
          category: "投資型保單",
          currency: i.currency,
          beneficiary: i.interestBeneficiary || "非本人",
          annualDiv: grossAnn
        });
        return; // ⚠️ 受益人非本人，不列入個人收益範圍！
      }

      if (i.currency === "USD") {
        usdInvGross += grossAnn;
        usdInvNet += grossAnn;
        usdInvPrincipal += principal;
      } else {
        twdInvGross += grossAnn;
        twdInvNet += grossAnn;
        twdInvPrincipal += principal;
      }
    });

    // --- TWD 統計指標 ---
    const twdTotalNet = twdSavNet + twdInvNet;
    const twdMonthlyNet = Math.round(twdTotalNet / 12);
    const twdTotalGross = twdSavGross + twdInvGross;
    const twdTotalNhi = twdSavNhi;
    const twdTotalPrincipal = twdSavPrincipal + twdInvPrincipal;
    const twdRoi = twdTotalPrincipal > 0 ? ((twdTotalNet / twdTotalPrincipal) * 100).toFixed(2) : "0.00";

    // --- USD 統計指標 ---
    const usdTotalNet = usdSavNet + usdInvNet;
    const usdMonthlyNet = usdTotalNet / 12;
    const usdTotalGross = usdSavGross + usdInvGross;
    const usdTotalPrincipal = usdSavPrincipal + usdInvPrincipal;
    const usdRoi = usdTotalPrincipal > 0 ? ((usdTotalNet / usdTotalPrincipal) * 100).toFixed(2) : "0.00";

    // --- 綜合折合 TWD 統計指標 (綜合檢視) ---
    const allTotalNetTWD = twdTotalNet + Math.round(usdTotalNet * USD_RATE);
    const allMonthlyNetTWD = Math.round(allTotalNetTWD / 12);
    const allTotalGrossTWD = twdTotalGross + Math.round(usdTotalGross * USD_RATE);
    const allTotalNhiTWD = twdTotalNhi;
    const allTotalPrincipalTWD = twdTotalPrincipal + Math.round(usdTotalPrincipal * USD_RATE);
    const allRoi = allTotalPrincipalTWD > 0 ? ((allTotalNetTWD / allTotalPrincipalTWD) * 100).toFixed(2) : "0.00";

    // -----------------------------------------------------------------------
    // 保費繳納精算（本月繳納 / 今年繳納）：統計未付清儲蓄型/投資型 + 人身醫療 + 財產保險
    // -----------------------------------------------------------------------
    let twdMonthPay = 0, twdYearPay = 0;
    let usdMonthPay = 0, usdYearPay = 0;

    // 1. 儲蓄型保險（未付清者需持續繳納保費）
    insuranceData.savings?.forEach(s => {
      const isPaid = (Number(s.currentPeriod) || 0) >= (Number(s.totalPeriods) || 1);
      if (isPaid) return;
      const mCost = Number(s.monthlyCost) || Math.round((Number(s.periodPremium) || 0) / 12);
      const yCost = (Number(s.monthlyCost) || Math.round((Number(s.periodPremium) || 0) / 12)) * 12;
      if (s.currency === "USD") {
        usdMonthPay += mCost;
        usdYearPay += yCost;
      } else {
        twdMonthPay += mCost;
        twdYearPay += yCost;
      }
    });

    // 2. 投資型保單（未付清者需持續繳納保費）
    insuranceData.investment?.forEach(i => {
      const isPaid = (Number(i.currentPeriod) || 0) >= (Number(i.totalPeriods) || 1);
      if (isPaid) return;
      const mCost = Number(i.monthlyCost) || (i.payFreq === "月繳" ? Number(i.periodPremium) || 0 : Math.round((Number(i.periodPremium) || 0) / 12));
      const yCost = mCost * 12;
      if (i.currency === "USD") {
        usdMonthPay += mCost;
        usdYearPay += yCost;
      } else {
        twdMonthPay += mCost;
        twdYearPay += yCost;
      }
    });

    // 3. 人身與醫療保障型保單（純防禦型固定支出保費，幣別以 TWD 為主）
    insuranceData.protective?.forEach(p => {
      const prem = Number(p.premium) || 0;
      twdYearPay += prem;
      twdMonthPay += Math.round(prem / 12);
    });

    // 4. 財產保險（車險、住宅火險、旅遊險等年度/單期防護支出）
    insuranceData.property?.forEach(pr => {
      const prem = Number(pr.premium) || 0;
      twdYearPay += prem;
      // 單次投保性質 (如旅平險) 排除在常態每月攤提保費之外
      if (pr.freq !== "單次投保" && pr.freq !== "單次") {
        twdMonthPay += Math.round(prem / 12);
      }
    });

    // 綜合折合 TWD 保費繳納統計
    const allMonthPayTWD = twdMonthPay + Math.round(usdMonthPay * USD_RATE);
    const allYearPayTWD = twdYearPay + Math.round(usdYearPay * USD_RATE);

    return (
      <section>
      {/* 頂部控制列 */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16, flexWrap: "wrap", gap: 8 }}>
        <div>
          <h2 style={{ ...SF, fontSize: 18, ...ink, margin: 0 }}>🛡️ 保險管理與配息稅務稽核</h2>
          <p style={{ fontSize: 12, ...soft, margin: "4px 0 0" }}>全保單被動現金流收益精算 ｜ 點擊任一保單即可調閱電子保單原始憑證</p>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <button
            className="btn"
            style={{ fontSize: 12, padding: "6px 14px", background: "var(--seal)", color: "#fff", display: "flex", alignItems: "center", gap: 4 }}
            onClick={() => {
              if (!isPremier && totalInsuranceCount >= 10) {
                alert("🔒 提醒：普通版保險保單（儲蓄型＋投資型＋人身醫療＋財產險）目前已滿 " + totalInsuranceCount + " 筆上限。如欲再增加新保單，必須升級 Premier 尊榮版或輸入優惠碼解鎖！");
                setShowUpgradeModal(true);
                return;
              }
              setNewPolicy({ ...defaultNewPolicy, category: insSubTab });
              setShowAddInsuranceModal(true);
            }}
          >
            ＋ 新增保單
          </button>
          <button
            className="btn"
            style={{ fontSize: 12, padding: "6px 14px", background: "#3B82F6", color: "#fff", display: "flex", alignItems: "center", gap: 4 }}
            onClick={() => {
              setInsuranceManageMode("edit");
              setShowManageInsuranceModal(true);
            }}
            title="開啟保單變更面板，修改保單資料"
          >
            ✏️ 修改保單
          </button>
          <button
            className="btnl"
            style={{ fontSize: 12, padding: "6px 14px", color: "#EF4444", borderColor: "#FCA5A5", background: "#FEF2F2", display: "flex", alignItems: "center", gap: 4 }}
            onClick={() => {
              setInsuranceManageMode("delete");
              setShowManageInsuranceModal(true);
            }}
            title="開啟保單刪除面板，移除指定保單"
          >
            🗑️ 刪除保單
          </button>
        </div>
      </div>

      {/* 🌟 核心需求 1 & 2：收益精算框 (限本人實領收益 + 不同幣別獨立統計) */}
      <div className="card" style={{ background: "linear-gradient(135deg, #1C2430 0%, #2A3B4C 100%)", color: "#fff", marginBottom: 20, border: "none", boxShadow: "0 4px 16px rgba(0,0,0,0.1)" }}>
        {/* 頂部幣別切換列 */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid rgba(255,255,255,0.15)", paddingBottom: 12, marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <span style={{ fontSize: 18 }}>🛡️</span>
            <span style={{ ...SF, fontSize: 16, fontWeight: 700, color: "#fff" }}>
              全保單被動現金流精算 (限本人實領收益 ｜ 幣別分流統計)
            </span>
            <span style={{ fontSize: 11, background: "rgba(16, 185, 129, 0.25)", color: "#6EE7B7", border: "1px solid rgba(52, 211, 153, 0.4)", padding: "2px 8px", borderRadius: 4, fontWeight: 600 }}>
              💡 投資型免扣二代健保 ｜ 非本人收益已剔除
            </span>
          </div>

          {/* 幣別切換 Tab 按鈕組 */}
          <div style={{ display: "flex", gap: 6, background: "rgba(0,0,0,0.3)", padding: 4, borderRadius: 8 }}>
            <button
              onClick={() => setInsCurrView("all")}
              style={{
                border: "none",
                borderRadius: 6,
                padding: "6px 12px",
                fontSize: 12,
                cursor: "pointer",
                fontWeight: 700,
                background: insCurrView === "all" ? "#fff" : "transparent",
                color: insCurrView === "all" ? "var(--ink)" : "#cbd5e1",
                transition: "all .15s"
              }}
            >
              🌐 雙幣綜合折算 (TWD)
            </button>
            <button
              onClick={() => setInsCurrView("TWD")}
              style={{
                border: "none",
                borderRadius: 6,
                padding: "6px 12px",
                fontSize: 12,
                cursor: "pointer",
                fontWeight: 700,
                background: insCurrView === "TWD" ? "#38BDF8" : "transparent",
                color: insCurrView === "TWD" ? "#0F172A" : "#cbd5e1",
                transition: "all .15s"
              }}
            >
              🇹🇼 新台幣 (TWD 專屬)
            </button>
            <button
              onClick={() => setInsCurrView("USD")}
              style={{
                border: "none",
                borderRadius: 6,
                padding: "6px 12px",
                fontSize: 12,
                cursor: "pointer",
                fontWeight: 700,
                background: insCurrView === "USD" ? "#FDE047" : "transparent",
                color: insCurrView === "USD" ? "#0F172A" : "#cbd5e1",
                transition: "all .15s"
              }}
            >
              🇺🇸 美元 (USD 專屬)
            </button>
          </div>
        </div>

        {/* 🌟 核心需求 2：不同幣別獨立統計速覽看板 */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(320px, 1fr))", gap: 12, marginBottom: 16 }}>
          {/* 新台幣獨立看板 */}
          <div
            onClick={() => setInsCurrView("TWD")}
            style={{
              background: insCurrView === "TWD" ? "rgba(56, 189, 248, 0.2)" : "rgba(255,255,255,0.06)",
              border: insCurrView === "TWD" ? "1.5px solid #38BDF8" : "1px solid rgba(255,255,255,0.12)",
              borderRadius: 8,
              padding: "10px 14px",
              cursor: "pointer",
              transition: "all .15s"
            }}
          >
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <span style={{ fontSize: 13, fontWeight: 700, color: "#38BDF8", display: "flex", alignItems: "center", gap: 6 }}>
                🇹🇼 新台幣 (TWD) 獨立保單統計 {insCurrView === "TWD" && <span style={{ fontSize: 11, background: "#38BDF8", color: "#0F172A", padding: "1px 6px", borderRadius: 4 }}>當前檢視</span>}
              </span>
              <span style={{ fontSize: 11, color: "#94A3B8" }}>點擊切換專屬指標 →</span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#E2E8F0", flexWrap: "wrap", gap: 8, marginBottom: 4 }}>
              <span>月均收益：<b style={{ color: "#FDE047" }}>{fmt(twdMonthlyNet)}</b></span>
              <span>年實領收益：<b style={{ color: "#4ADE80" }}>{fmt(twdTotalNet)}</b></span>
              <span>健保扣除：<b style={{ color: "#F87171" }}>-{fmt(twdTotalNhi)}</b></span>
              <span>年化：<b style={{ color: "#38BDF8" }}>{twdRoi}%</b></span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#cbd5e1", paddingTop: 4, borderTop: "1px dashed rgba(255,255,255,0.15)", flexWrap: "wrap", gap: 8 }}>
              <span>💳 本月應繳保費：<b style={{ color: "#FCA5A5" }}>{fmt(twdMonthPay)}</b></span>
              <span>📅 今年應繳總保費：<b style={{ color: "#F87171" }}>{fmt(twdYearPay)}</b></span>
            </div>
          </div>

          {/* 美元外幣獨立看板 */}
          <div
            onClick={() => setInsCurrView("USD")}
            style={{
              background: insCurrView === "USD" ? "rgba(253, 224, 71, 0.2)" : "rgba(255,255,255,0.06)",
              border: insCurrView === "USD" ? "1.5px solid #FDE047" : "1px solid rgba(255,255,255,0.12)",
              borderRadius: 8,
              padding: "10px 14px",
              cursor: "pointer",
              transition: "all .15s"
            }}
          >
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <span style={{ fontSize: 13, fontWeight: 700, color: "#FDE047", display: "flex", alignItems: "center", gap: 6 }}>
                🇺🇸 美元 (USD) 獨立保單統計 {insCurrView === "USD" && <span style={{ fontSize: 11, background: "#FDE047", color: "#0F172A", padding: "1px 6px", borderRadius: 4 }}>當前檢視</span>}
              </span>
              <span style={{ fontSize: 11, color: "#94A3B8" }}>點擊切換專屬指標 →</span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#E2E8F0", flexWrap: "wrap", gap: 8, marginBottom: 4 }}>
              <span>月均收益：<b style={{ color: "#FDE047" }}>{fmtUSD(usdMonthlyNet)}</b></span>
              <span>年實領收益：<b style={{ color: "#4ADE80" }}>{fmtUSD(usdTotalNet)}</b></span>
              <span>健保扣除：<b style={{ color: "#94A3B8" }}>$0.00 USD</b></span>
              <span>年化：<b style={{ color: "#38BDF8" }}>{usdRoi}%</b></span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#cbd5e1", paddingTop: 4, borderTop: "1px dashed rgba(255,255,255,0.15)", flexWrap: "wrap", gap: 8 }}>
              <span>💳 本月應繳保費：<b style={{ color: "#FCA5A5" }}>{fmtUSD(usdMonthPay)}</b></span>
              <span>📅 今年應繳總保費：<b style={{ color: "#F87171" }}>{fmtUSD(usdYearPay)}</b></span>
            </div>
          </div>
        </div>

        {/* 5 大核心精算卡片 (隨 insCurrView 切換展示純 TWD、純 USD 或 雙幣折算) */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(210px, 1fr))", gap: 16 }}>
          <div style={{ background: "rgba(255,255,255,0.08)", padding: 14, borderRadius: 6 }}>

      {/* 5. 家庭成員保單 (升級 Premier 尊榮版專屬功能) */}
      {insSubTab === "family" && (() => {
        // 家屬稱謂權重 (排序規則：配偶 -> 長輩/父親/母親 -> 子女/長女/長子 -> 毛小孩/寵物)
        const getRelationRank = (rel = "") => {
          if (rel.includes("配偶") || rel.includes("妻") || rel.includes("夫")) return 1;
          if (rel.includes("父") || rel.includes("母") || rel.includes("長輩") || rel.includes("公婆") || rel.includes("岳")) return 2;
          if (rel.includes("女") || rel.includes("子") || rel.includes("兒") || rel.includes("孫")) return 3;
          if (rel.includes("毛小孩") || rel.includes("寵物") || rel.includes("犬") || rel.includes("貓")) return 4;
          return 5;
        };

        const familyList = [...(insuranceData.family || [])].sort((a, b) => {
          const rankA = getRelationRank(a.relation);
          const rankB = getRelationRank(b.relation);
          if (rankA !== rankB) {
            return familySortOrder === "asc" ? rankA - rankB : rankB - rankA;
          }
          // 同一稱謂時輔助以名字排序
          return (a.memberName || "").localeCompare(b.memberName || "", "zh-Hant");
        });

                    title="點擊依家屬稱謂切換 順序 / 倒序 排序"
                  >
                    家屬稱謂 <span style={{ fontSize: 11, color: "var(--gold)" }}>{familySortOrder === "asc" ? "▲ 正序 (配偶→長輩→子女→毛孩)" : "▼ 倒序"}</span>
                  </th>
                  <th>家庭成員姓名</th>
                  <th>保單號碼</th>
                  <th>保單名稱</th>
                  <th>承保公司</th>
                  <th>險種組合與保障類別</th>
                  <th style={{ textAlign: "right" }}>繳費負擔</th>
                  <th style={{ textAlign: "right" }}>保障額度</th>
                  <th>指定受益人</th>
                  <th>保單狀態</th>
                  <th style={{ textAlign: "center" }}>操作</th>
                </tr>
              </thead>
              <tbody>
                {familyList.map(f => (
                  <tr
                    key={f.id}
                    style={{ cursor: isBlur ? "default" : "pointer" }}
                    onClick={() => {
                      if (!isBlur) {
                        setSelectedPolicy({ ...f, categoryName: `家庭成員保單 (${f.relation} - ${f.memberName})` });
                      }
                    }}
                    title={isBlur ? "" : "點擊調閱原始保單原件照與電子憑證"}
                  >
                    <td>
                      <span className={f.relation.includes("毛小孩") ? "tag-purple" : f.relation.includes("配偶") ? "tag-gold" : f.relation.includes("長輩") || f.relation.includes("父親") ? "tag-s" : "tag-blue"} style={{ fontWeight: 700, fontSize: 12 }}>
                        {f.relation}
                      </span>
                    </td>
                    <td>
                      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        <span style={{
                          width: 26,
                          height: 26,
                          borderRadius: "50%",
                          background: f.relation.includes("毛小孩") ? "var(--purple-soft)" : f.relation.includes("配偶") ? "var(--gold-soft)" : f.relation.includes("長輩") || f.relation.includes("父親") ? "var(--seal-soft)" : "var(--blue-soft)",
                          color: f.relation.includes("毛小孩") ? "var(--purple)" : f.relation.includes("配偶") ? "var(--gold)" : f.relation.includes("長輩") || f.relation.includes("父親") ? "var(--seal)" : "var(--blue)",
                          display: "inline-flex",
                          alignItems: "center",
                          justifyContent: "center",
                          fontSize: 13,
                          fontWeight: 700
                        }}>
                          {f.relation.includes("毛小孩") ? "🐾" : f.memberName.slice(0, 1)}
                        </span>
                        <b style={{ color: "var(--ink)" }}>{f.memberName}</b>
                      </div>
                    </td>
                    <td style={{ fontFamily: "monospace", fontWeight: 700, color: "var(--ink-soft)" }}>{f.policyNo}</td>
                    <td style={{ fontWeight: 700, color: "var(--seal)" }}>{f.name} {!isBlur && "🔍"}</td>
                    <td>{f.company}</td>
                    <td style={{ fontSize: 12, ...soft }}>{f.type}</td>
                    <td style={{ textAlign: "right", fontWeight: 600 }}>
                      <div>{f.premium}</div>
                      <div style={{ fontSize: 11, ...soft }}>{f.freq}</div>
                    </td>
                    <td style={{ textAlign: "right", fontWeight: 700, color: "var(--green)" }}>{f.coverage}</td>
                    <td style={{ fontSize: 12, ...soft }}>{f.beneficiary}</td>
                    <td>
                      <span className={f.status.includes("已繳清") || f.status === "保障中" ? "tag-g" : "tag-s"}>
                        ● {f.status}
                      </span>
                    </td>
                    <td style={{ textAlign: "center" }}>
                      <button
                        className="btn"
                        style={{ fontSize: 11, padding: "4px 10px", whiteSpace: "nowrap" }}
                        disabled={isBlur}
                        onClick={(e) => {
                          e.stopPropagation();
                          if (!isBlur) {
                            setSelectedPolicy({ ...f, categoryName: `家庭成員保單 (${f.relation} - ${f.memberName})` });
                          }
                        }}
                        title="點擊調閱保單內容與原件憑證"
                      >
                        🔍 檢視
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );

        return (
          <div>
            {!isPremier ? (
              <div className="card blur-card" style={{ padding: 0 }}>
                {/* 鎖定遮罩層 */}
                <div className="lock-overlay" style={{ padding: "40px 20px" }}>
                  <div style={{ width: 56, height: 56, borderRadius: "50%", background: "var(--gold-soft)", color: "var(--gold)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26, marginBottom: 12 }}>
                    🔒
                  </div>
                  <h4 style={{ ...SF, fontSize: 20, ...ink, margin: "0 0 8px" }}>升級 Premier 方案以開通「家庭保單管理」</h4>
                  <p style={{ fontSize: 13, ...soft, maxWidth: 500, margin: "0 0 18px", lineHeight: 1.6 }}>
                    全家保單總體檢、配偶儲蓄投資險、長輩高齡醫療防護、未成年子女醫療儲蓄險與毛小孩專屬寵物險統一歸戶表格管理。解鎖後可依家屬稱謂結構化排序、調閱合約照片與精算家庭總防護網。
                  </p>
                  <div style={{ display: "flex", gap: 10, flexWrap: "wrap", justifyContent: "center" }}>
                    <button className="btn" style={{ background: "linear-gradient(135deg, #B8860B, #D4AF37)", color: "#1C2430", padding: "10px 26px", fontSize: 14, fontWeight: 700 }} onClick={() => setShowUpgradeModal(true)}>
                      立即開通 Premier / 輸入優惠碼 →
                    </button>
                  </div>
                </div>

                {/* 模糊預覽背景 */}
                <div className="blur-content" style={{ padding: 24 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
                    <h3 style={{ ...SF, fontSize: 16, margin: 0 }}>👨‍👩‍👧‍👦 全家庭成員名下保單管理專區 (範例表格預覽 ｜ 依家屬稱謂排序)</h3>
                    <span className="tag-gold">全家合計保額：NT$ 38,500,000</span>
                  </div>
                  {renderFamilyTable(true)}
                </div>
              </div>
            ) : (
              /* 已升級 Premier 完整檢視介面 */
              <div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
                  <div>
                    <h3 style={{ ...SF, fontSize: 16, ...ink, margin: 0 }}>👨‍👩‍👧‍👦 全家庭成員名下保單管理專區 (Premier 尊榮已開通)</h3>
                    <p style={{ fontSize: 12, ...soft, margin: "4px 0 0" }}>
                      配偶、長輩、子女與毛小孩名下保單歸戶資料 ｜ 已依家屬稱謂排序（共 {familyList.length} 筆，點擊表頭可切換排序順序）
                    </p>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                    <button
                      className="btnl"
                      style={{ fontSize: 12, padding: "6px 12px", display: "flex", alignItems: "center", gap: 4 }}
                      onClick={() => setFamilySortOrder(prev => prev === "asc" ? "desc" : "asc")}
                      title="切換依家屬稱謂順序或倒序排列"
                    >
                      🔀 稱謂排序：{familySortOrder === "asc" ? "順序 (配偶→長輩→子女→毛孩)" : "倒序 (毛孩→子女→長輩→配偶)"}
                    </button>
                    <button
                      className="btn"
                      style={{ background: "var(--seal)" }}
                      onClick={() => {
                        setNewPolicy({
                          ...defaultNewPolicy,
                          category: "family",
                          relation: "配偶",
                          memberName: "林建宏"
                        });
                        setShowAddInsuranceModal(true);
                      }}
                    >
                      ＋ 為家庭成員新增保單
                    </button>
                  </div>
                </div>

                {renderFamilyTable(false)}
              </div>
            )}
          </div>
        );
      })()}
    </section>
    );
  };

  // =========================================================================
  // 頁面 4: 整合貸款中心 (房貸/車貸/信貸/股票質押合一，後端 Key-in 唯讀)
  // =========================================================================
  const renderLoans = () => (
    <section>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16, flexWrap: "wrap", gap: 8 }}>
        <div>
          <h2 style={{ ...SF, fontSize: 18, ...ink, margin: 0 }}>🏠 整合貸款中心 (負債、維持率與質借監控)</h2>
          <p style={{ fontSize: 12, ...soft, margin: "4px 0 0" }}>房貸新青安檢視 ｜ 囤房稅警戒 ｜ 重型機車與車牌車險 ｜ 股票質押維持率 ｜ 保單質押借款</p>
        </div>
        <span className="tag-readonly">🔒 後端合約核定唯讀鎖定</span>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap" }}>
        <button className={`tab-pill ${loanSubTab === "all" ? "active" : ""}`} onClick={() => setLoanSubTab("all")}>
          全部貸款彙整
        </button>
        <button className={`tab-pill ${loanSubTab === "mortgage" ? "active" : ""}`} onClick={() => setLoanSubTab("mortgage")}>
          🏠 房屋貸款 ({loanData.mortgage.length})
        </button>
        <button className={`tab-pill ${loanSubTab === "car" ? "active" : ""}`} onClick={() => setLoanSubTab("car")}>
          🚗 車輛貸款 (含重機) ({loanData.car.length})
        </button>
        <button className={`tab-pill ${loanSubTab === "credit" ? "active" : ""}`} onClick={() => setLoanSubTab("credit")}>
          🏦 信用貸款 (銀行/民間) ({loanData.credit.length})
        </button>
        <button className={`tab-pill ${loanSubTab === "stockPledge" ? "active" : ""}`} onClick={() => setLoanSubTab("stockPledge")}>
          📊 股票質押貸款 ({loanData.stockPledge.length})
        </button>
        <button className={`tab-pill ${loanSubTab === "policyLoan" ? "active" : ""}`} onClick={() => setLoanSubTab("policyLoan")}>
          📜 保單借款 ({(loanData.policyLoan || []).length})
        </button>
      </div>

      {/* 1. 房屋貸款 */}
      {(loanSubTab === "all" || loanSubTab === "mortgage") && (
        <div style={{ marginBottom: 28 }}>
          <h3 style={{ ...SF, fontSize: 16, ...ink, margin: "0 0 12px" }}>1. 房屋貸款專區</h3>
          <div className="dual-grid">
            {loanData.mortgage.map(m => (
              <div key={m.id} className="card" style={{ borderLeft: "4px solid var(--ink)" }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                  <span style={{ fontSize: 15, fontWeight: 700, ...ink }}>{m.name}</span>
                  <span className="tag-g">{m.schemeTag}</span>
                </div>
                <div style={{ fontSize: 12, ...soft, marginBottom: 12 }}>承貸銀行：{m.bank} ｜ 年利率：<b>{m.rate}% ({m.rateType})</b></div>
                <LoanBar total={m.total} remaining={m.remaining} />
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, margin: "14px 0 10px", fontSize: 13, background: "var(--paper)", padding: 10, borderRadius: 6 }}>
                  <div>每月還款：<b style={{ color: "var(--seal)" }}>{fmt(m.monthly)}</b></div>
                  <div>剩餘期數：<b>{m.monthsLeft} 個月</b></div>
                </div>
                <div style={{ fontSize: 12, padding: "8px 10px", borderRadius: 4, background: m.taxAlert.includes("⚠️") ? "var(--seal-soft)" : "#f0eee6", color: m.taxAlert.includes("⚠️") ? "var(--seal)" : "var(--ink-soft)", lineHeight: 1.5 }}>
                  {m.taxAlert}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* 2. 車輛貸款 */}
      {(loanSubTab === "all" || loanSubTab === "car") && (
        <div style={{ marginBottom: 28 }}>
          <h3 style={{ ...SF, fontSize: 16, ...ink, margin: "0 0 12px" }}>2. 車輛貸款 (汽車 / 重型機車)</h3>
          <div className="dual-grid">
            {loanData.car.map(c => (
              <div key={c.id} className="card" style={{ borderLeft: "4px solid var(--blue)" }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                  <span style={{ fontSize: 15, fontWeight: 700, ...ink }}>{c.name}</span>
                  <span className="tag-blue">{c.vehicleType}</span>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, fontSize: 12, ...soft, marginBottom: 10 }}>
                  <div>車牌號碼：<b style={{ ...ink, fontFamily: "monospace" }}>{c.plate}</b></div>
                  <div>排氣量：<b>{c.displacement}</b></div>
                  <div>融資機構：<b>{c.lender}</b></div>
                  <div>利率：<b>{c.rate}%</b></div>
                </div>
                <LoanBar total={c.total} remaining={c.remaining} />
                <div style={{ margin: "12px 0 8px", fontSize: 13 }}>
                  月付金：<b style={{ color: "var(--seal)" }}>{fmt(c.monthly)}</b>（剩餘 {c.monthsLeft} 期）
                </div>
                <div style={{ fontSize: 12, background: "var(--paper)", padding: "8px 10px", borderRadius: 4 }}>
                  <div style={{ color: "var(--blue)", fontWeight: 600 }}>🛡️ 投保公司：{c.insCompany}</div>
                  <div style={{ color: "var(--ink-soft)", marginTop: 2 }}>險種明細：{c.insType}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* 3. 信用貸款 */}
      {(loanSubTab === "all" || loanSubTab === "credit") && (
        <div style={{ marginBottom: 28 }}>
          <h3 style={{ ...SF, fontSize: 16, ...ink, margin: "0 0 12px" }}>3. 個人信用貸款 (銀行與民間機構分類)</h3>
          <div className="dual-grid">
            {loanData.credit.map(cr => (
              <div key={cr.id} className="card" style={{ borderLeft: cr.category.includes("銀行") ? "4px solid var(--green)" : "4px solid var(--seal)" }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                  <span style={{ fontSize: 15, fontWeight: 700, ...ink }}>{cr.name}</span>
                  <span className={cr.category.includes("銀行") ? "tag-g" : "tag-s"}>{cr.category}</span>
                </div>
                <div style={{ fontSize: 12, ...soft, marginBottom: 10 }}>核貸機構：<b>{cr.institution}</b> ｜ 利率：<b>{cr.rate}%</b></div>
                <LoanBar total={cr.total} remaining={cr.remaining} />
                <div style={{ display: "flex", justifyContent: "space-between", margin: "10px 0 6px", fontSize: 13 }}>
                  <span>月付金額：<b style={{ color: "var(--seal)" }}>{fmt(cr.monthly)}</b></span>
                  <span>剩餘期數：<b>{cr.monthsLeft} 個月</b></span>
                </div>
                <div style={{ fontSize: 12, ...soft }}>備註說明：{cr.note}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* 4. 股票質押借款專區 */}
      {(loanSubTab === "all" || loanSubTab === "stockPledge") && (
        <div>
          <h3 style={{ ...SF, fontSize: 16, ...ink, margin: "0 0 12px" }}>4. 股票質押貸款 (證券金融質借)</h3>
          {loanData.stockPledge.map(sp => (
            <div key={sp.id} className="card" style={{ borderLeft: "4px solid var(--purple)" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
                <div>
                  <div style={{ fontSize: 16, fontWeight: 700, ...ink }}>{sp.name}</div>
                  <div style={{ fontSize: 12, ...soft }}>往來證券商：{sp.broker} ｜ 質押利率：<b>{sp.rate}%</b></div>
                </div>
                <span className="tag-g">維持率安全</span>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(180px,1fr))", gap: 12, background: "var(--paper)", padding: 12, borderRadius: 6, fontSize: 13, marginBottom: 10 }}>
                <div>擔保股票：<b>{sp.pledgedStock}</b></div>
                <div>擔保股市值：<b>{fmt(sp.marketVal)}</b></div>
                <div>質押借出本金：<b style={{ color: "var(--seal)" }}>{fmt(sp.loanAmt)}</b></div>
                <div>每月利息支出：<b style={{ color: "var(--seal)" }}>{fmt(sp.monthlyInterest)} /月</b></div>
              </div>
              <div style={{ fontSize: 13, fontWeight: 600, color: "var(--green)", marginBottom: 4 }}>
                📈 目前擔保品維持率：{sp.maintainRatio}
              </div>
              <div style={{ fontSize: 12, ...soft }}>運作策略：{sp.note}</div>
            </div>
          ))}
        </div>
      )}

      {/* 5. 保單借款專區 */}
      {(loanSubTab === "all" || loanSubTab === "policyLoan") && (
        <div style={{ marginTop: (loanSubTab === "all" ? 28 : 0) }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
            <h3 style={{ ...SF, fontSize: 16, ...ink, margin: 0 }}>5. 保單借款專區 (保單價值準備金質借)</h3>
            <span style={{ fontSize: 12, color: "var(--blue)", background: "#EFF6FF", padding: "4px 8px", borderRadius: 4, fontWeight: 600 }}>
              💡 免聯徵 ｜ 免保人 ｜ 不影響信用評分 ｜ 隨借隨還
            </span>
          </div>
          <div className="dual-grid">
            {(loanData.policyLoan || []).map(pl => (
              <div key={pl.id} className="card" style={{ borderLeft: "4px solid #D97706" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8, gap: 8 }}>
                  <div>
                    <div style={{ fontSize: 15, fontWeight: 700, ...ink }}>{pl.name}</div>
                    <div style={{ fontSize: 12, ...soft, marginTop: 2 }}>
                      保險公司：<b>{pl.insuranceCompany}</b> ｜ 保單號碼：<b style={{ fontFamily: "monospace", color: "var(--ink)" }}>{pl.policyNo}</b>
                    </div>
                  </div>
                  <span className="tag-gold">保單質借中</span>
                </div>

                <div style={{ fontSize: 12, background: "#FFFBEB", color: "#92400E", padding: "6px 10px", borderRadius: 4, marginBottom: 10, border: "1px solid #FDE68A" }}>
                  📌 抵押險種：<b>{pl.policyType}</b>
                </div>

                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, fontSize: 12, ...soft, marginBottom: 10 }}>
                  <div>擔保價值：<b style={{ ...ink }}>{pl.policyValue}</b></div>
                  <div>可貸額度：<b style={{ color: "var(--blue)" }}>{pl.maxBorrowRatio}</b></div>
                  <div>借款利率：<b style={{ color: "#D97706" }}>{pl.rate}% 年息</b></div>
                  <div>還款彈性：<b style={{ ...ink }}>隨借隨還</b></div>
                </div>

                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, margin: "10px 0", fontSize: 13, background: "var(--paper)", padding: 10, borderRadius: 6 }}>
                  <div>已借本金：<b style={{ color: "var(--seal)" }}>{fmt(pl.loanAmt)} {pl.currency}</b></div>
                  <div>每月利息：<b style={{ color: "var(--seal)" }}>約 {fmt(pl.monthlyInterest)} /月</b></div>
                </div>

                <div style={{ fontSize: 12, padding: "8px 10px", borderRadius: 4, background: "#f0eee6", lineHeight: 1.5, marginBottom: 6 }}>
                  <span style={{ fontWeight: 600, color: "var(--ink)" }}>還款規則：</span>{pl.repaymentMethod}
                </div>
                <div style={{ fontSize: 12, ...soft }}>
                  📝 規劃備註：{pl.note}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </section>
  );

  // =========================================================================
  // 頁面 5: 線上理財學堂課程
  // =========================================================================
  const renderCourses = () => (
    <section>
      <div style={{ marginBottom: 20 }}>
        <h2 style={{ ...SF, fontSize: 18, ...ink, margin: 0 }}>🎓 理財學堂 (線上專題精選課程)</h2>
        <p style={{ fontSize: 12, ...soft, margin: "4px 0 0" }}>不動產稅務、信託保全、高股息 ETF 與二代健保實戰</p>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        {ONLINE_COURSES.map(c => (
          <div key={c.id} className="card" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 16 }}>
            <div style={{ flex: "1 1 320px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                <span className="tag-gold">{c.badge}</span>
                <span className="tag-blue">{c.tag}</span>
                <span style={{ fontSize: 12, color: "var(--gold)", fontWeight: 700 }}>{c.rating}</span>
              </div>
              <h3 style={{ ...SF, fontSize: 17, ...ink, margin: "0 0 6px" }}>{c.title}</h3>
              <div style={{ fontSize: 13, ...soft, marginBottom: 6 }}>主講講師：<b>{c.instructor}</b> ｜ 課程時長：{c.duration}</div>
              <p style={{ fontSize: 13, ...ink, margin: 0, lineHeight: 1.6 }}>{c.desc}</p>
            </div>
            <button className="btn" onClick={() => alert(`🎉 感謝報名！您已成功解鎖「${c.title}」專題線上課程觀看權限！`)}>
              立即觀看線上課程
            </button>
          </div>
        ))}
      </div>
    </section>
  );

  // =========================================================================
  // 頁面 6: 投資組合總覽 (台股 / 美股 / 基金) - 含月均配息與年度總配息統計
  // =========================================================================
  const renderStocks = () => {
    // 預設匯率 1 USD = 32.2 TWD
    const USD_EXCHANGE_RATE = 32.2;

    // 1. 台股配息計算 (季配*4, 年配*1, 月配*12, 半年配*2, 不配息*0)
    let twStockGrossAnnual = 0;
    let twStockFeeAnnual = 0;
    let twStockMgmtAnnual = 0;
    let twStockNhiAnnual = 0;
    let twStockNetAnnual = 0;

    twStocks.forEach(s => {
      const mult = s.divFreq === "年配" ? 1 : s.divFreq === "月配" ? 12 : s.divFreq === "半年配" ? 2 : s.divFreq === "不配息" ? 0 : 4;
      const singleGross = (s.shares || 0) * (Number(s.divPerShare) || 0);
      const annGross = singleGross * mult;
      const feeAmt = Math.round(annGross * ((Number(s.feeRate) || 0) / 100));
      const mgmtAmt = Math.round(annGross * ((Number(s.mgmtFee) || 0) / 100));
      const singleNhi = singleGross >= 20000 ? Math.round(singleGross * 0.0211) : 0;
      const annNhi = singleNhi * mult;
      const cost = feeAmt + mgmtAmt + annNhi;
      const annNet = Math.max(0, annGross - cost);

      twStockGrossAnnual += annGross;
      twStockFeeAnnual += feeAmt;
      twStockMgmtAnnual += mgmtAmt;
      twStockNhiAnnual += annNhi;
      twStockNetAnnual += annNet;
    });

    // 2. 美股配息計算 (已扣除 30% IRS 預扣稅、複委託手續費、ETF經理管理費)
    let usStockGrossAnnualUSD = 0;
    let usStockTaxAnnualUSD = 0;
    let usStockFeeAnnualUSD = 0;
    let usStockMgmtAnnualUSD = 0;
    let usStockNetAnnualUSD = 0;

    usStocks.forEach(u => {
      const mult = u.divFreq === "年配" ? 1 : u.divFreq === "月配" ? 12 : u.divFreq === "半年配" ? 2 : 4;
      const grossUSD = (u.shares || 0) * (Number(u.divPerShare) || 0) * mult;
      const irsTax = grossUSD * 0.3; // 30% 預扣稅
      const feeAmt = grossUSD * ((Number(u.feeRate) || 0) / 100);
      const mgmtAmt = grossUSD * ((Number(u.mgmtFee) || 0) / 100);
      const netUSD = Math.max(0, grossUSD - irsTax - feeAmt - mgmtAmt);

      usStockGrossAnnualUSD += grossUSD;
      usStockTaxAnnualUSD += irsTax;
      usStockFeeAnnualUSD += feeAmt;
      usStockMgmtAnnualUSD += mgmtAmt;
      usStockNetAnnualUSD += netUSD;
    });
    const usStockNetAnnualTWD = Math.round(usStockNetAnnualUSD * USD_EXCHANGE_RATE);
    const usStockFeeAnnualTWD = Math.round(usStockFeeAnnualUSD * USD_EXCHANGE_RATE);
    const usStockMgmtAnnualTWD = Math.round(usStockMgmtAnnualUSD * USD_EXCHANGE_RATE);
    const usStockTaxAnnualTWD = Math.round(usStockTaxAnnualUSD * USD_EXCHANGE_RATE);
    const usStockGrossAnnualTWD = Math.round(usStockGrossAnnualUSD * USD_EXCHANGE_RATE);

    // 3. 基金配息計算 (扣除手續費、經理費、二代健保)
    let fundGrossAnnualTWD = 0;
    let fundFeeAnnualTWD = 0;
    let fundMgmtAnnualTWD = 0;
    let fundNhiAnnualTWD = 0;
    let fundNetAnnualTWD = 0;

    funds.forEach(f => {
      const grossAnnCurr = (Number(f.monthlyDiv) || 0) * 12;
      const feeAmt = grossAnnCurr * ((Number(f.feeRate) || 0) / 100);
      const mgmtAmt = grossAnnCurr * ((Number(f.mgmtFee) || 0) / 100);
      const isOverseas = f.currency === "USD" || (f.name && (f.name.includes("環球") || f.name.includes("全球")));
      const nhiAmt = (!isOverseas && f.currency === "TWD" && (Number(f.monthlyDiv) || 0) >= 20000) ? Math.round((Number(f.monthlyDiv) || 0) * 0.0211) * 12 : 0;
      const netAnnCurr = Math.max(0, grossAnnCurr - feeAmt - mgmtAmt - nhiAmt);

      const toTwd = amt => f.currency === "USD" ? Math.round(amt * USD_EXCHANGE_RATE) : Math.round(amt);
      fundGrossAnnualTWD += toTwd(grossAnnCurr);
      fundFeeAnnualTWD += toTwd(feeAmt);
      fundMgmtAnnualTWD += toTwd(mgmtAmt);
      fundNhiAnnualTWD += toTwd(nhiAmt);
      fundNetAnnualTWD += toTwd(netAnnCurr);
    });

    // 全年度實領淨配息與每月平均實領配息 (扣除手續費、管理費、健保與海外稅後)
    const totalNetAnnualTWD = twStockNetAnnual + usStockNetAnnualTWD + fundNetAnnualTWD;
    const avgMonthlyNetDivTWD = Math.round(totalNetAnnualTWD / 12);

    // 總費用扣除統計
    const totalFeeTWD = twStockFeeAnnual + usStockFeeAnnualTWD + fundFeeAnnualTWD;
    const totalMgmtTWD = twStockMgmtAnnual + usStockMgmtAnnualTWD + fundMgmtAnnualTWD;
    const totalTaxNhiTWD = twStockNhiAnnual + usStockTaxAnnualTWD + fundNhiAnnualTWD;
    const totalCostAnnualTWD = totalFeeTWD + totalMgmtTWD + totalTaxNhiTWD;
    const totalGrossAnnualTWD = totalNetAnnualTWD + totalCostAnnualTWD;

    // 4. 總資產本金/市值與平均獲利% (實領年化報酬率 / 殖利率)
    const twStockCostTWD = twStocks.reduce((sum, s) => {
      const p = Number(s.price) || 0;
      return sum + ((s.shares || 0) * p);
    }, 0);
    const twStockMarketValTWD = twStocks.reduce((sum, s) => {
      const curP = Number(s.currentPrice) || Number(s.price) || 0;
      return sum + ((s.shares || 0) * curP);
    }, 0);

    const usStockCostUSD = usStocks.reduce((sum, u) => {
      const p = Number(u.price) || 0;
      return sum + ((u.shares || 0) * p);
    }, 0);
    const usStockCostTWD = Math.round(usStockCostUSD * USD_EXCHANGE_RATE);
