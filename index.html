                  <div style={{ color: "#94A3B8", fontSize: 12, marginBottom: 8, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span>📷 用戶實體拍攝／上傳之原始保單存根原件 ({selectedPolicy.photoName || "保單存根聯"})</span>
                    <span className="tag-g">真實影像存證</span>
                  </div>
                  <img
                    src={selectedPolicy.photo}
                    alt="保單照片"
                    style={{ maxWidth: "100%", maxHeight: "55vh", objectFit: "contain", borderRadius: 6, border: "1px solid #334155" }}
                  />
                </div>
              ) : (
                <div style={{ background: "#F8FAFC", border: "2px dashed #CBD5E1", borderRadius: 8, padding: 20, marginBottom: 18, position: "relative", overflow: "hidden" }}>
                  {/* 浮水印背景印章 */}
                  <div style={{ position: "absolute", right: 20, bottom: 20, width: 140, height: 140, borderRadius: "50%", border: "4px double rgba(168,64,47,0.2)", color: "rgba(168,64,47,0.2)", display: "flex", alignItems: "center", justifyContent: "center", transform: "rotate(-18deg)", pointerEvents: "none", fontSize: 15, fontWeight: 900, textAlign: "center", padding: 10, lineHeight: 1.3 }}>
                    電子保單核訖<br/>端對端簽章驗證
                  </div>

                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid #E2E8F0", paddingBottom: 10, marginBottom: 14 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <div style={{ width: 36, height: 36, borderRadius: 6, background: "var(--ink)", color: "var(--gold)", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900, fontSize: 16 }}>
                        保
                      </div>
                      <div>
                        <div style={{ fontSize: 14, fontWeight: 800, color: "#1E293B" }}>{selectedPolicy.company} 人身／財產保險股份有限公司</div>
                        <div style={{ fontSize: 11, color: "#64748B" }}>中華民國金融監督管理委員會保險局核准有案之保險契約憑證副本</div>
                      </div>
                    </div>
                    <span className="tag-g" style={{ fontSize: 11 }}>電子保單正本已歸檔</span>
                  </div>

                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 12, fontSize: 12, marginBottom: 14 }}>
                    <div style={{ background: "#fff", padding: "8px 12px", borderRadius: 6, border: "1px solid #E2E8F0" }}>
                      <div style={{ color: "#64748B", fontSize: 11 }}>法定保單號碼</div>
                      <div style={{ fontFamily: "monospace", fontWeight: 700, color: "#0F172A", marginTop: 2 }}>{selectedPolicy.policyNo}</div>
                    </div>
                    <div style={{ background: "#fff", padding: "8px 12px", borderRadius: 6, border: "1px solid #E2E8F0" }}>
                      <div style={{ color: "#64748B", fontSize: 11 }}>被保險人 / 歸屬家屬</div>
                      <div style={{ fontWeight: 700, color: "#0F172A", marginTop: 2 }}>
                        {selectedPolicy.memberName ? (
                          <span>
                            <b style={{ color: "var(--seal)", marginRight: 4 }}>[{selectedPolicy.relation}]</b>
                            {selectedPolicy.memberName}
                          </span>
                        ) : (
                          <span>{userProfile.name} (本人)</span>
                        )}
                      </div>
                    </div>
                    <div style={{ background: "#fff", padding: "8px 12px", borderRadius: 6, border: "1px solid #E2E8F0" }}>
                      <div style={{ color: "#64748B", fontSize: 11 }}>保單本金／理賠保障額度</div>
                      <div style={{ fontWeight: 800, color: "var(--green)", marginTop: 2 }}>
                        {selectedPolicy.principal ? fmtCurr(selectedPolicy.principal, selectedPolicy.currency) : selectedPolicy.coverage ? fmt(selectedPolicy.coverage) : "依條款核定"}
                      </div>
                    </div>
                    <div style={{ background: "#fff", padding: "8px 12px", borderRadius: 6, border: "1px solid #E2E8F0" }}>
                      <div style={{ color: "#64748B", fontSize: 11 }}>配息入帳／保障期間</div>
                      <div style={{ fontWeight: 700, color: "#0F172A", marginTop: 2 }}>
                        {selectedPolicy.divAmt ? `${fmtCurr(selectedPolicy.divAmt, selectedPolicy.currency)} (${selectedPolicy.divFreq || "定期"})` : selectedPolicy.expiry || "持續有效"}
                      </div>
                    </div>
                    <div style={{ background: "#fff", padding: "8px 12px", borderRadius: 6, border: "1px solid #E2E8F0" }}>
                      <div style={{ color: "#64748B", fontSize: 11 }}>利息受益人 (配息所得)</div>
                      <div style={{ fontWeight: 700, color: "var(--blue)", marginTop: 2 }}>
                        {selectedPolicy.interestBeneficiary || (selectedPolicy.categoryName?.includes("保障") ? "無理息 (純保障險)" : "本人 (王大明)")}
                      </div>
                    </div>
                    <div style={{ background: "#fff", padding: "8px 12px", borderRadius: 6, border: "1px solid #E2E8F0" }}>
                      <div style={{ color: "#64748B", fontSize: 11 }}>本金／身故滿期受益人</div>
                      <div style={{ fontWeight: 700, color: "var(--seal)", marginTop: 2 }}>
                        {selectedPolicy.principalBeneficiary || selectedPolicy.beneficiary || "法定繼承人"}
                      </div>
                    </div>
                  </div>

                  {/* 條款摘錄說明 */}
                  <div style={{ background: "#fff", padding: 12, borderRadius: 6, border: "1px solid #E2E8F0", fontSize: 12, lineHeight: 1.6, color: "#334155" }}>
                    <div style={{ fontWeight: 700, color: "#0F172A", marginBottom: 4, display: "flex", alignItems: "center", gap: 6 }}>
                      <span>📜 契約約定與稅務備註：</span>
                    </div>
                    <div>{selectedPolicy.note || selectedPolicy.underlying || selectedPolicy.type || "本契約依據中華民國保險法規及主管機關核定之保單條款辦理，一切權利義務以正式保單為準。"}</div>
                  </div>
                </div>
              )}

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
                <span style={{ fontSize: 12, ...soft }}>
                  {selectedPolicy.photo ? "📷 如需更換原件照片，可點選「✏️ 變更保單」重新拍攝或上傳。" : "💡 點擊「下載電子保單檔案」可自顧問端調閱高解析度 PDF 簽署原件。"}
                </span>
                <div style={{ display: "flex", gap: 10 }}>
                  <button className="btn" style={{ background: "var(--ink)", color: "#fff", fontSize: 13 }} onClick={() => alert(`📥 已為您建立保單 [${selectedPolicy.policyNo}] 之離線加密原檔下載任務！`)}>
                    📥 下載電子保單原檔 (PDF)
                  </button>
                  <button className="btnl" onClick={() => setSelectedPolicy(null)} style={{ fontSize: 13 }}>
                    關閉檢視
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* 🌟 核心需求 10-1 & 10-2：新增保單 Modal (支援相機拍照/照片上傳、年繳/季繳/躉繳、期數與新手自動折算月費) */}
        {showAddInsuranceModal && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(15,23,42,0.7)", backdropFilter: "blur(4px)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 125, padding: 16 }}>
            <div className="card" style={{ maxWidth: 640, width: "100%", padding: 26, borderRadius: 10, maxHeight: "90vh", overflowY: "auto", background: "#fff", boxShadow: "0 20px 40px rgba(0,0,0,0.3)" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16, borderBottom: "1px solid var(--line-soft)", paddingBottom: 10 }}>
                <div>
                  <span className="tag-gold" style={{ marginBottom: 4, display: "inline-block" }}>新手友善 ｜ 自由錄入</span>
                  <h3 style={{ ...SF, fontSize: 19, ...ink, margin: 0 }}>＋ 新增保險保單（含拍照上傳保單內容）</h3>
                </div>
                <button onClick={() => setShowAddInsuranceModal(false)} style={{ background: "transparent", border: "none", fontSize: 20, cursor: "pointer", ...soft }}>✕</button>
              </div>

              {/* 險種大類切換 */}
              <div style={{ marginBottom: 16 }}>
                <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 6 }}>保險類型：</label>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  {[
                    { key: "savings", label: "💰 儲蓄型保險" },
                    { key: "investment", label: "📈 投資型保單" },
                    { key: "protective", label: "🏥 人身與醫療保險" },
                    { key: "property", label: "🚗 財產保險 (汽車/住宅/旅遊)" },
                    { key: "family", label: "👨‍👩‍👧‍👦 家庭成員名下保單" }
                  ].map(tab => (
                    <button
                      key={tab.key}
                      type="button"
                      onClick={() => setNewPolicy(prev => ({
                        ...prev,
                        category: tab.key,
                        relation: tab.key === "family" ? (prev.relation || "配偶") : prev.relation,
                        memberName: tab.key === "family" ? (prev.memberName || "林建宏") : prev.memberName
                      }))}
                      style={{
                        padding: "6px 12px",
                        borderRadius: 6,
                        fontSize: 12,
                        fontWeight: 600,
                        border: "1px solid",
                        cursor: "pointer",
                        background: newPolicy.category === tab.key ? "var(--ink)" : "#fff",
                        color: newPolicy.category === tab.key ? "var(--gold)" : "var(--ink-soft)",
                        borderColor: newPolicy.category === tab.key ? "var(--ink)" : "var(--line)"
                      }}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* 🌟 核心需求：若為家庭成員保單，增加「家屬稱謂」與「成員姓名」連動設定 */}
              {newPolicy.category === "family" && (
                <div style={{ background: "#FDF4EE", border: "1px solid #FBCFE8", padding: 14, borderRadius: 8, marginBottom: 16 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: "var(--seal)", marginBottom: 8, display: "flex", alignItems: "center", gap: 6 }}>
                    <span>👨‍👩‍👧‍👦 家庭成員身分指派（依家屬稱謂歸戶與排序）：</span>
                  </div>

                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 12 }}>
                    <div>
                      <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>
                        家屬稱謂 <span style={{ color: "#EF4444" }}>*</span>
                      </label>
                      <select
                        className="inp"
                        value={["配偶", "父親", "母親", "長輩", "長女", "長子", "毛小孩 (犬)", "毛小孩 (貓)"].includes(newPolicy.relation) ? newPolicy.relation : "自訂稱謂"}
                        onChange={e => {
                          const val = e.target.value;
                          if (val === "自訂稱謂") {
                            setNewPolicy(prev => ({ ...prev, relation: "" }));
                          } else {
                            // 快速自動推薦填入預設姓名
                            let autoName = newPolicy.memberName;
                            if (val === "配偶") autoName = "林建宏";
                            else if (val === "父親") autoName = "陳明德";
                            else if (val === "長女") autoName = "林小妹";
                            else if (val.includes("毛小孩")) autoName = "Mochi (麻吉)";
                            setNewPolicy(prev => ({ ...prev, relation: val, memberName: autoName }));
                          }
                        }}
                      >
                        <option value="配偶">配偶 (伴侶)</option>
                        <option value="父親">父親 (長輩)</option>
                        <option value="母親">母親 (長輩)</option>
                        <option value="長輩">其他公婆/長輩</option>
                        <option value="女">女 (女兒)</option>
                        <option value="男">男 (兒子)</option>
                        <option value="女">女 (女兒)</option>
                        <option value="男">男 (兒子)</option>
                        <option value="長女">長女 (子女)</option>
                        <option value="長子">長子 (子女)</option>
                        <option value="毛小孩 (犬)">毛小孩 (犬)</option>
                        <option value="毛小孩 (貓)">毛小孩 (貓)</option>
                        <option value="自訂稱謂">✏️ 自行輸入其他稱謂...</option>
                      </select>
                      {!["配偶", "父親", "母親", "長輩", "長女", "長子", "毛小孩 (犬)", "毛小孩 (貓)"].includes(newPolicy.relation) && (
                        <input
                          className="inp"
                          style={{ marginTop: 6 }}
                          placeholder="請輸入稱謂 (例：岳父、次子、毛小孩)"
                          value={newPolicy.relation || ""}
                          onChange={e => setNewPolicy(prev => ({ ...prev, relation: e.target.value }))}
                        />
                      )}
                    </div>

                    <div>
                      <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>
                        家庭成員姓名 <span style={{ color: "#EF4444" }}>*</span>
                      </label>
                      <input
                        className="inp"
                        placeholder="例：林建宏、陳明德、林小妹"
                        value={newPolicy.memberName || ""}
                        onChange={e => setNewPolicy(prev => ({ ...prev, memberName: e.target.value }))}
                      />
                    </div>
                  </div>

                  {/* 動態連動資料表家庭成員快捷按鈕與下拉指派 */}
                  <div style={{ marginTop: 12, borderTop: "1px dashed #FBCFE8", paddingTop: 10 }}>
                    <div style={{ fontSize: 11, fontWeight: 700, color: "var(--seal)", marginBottom: 6, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                      <span>🔗 連動家庭成員資料表 (點擊即可自動填入稱謂與姓名)：</span>
                      <span style={{ fontSize: 11, ...soft }}>
                        資料表現有 {((familyData?.spouseAndParents?.length || 0) + (familyData?.children?.length || 0) + (familyData?.pets?.length || 0))} 位成員
                      </span>
                    </div>

                    <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
                      {[
                        ...(familyData?.spouseAndParents || []).map(m => ({ name: m.name, rel: m.relationship || "配偶", tag: "tag-gold" })),
                        ...(familyData?.children || []).map(m => ({ name: m.name, rel: m.relationship || "子女", tag: "tag-blue" })),
                        ...(familyData?.pets || []).map(m => ({ name: m.name, rel: m.type ? `毛小孩 (${m.type.split("(")[0].trim() || "寵物"})` : "毛小孩", tag: "tag-purple" }))
                      ].map((m, idx) => (
                        <button
                          key={`${m.name}-${idx}`}
                          type="button"
                          className="btnl"
                          style={{
                            fontSize: 11,
                            padding: "3px 10px",
                            background: newPolicy.memberName === m.name ? "var(--ink)" : "#fff",
                            color: newPolicy.memberName === m.name ? "#fff" : "var(--ink)",
                            borderColor: newPolicy.memberName === m.name ? "var(--ink)" : "var(--line)",
                            display: "inline-flex",
                            alignItems: "center",
                            gap: 4
                          }}
                          onClick={() => setNewPolicy(prev => ({ ...prev, relation: m.rel, memberName: m.name }))}
                        >
                          <span>{m.rel}</span>
                          <b>{m.name}</b>
                          {newPolicy.memberName === m.name && <span>✓</span>}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: 14 }}>
                <div>
                  <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>
                    保單名稱 <span style={{ color: "#EF4444" }}>*</span>
                  </label>
                  <input
                    className="inp"
                    placeholder="例：美滿人生美元增額終身壽險"
                    value={newPolicy.name}
                    onChange={e => setNewPolicy({ ...newPolicy, name: e.target.value })}
                  />
                </div>

                <div>
                  <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>承保公司：</label>
                  <input
                    className="inp"
                    placeholder="例：富邦人壽、國泰人壽、安聯人壽"
                    value={newPolicy.company}
                    onChange={e => setNewPolicy({ ...newPolicy, company: e.target.value })}
                  />
                </div>

                <div>
                  <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>保單號碼 (選填，自動防呆生成)：</label>
                  <input
                    className="inp"
                    placeholder="例：POL-FB-202601"
                    value={newPolicy.policyNo}
                    onChange={e => setNewPolicy({ ...newPolicy, policyNo: e.target.value })}
                  />
                </div>

                <div>
                  <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>計價幣別：</label>
                  <select
                    className="inp"
                    value={newPolicy.currency}
                    onChange={e => setNewPolicy({ ...newPolicy, currency: e.target.value })}
                  >
                    <option value="TWD">🇹🇼 新台幣 (TWD)</option>
                    <option value="USD">🇺🇸 美元 (USD)</option>
                  </select>
                </div>
              </div>

              {/* 繳費方式與期數設定 (儲蓄型與投資型核心) */}
              {(newPolicy.category === "savings" || newPolicy.category === "investment") && (
                <div style={{ background: "#F8FAFC", border: "1px solid #E2E8F0", padding: 14, borderRadius: 8, marginTop: 14 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: "var(--seal)", marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}>
                    <span>⚙️ 繳費方式與期數設定（智慧換算每個月需繳納費用）</span>
                  </div>

                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 12 }}>
                    <div>
                      <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>繳費方式：</label>
                      <select
                        className="inp"
                        value={newPolicy.payFreq}
                        onChange={e => {
                          const freq = e.target.value;
                          if (freq === "躉繳") {
                            setNewPolicy(prev => ({ ...prev, payFreq: freq, totalPeriods: 1, currentPeriod: 1 }));
                          } else {
                            setNewPolicy(prev => ({ ...prev, payFreq: freq }));
                          }
                        }}
                      >
                        <option value="年繳">年繳 (每年繳 1 次)</option>
                        <option value="半年繳">半年繳 (每半年繳 1 次)</option>
                        <option value="季繳">季繳 (每 3 個月繳 1 次)</option>
                        <option value="月繳">月繳 (每個月繳 1 次)</option>
                        <option value="躉繳">躉繳 (一次性繳清，自動判定已付清)</option>
                      </select>
                    </div>

                    <div>
                      <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>
                        每期繳納保費金額 ({newPolicy.currency})：
                      </label>
                      <input
                        className="inp"
                        type="number"
                        placeholder="例：120000"
                        value={newPolicy.periodPremium}
                        onChange={e => setNewPolicy({ ...newPolicy, periodPremium: e.target.value })}
                      />
                    </div>

                    <div>
                      <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>
                        總共有幾期 (總繳費期數)：
                      </label>
                      <input
                        className="inp"
                        type="number"
                        min="1"
                        placeholder="例：6 (年期) 或 20"
                        disabled={newPolicy.payFreq === "躉繳"}
                        value={newPolicy.totalPeriods}
                        onChange={e => setNewPolicy({ ...newPolicy, totalPeriods: Math.max(1, Number(e.target.value)) })}
                      />
                    </div>

                    <div>
                      <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>
                        目前繳納第幾期：
                      </label>
                      <input
                        className="inp"
                        type="number"
                        min="0"
                        placeholder="例：2"
                        disabled={newPolicy.payFreq === "躉繳"}
                        value={newPolicy.currentPeriod}
                        onChange={e => setNewPolicy({ ...newPolicy, currentPeriod: Math.max(0, Number(e.target.value)) })}
                      />
                    </div>
                  </div>

                  {/* 智慧換算與付清提示卡 */}
                  <div style={{ marginTop: 10, background: "#fff", padding: "8px 12px", borderRadius: 6, border: "1px solid #CBD5E1", fontSize: 12, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 6 }}>
                    <div>
                      💡 自動折算每個月需繳納費用：
                      <b style={{ color: "var(--seal)", fontSize: 14, marginLeft: 4 }}>
                        {fmtCurr(calcMonthlyCost(newPolicy.payFreq, newPolicy.periodPremium), newPolicy.currency)} / 月
                      </b>
                    </div>
                    <div>
                      分類歸屬判定：
                      {Number(newPolicy.currentPeriod) >= Number(newPolicy.totalPeriods) ? (
                        <span style={{ color: "var(--green)", fontWeight: 700 }}>🎉 已繳滿付清（歸入已付清表格，開始領息）</span>
                      ) : (
                        <span style={{ color: "var(--seal)", fontWeight: 700 }}>⏳ 繳費供款期中（歸入未付清表格，尚餘 {Math.max(0, Number(newPolicy.totalPeriods) - Number(newPolicy.currentPeriod))} 期）</span>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* 保單本金與配息/保障額度 */}
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 14, marginTop: 14 }}>
                <div>
                  <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>
                    {newPolicy.category === "protective" ? "年繳保費" : "保單本金 / 累積價值現值"} ({newPolicy.currency})：
                  </label>
                  <input
                    className="inp"
                    type="number"
                    placeholder="例：1000000"
                    value={newPolicy.principal}
                    onChange={e => setNewPolicy({ ...newPolicy, principal: e.target.value })}
                  />
                </div>

                {(newPolicy.category === "savings" || newPolicy.category === "investment") ? (
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                  <div>
                    <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>
                      配息發放頻率：
                    </label>
                    <select
                      className="inp"
                      value={newPolicy.divFreq || "年配"}
                      onChange={e => setNewPolicy({ ...newPolicy, divFreq: e.target.value })}
                    >
                      <option value="月配">月配（每月領息）</option>
                      <option value="季配">季配（每季領息）</option>
                      <option value="半年配">半年配（每半年領息）</option>
                      <option value="年配">年配（每年領息）</option>
                    </select>
                  </div>
                  <div>
                    <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>
                      每期預計領取配息金額 ({newPolicy.currency})：
                    </label>
                    <input
                      className="inp"
                      type="number"
                      placeholder="例：3000"
                      value={newPolicy.divAmt}
                      onChange={e => setNewPolicy({ ...newPolicy, divAmt: e.target.value })}
                    />
                  </div>
                </div>
              ) : (
                  <div>
                    <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>
                      理賠保額／最高賠償額 ({newPolicy.currency})：
                    </label>
                    <input
                      className="inp"
                      type="number"
                      placeholder="例：5000000"
                      value={newPolicy.coverage}
                      onChange={e => setNewPolicy({ ...newPolicy, coverage: e.target.value })}
                    />
                  </div>
                )}

                <div>
                  <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>利息受益人：</label>
                  <input
                    className="inp"
                    placeholder="預設：本人 (王大明)"
                    value={newPolicy.interestBeneficiary}
                    onChange={e => setNewPolicy({ ...newPolicy, interestBeneficiary: e.target.value })}
                  />
                </div>

                <div>
                  <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>本金／身故滿期受益人：</label>
                  <input
                    className="inp"
                    placeholder="預設：法定繼承人"
                    value={newPolicy.principalBeneficiary}
                    onChange={e => setNewPolicy({ ...newPolicy, principalBeneficiary: e.target.value })}
                  />
                </div>
              </div>

              {/* 拍照上傳保單原件照片 (核心功能) */}
              <div style={{ marginTop: 16, background: "var(--paper)", padding: 14, borderRadius: 8, border: "1px dashed var(--line)" }}>
                <div style={{ fontSize: 13, fontWeight: 700, ...ink, marginBottom: 6, display: "flex", alignItems: "center", gap: 6 }}>
                  <span>📷 拍照或上傳原始保單照片（手機拍照即傳，免後端負擔）：</span>
                </div>
                <div style={{ fontSize: 11, ...soft, marginBottom: 10 }}>
                  支援直接點選「拍照」開啟手機相機拍攝保單封面、內頁或電子保單截圖，照片將安全加密儲存於本地。
                </div>

                <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                  {/* 調用相機拍照 */}
                  <label className="btn" style={{ fontSize: 12, padding: "7px 14px", background: "var(--ink)", color: "#fff", cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 6 }}>
                    📸 手機拍照保單
                    <input
                      type="file"
                      accept="image/*"
                      capture="environment"
                      style={{ display: "none" }}
                      onChange={e => handlePolicyPhotoUpload(e, false)}
                    />
                  </label>

                  {/* 選擇本機相簿圖片 */}
                  <label className="btnl" style={{ fontSize: 12, padding: "7px 14px", cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 6 }}>
                    📁 從相簿/電腦選取圖片
                    <input
                      type="file"
                      accept="image/*"
                      style={{ display: "none" }}
                      onChange={e => handlePolicyPhotoUpload(e, false)}
                    />
                  </label>

                  {newPolicy.photo && (
                    <button
                      className="btnl"
                      style={{ fontSize: 11, padding: "4px 8px", color: "#EF4444", borderColor: "#FCA5A5" }}
                      onClick={() => setNewPolicy({ ...newPolicy, photo: null, photoName: "" })}
                    >
                      ✕ 移除照片
                    </button>
                  )}
                </div>

                {newPolicy.photo && (
                  <div style={{ marginTop: 12, textAlign: "center", background: "#0F172A", padding: 10, borderRadius: 6 }}>
                    <div style={{ color: "#94A3B8", fontSize: 11, marginBottom: 6 }}>保單照片預覽：{newPolicy.photoName || "已選擇照片"}</div>
                    <img
                      src={newPolicy.photo}
                      alt="保單預覽"
                      style={{ maxHeight: 180, maxWidth: "100%", objectFit: "contain", borderRadius: 4 }}
                    />
                  </div>
                )}
              </div>

              <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 20, borderTop: "1px solid var(--line-soft)", paddingTop: 14 }}>
                <button className="btnl" onClick={() => setShowAddInsuranceModal(false)}>
                  取消返回
                </button>
                <button className="btn" style={{ background: "var(--seal)", color: "#fff", padding: "8px 22px" }} onClick={handleSaveNewPolicy}>
                  確認新增保單
                </button>
              </div>
            </div>
          </div>
        )}

        {/* 🌟 核心需求 2：保單維護管理面板 (由上方「✏️ 修改保單」或「🗑️ 刪除保單」按鈕統一觸發) */}
        {showManageInsuranceModal && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(15,23,42,0.7)", backdropFilter: "blur(4px)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 125, padding: 16 }}>
            <div className="card" style={{ maxWidth: 760, width: "100%", padding: 26, borderRadius: 10, maxHeight: "90vh", overflowY: "auto", background: "#fff", boxShadow: "0 20px 40px rgba(0,0,0,0.3)" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14, borderBottom: "1px solid var(--line-soft)", paddingBottom: 10 }}>
                <div>
                  <span className="tag-gold" style={{ marginBottom: 4, display: "inline-block" }}>
                    {insuranceManageMode === "delete" ? "🗑️ 刪除保單中心" : insuranceManageMode === "edit" ? "✏️ 修改保單中心" : "現有保單中心"}
                  </span>
                  <h3 style={{ ...SF, fontSize: 19, ...ink, margin: 0 }}>
                    {insuranceManageMode === "delete" ? "🗑️ 刪除現有保險保單" : insuranceManageMode === "edit" ? "✏️ 修改現有保單資料" : "⚙️ 保單維護管理（修改 ｜ 刪除）"}
                  </h3>
                  <div style={{ fontSize: 12, ...soft, marginTop: 2 }}>
                    {insuranceManageMode === "delete"
                      ? "請在下方列表中選擇欲刪除的保單，點選「🗑️ 刪除」即可進行安全移除。"
                      : insuranceManageMode === "edit"
                      ? "請在下方列表中選擇欲變更的保單，點選「✏️ 修改」即可調整金額、期數或重拍保單照片。"
                      : "在此檢視現有所有保單，可點選「✏️ 修改」或「🗑️ 刪除」。"}
                  </div>
                </div>
                <button onClick={() => setShowManageInsuranceModal(false)} style={{ background: "transparent", border: "none", fontSize: 20, cursor: "pointer", ...soft }}>✕</button>
              </div>

              {/* 篩選切換按鈕（全部 / 僅修改 / 僅刪除） */}
              <div style={{ display: "flex", gap: 6, marginBottom: 14, background: "var(--paper)", padding: 4, borderRadius: 6, width: "fit-content" }}>
                <button
                  type="button"
                  style={{ border: "none", borderRadius: 4, padding: "4px 10px", fontSize: 12, cursor: "pointer", fontWeight: 600, background: insuranceManageMode === "edit" ? "#3B82F6" : "transparent", color: insuranceManageMode === "edit" ? "#fff" : "var(--ink-soft)" }}
                  onClick={() => setInsuranceManageMode("edit")}
                >
                  ✏️ 修改模式
                </button>
                <button
                  type="button"
                  style={{ border: "none", borderRadius: 4, padding: "4px 10px", fontSize: 12, cursor: "pointer", fontWeight: 600, background: insuranceManageMode === "delete" ? "#EF4444" : "transparent", color: insuranceManageMode === "delete" ? "#fff" : "var(--ink-soft)" }}
                  onClick={() => setInsuranceManageMode("delete")}
                >
                  🗑️ 刪除模式
                </button>
                <button
                  type="button"
                  style={{ border: "none", borderRadius: 4, padding: "4px 10px", fontSize: 12, cursor: "pointer", fontWeight: 600, background: insuranceManageMode === "all" ? "var(--ink)" : "transparent", color: insuranceManageMode === "all" ? "#fff" : "var(--ink-soft)" }}
                  onClick={() => setInsuranceManageMode("all")}
                >
                  📑 完整模式
                </button>
              </div>

              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                {[
                  { cat: "savings", title: "💰 儲蓄型保險", list: insuranceData.savings || [] },
                  { cat: "investment", title: "📈 投資型保單", list: insuranceData.investment || [] },
                  { cat: "protective", title: "🏥 人身醫療與壽險", list: insuranceData.protective || [] },
                  { cat: "property", title: "🚗 財產保險 (汽車/住宅/旅遊)", list: insuranceData.property || [] },
                  { cat: "family", title: "👨‍👩‍👧‍👦 家庭成員名下保單 (依家屬稱謂歸戶)", list: insuranceData.family || [] }
                ].map(group => (
                  <div key={group.cat} style={{ background: "#F8FAFC", border: "1px solid #E2E8F0", borderRadius: 8, padding: 12 }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: "var(--ink)", marginBottom: 8, display: "flex", justifyContent: "space-between" }}>
                      <span>{group.title} ({group.list.length} 筆)</span>
                    </div>

                    {group.list.length === 0 ? (
                      <div style={{ fontSize: 12, color: "#94A3B8", fontStyle: "italic", padding: 6 }}>目前無此類別保單</div>
                    ) : (
                      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                        {group.list.map(item => (
                          <div key={item.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#fff", padding: "8px 12px", borderRadius: 6, border: "1px solid #CBD5E1", flexWrap: "wrap", gap: 8 }}>
                            <div>
                              <div style={{ fontWeight: 700, fontSize: 13, color: "var(--ink)", display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                                {item.relation && (
                                  <span className={item.relation.includes("毛小孩") ? "tag-purple" : item.relation.includes("配偶") ? "tag-gold" : item.relation.includes("長輩") || item.relation.includes("父親") ? "tag-s" : "tag-blue"} style={{ fontSize: 11, padding: "1px 6px" }}>
                                    {item.relation} {item.memberName ? `(${item.memberName})` : ""}
                                  </span>
                                )}
                                <span>{item.name}</span>
                                <span style={{ fontFamily: "monospace", fontSize: 11, color: "#64748B" }}>[{item.policyNo || item.id}]</span>
                              </div>
                              <div style={{ fontSize: 11, color: "#64748B", marginTop: 2 }}>
                                {item.company} ｜ {item.currency} ｜ {item.payFreq || item.freq || "年繳"}
                                {item.totalPeriods ? ` ｜ 進度: 第 ${item.currentPeriod || 0}/${item.totalPeriods} 期` : ""}
                                {item.photo ? " ｜ 📷 已附保單照片" : ""}
                              </div>
                            </div>
                            <div style={{ display: "flex", gap: 6 }}>
                              {(insuranceManageMode === "all" || insuranceManageMode === "edit") && (
                                <button
                                  className="btn"
                                  style={{ fontSize: 11, padding: "4px 10px", background: "#3B82F6", color: "#fff" }}
                                  onClick={() => {
                                    setEditingPolicy({ ...item, category: group.cat });
                                  }}
                                >
                                  ✏️ 修改保單
                                </button>
                              )}
                              {(insuranceManageMode === "all" || insuranceManageMode === "delete") && (
                                <button
                                  className="btnl"
                                  style={{ fontSize: 11, padding: "4px 10px", color: "#EF4444", borderColor: "#FCA5A5", background: "#FEF2F2" }}
                                  onClick={() => {
                                    setPolicyToDelete({ id: item.id, name: item.name, category: group.cat });
                                  }}
                                >
                                  🗑️ 刪除保單
                                </button>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                ))}
              </div>

              <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 18 }}>
                <button className="btnl" onClick={() => setShowManageInsuranceModal(false)}>
                  關閉管理面板
                </button>
              </div>
            </div>
          </div>
        )}

        {/* 🌟 核心需求 10-4：編輯/變更保單 Modal */}
        {editingPolicy && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(15,23,42,0.75)", backdropFilter: "blur(4px)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 130, padding: 16 }}>
            <div className="card" style={{ maxWidth: 620, width: "100%", padding: 24, borderRadius: 10, maxHeight: "90vh", overflowY: "auto", background: "#fff", boxShadow: "0 20px 40px rgba(0,0,0,0.3)" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14, borderBottom: "1px solid var(--line-soft)", paddingBottom: 10 }}>
                <div>
                  <span className="tag-blue" style={{ marginBottom: 4, display: "inline-block" }}>保單變更</span>
                  <h3 style={{ ...SF, fontSize: 18, ...ink, margin: 0 }}>✏️ 變更現有保單內容：{editingPolicy.name}</h3>
                </div>
                <button onClick={() => setEditingPolicy(null)} style={{ background: "transparent", border: "none", fontSize: 20, cursor: "pointer", ...soft }}>✕</button>
              </div>

              {/* 若為家庭保單，顯示稱謂與家庭成員姓名變更欄 */}
              {(editingPolicy.category === "family" || editingPolicy.relation) && (
                <div style={{ background: "#FDF4EE", border: "1px solid #FBCFE8", padding: 12, borderRadius: 6, marginBottom: 12 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: "var(--seal)", marginBottom: 6 }}>👨‍👩‍👧‍👦 家庭成員身分與稱謂歸戶：</div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 10 }}>
                    <div>
                      <label style={{ fontSize: 11, fontWeight: 700, ...ink, display: "block", marginBottom: 3 }}>家屬稱謂：</label>
                      <select
                        className="inp"
                        value={["配偶", "父親", "母親", "長輩", "長女", "長子", "毛小孩 (犬)", "毛小孩 (貓)"].includes(editingPolicy.relation) ? editingPolicy.relation : "自訂稱謂"}
                        onChange={e => {
                          const val = e.target.value;
                          if (val === "自訂稱謂") {
                            setEditingPolicy(prev => ({ ...prev, relation: "" }));
                          } else {
                            setEditingPolicy(prev => ({ ...prev, relation: val }));
                          }
                        }}
                      >
                        <option value="配偶">配偶 (伴侶)</option>
                        <option value="父親">父親 (長輩)</option>
                        <option value="母親">母親 (長輩)</option>
                        <option value="長輩">其他公婆/長輩</option>
                        <option value="長女">長女 (子女)</option>
                        <option value="長子">長子 (子女)</option>
                        <option value="毛小孩 (犬)">毛小孩 (犬)</option>
                        <option value="毛小孩 (貓)">毛小孩 (貓)</option>
                        <option value="自訂稱謂">✏️ 自行輸入其他稱謂...</option>
                      </select>
                      {!["配偶", "父親", "母親", "長輩", "長女", "長子", "毛小孩 (犬)", "毛小孩 (貓)"].includes(editingPolicy.relation) && (
                        <input
                          className="inp"
                          style={{ marginTop: 4 }}
                          placeholder="輸入稱謂"
                          value={editingPolicy.relation || ""}
                          onChange={e => setEditingPolicy(prev => ({ ...prev, relation: e.target.value }))}
                        />
                      )}
                    </div>
                    <div>
                      <label style={{ fontSize: 11, fontWeight: 700, ...ink, display: "block", marginBottom: 3 }}>成員姓名：</label>
                      <input
                        className="inp"
                        value={editingPolicy.memberName || ""}
                        onChange={e => setEditingPolicy(prev => ({ ...prev, memberName: e.target.value }))}
                      />
                    </div>
                  </div>

                  {/* 快捷連動資料表家庭成員 */}
                  <div style={{ marginTop: 8, borderTop: "1px dashed #FBCFE8", paddingTop: 8 }}>
                    <div style={{ fontSize: 11, color: "var(--seal)", marginBottom: 4, fontWeight: 700 }}>
                      🔗 點擊快速更換為現有家庭成員：
                    </div>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                      {[
                        ...(familyData?.spouseAndParents || []).map(m => ({ name: m.name, rel: m.relationship || "配偶" })),
                        ...(familyData?.children || []).map(m => ({ name: m.name, rel: m.relationship || "子女" })),
                        ...(familyData?.pets || []).map(m => ({ name: m.name, rel: m.type ? `毛小孩 (${m.type.split("(")[0].trim() || "寵物"})` : "毛小孩" }))
                      ].map((m, idx) => (
                        <button
                          key={`edit-fam-${m.name}-${idx}`}
                          type="button"
                          className="btnl"
                          style={{
                            fontSize: 10,
                            padding: "2px 8px",
                            background: editingPolicy.memberName === m.name ? "var(--ink)" : "#fff",
                            color: editingPolicy.memberName === m.name ? "#fff" : "var(--ink)",
                            borderColor: editingPolicy.memberName === m.name ? "var(--ink)" : "var(--line)"
                          }}
                          onClick={() => setEditingPolicy(prev => ({ ...prev, relation: m.rel, memberName: m.name }))}
                        >
                          {m.rel} - {m.name}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 12 }}>
                <div>
                  <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>保單名稱：</label>
                  <input
                    className="inp"
                    value={editingPolicy.name}
                    onChange={e => setEditingPolicy({ ...editingPolicy, name: e.target.value })}
                  />
                </div>
                <div>
                  <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>承保公司：</label>
                  <input
                    className="inp"
                    value={editingPolicy.company}
                    onChange={e => setEditingPolicy({ ...editingPolicy, company: e.target.value })}
                  />
                </div>
                <div>
                  <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>法定保單號碼：</label>
                  <input
                    className="inp"
                    value={editingPolicy.policyNo || ""}
                    onChange={e => setEditingPolicy({ ...editingPolicy, policyNo: e.target.value })}
                  />
                </div>
                <div>
                  <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>計價幣別：</label>
                  <select
                    className="inp"
                    value={editingPolicy.currency}
                    onChange={e => setEditingPolicy({ ...editingPolicy, currency: e.target.value })}
                  >
                    <option value="TWD">🇹🇼 新台幣 (TWD)</option>
                    <option value="USD">🇺🇸 美元 (USD)</option>
                  </select>
                </div>
              </div>

              {/* 繳費期數與進度變更 */}
              {editingPolicy.totalPeriods !== undefined && (
                <div style={{ background: "#F8FAFC", border: "1px solid #E2E8F0", padding: 12, borderRadius: 6, marginTop: 12 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: "var(--seal)", marginBottom: 8 }}>繳費頻率與期數微調：</div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 10 }}>
                    <div>
                      <label style={{ fontSize: 11, fontWeight: 700, ...ink, display: "block", marginBottom: 3 }}>繳費方式：</label>
                      <select
                        className="inp"
                        value={editingPolicy.payFreq || "年繳"}
                        onChange={e => setEditingPolicy({ ...editingPolicy, payFreq: e.target.value })}
                      >
                        <option value="年繳">年繳</option>
                        <option value="半年繳">半年繳</option>
                        <option value="季繳">季繳</option>
                        <option value="月繳">月繳</option>
                        <option value="躉繳">躉繳</option>
                      </select>
                    </div>
                    <div>
                      <label style={{ fontSize: 11, fontWeight: 700, ...ink, display: "block", marginBottom: 3 }}>每期保費：</label>
                      <input
                        className="inp"
                        type="number"
                        value={editingPolicy.periodPremium || 0}
                        onChange={e => setEditingPolicy({ ...editingPolicy, periodPremium: e.target.value })}
                      />
                    </div>
                    <div>
                      <label style={{ fontSize: 11, fontWeight: 700, ...ink, display: "block", marginBottom: 3 }}>總期數：</label>
                      <input
                        className="inp"
                        type="number"
                        min="1"
                        value={editingPolicy.totalPeriods || 1}
                        onChange={e => setEditingPolicy({ ...editingPolicy, totalPeriods: Number(e.target.value) })}
                      />
                    </div>
                    <div>
                      <label style={{ fontSize: 11, fontWeight: 700, ...ink, display: "block", marginBottom: 3 }}>目前繳納期數：</label>
                      <input
                        className="inp"
                        type="number"
                        min="0"
                        value={editingPolicy.currentPeriod || 0}
                        onChange={e => setEditingPolicy({ ...editingPolicy, currentPeriod: Number(e.target.value) })}
                      />
                    </div>
                  </div>
                </div>
              )}

              {/* 受益人變更 */}
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 12, marginTop: 12 }}>
                <div>
                  <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>利息受益人：</label>
                  <input
                    className="inp"
                    value={editingPolicy.interestBeneficiary || ""}
                    onChange={e => setEditingPolicy({ ...editingPolicy, interestBeneficiary: e.target.value })}
                  />
                </div>
                <div>
                  <label style={{ fontSize: 12, fontWeight: 700, ...ink, display: "block", marginBottom: 4 }}>本金受益人：</label>
                  <input
                    className="inp"
                    value={editingPolicy.principalBeneficiary || ""}
                    onChange={e => setEditingPolicy({ ...editingPolicy, principalBeneficiary: e.target.value })}
                  />
                </div>
              </div>

              {/* 保單原件照片重拍/上傳 */}
              <div style={{ marginTop: 14, background: "var(--paper)", padding: 12, borderRadius: 6, border: "1px dashed var(--line)" }}>
                <div style={{ fontSize: 12, fontWeight: 700, ...ink, marginBottom: 6 }}>📷 補拍或更換保單照片：</div>
                <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                  <label className="btn" style={{ fontSize: 11, padding: "6px 12px", background: "var(--ink)", color: "#fff", cursor: "pointer" }}>
                    📸 拍照更換
                    <input
                      type="file"
                      accept="image/*"
                      capture="environment"
                      style={{ display: "none" }}
                      onChange={e => handlePolicyPhotoUpload(e, true)}
                    />
                  </label>
                  <label className="btnl" style={{ fontSize: 11, padding: "6px 12px", cursor: "pointer" }}>
                    📁 選取新圖
                    <input
                      type="file"
                      accept="image/*"
                      style={{ display: "none" }}
                      onChange={e => handlePolicyPhotoUpload(e, true)}
                    />
                  </label>
                  {editingPolicy.photo && (
                    <button
                      className="btnl"
                      style={{ fontSize: 11, padding: "4px 8px", color: "#EF4444" }}
                      onClick={() => setEditingPolicy({ ...editingPolicy, photo: null, photoName: "" })}
                    >
                      ✕ 刪除現有照片
                    </button>
                  )}
                </div>
                {editingPolicy.photo && (
                  <div style={{ marginTop: 8, textAlign: "center", background: "#0F172A", padding: 8, borderRadius: 4 }}>
                    <img src={editingPolicy.photo} alt="預覽" style={{ maxHeight: 120, maxWidth: "100%", objectFit: "contain" }} />
                  </div>
                )}
              </div>

              <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 18, borderTop: "1px solid var(--line-soft)", paddingTop: 12 }}>
                <button className="btnl" onClick={() => setEditingPolicy(null)}>
                  取消返回
                </button>
                <button className="btn" style={{ background: "#3B82F6", color: "#fff", padding: "8px 20px" }} onClick={handleSaveEditPolicy}>
                  儲存變更
                </button>
              </div>
            </div>
          </div>
        )}

        {/* 🌟 核心需求 10-4：刪除保單確認彈窗 */}
        {policyToDelete && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.65)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 135, padding: 16 }}>
            <div className="card" style={{ maxWidth: 420, width: "100%", padding: 24, borderRadius: 8, boxShadow: "0 10px 30px rgba(0,0,0,0.3)", background: "#fff" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
                <div style={{ width: 40, height: 40, borderRadius: "50%", background: "#FEE2E2", color: "#EF4444", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20 }}>
                  🗑️
                </div>
                <div>
                  <h3 style={{ ...SF, fontSize: 17, color: "#DC2626", margin: 0 }}>確認刪除此張保單？</h3>
                  <div style={{ fontSize: 12, ...soft, marginTop: 2 }}>此操作將從您的保單資料庫中永久移除</div>
                </div>
              </div>

              <div style={{ background: "var(--paper)", padding: 12, borderRadius: 6, marginBottom: 16, fontSize: 13, border: "1px solid var(--line-soft)" }}>
                <div>保單名稱：<b style={{ color: "var(--ink)" }}>{policyToDelete.name}</b></div>
                <div style={{ fontSize: 11, color: "#EF4444", marginTop: 6 }}>
                  ※ 刪除後，上方被動現金流精算看板、月均配息與付清狀態將即時重算更新。
                </div>
              </div>

              <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
                <button className="btnl" onClick={() => setPolicyToDelete(null)} style={{ padding: "8px 16px" }}>
                  取消
                </button>
                <button className="btn" onClick={handleConfirmDeletePolicy} style={{ background: "#DC2626", color: "#fff", padding: "8px 18px" }}>
                  確認刪除保單
                </button>
              </div>
            </div>
          </div>
        )}

        
      {/* 🌟 尊榮 Apple 規格選購式：退休方案多維度橫向比較看板 Modal (支援 2 欄 / 3 欄彈性切換) */}
      {showRetireCompareModal && (() => {
        // -------------------------------------------------------------------
        // 動態計算任一方案之全維度數據 (支援即時試算、預設推薦情境、自訂儲存目標)
        // -------------------------------------------------------------------
        const getScenarioMetrics = (slotKey) => {
          const MIN_WAGE = 29800;
          const BASE_EMPLOYER_RATE = 0.06;
          const BASE_PENSION_RETURN = 0.0764;
          const BASE_INFLATION_RATE = 0.02;
          const LIFE_EXPECTANCY = 85;

          const hasProfileStartAge = userProfile.startWorkAge !== "" && userProfile.startWorkAge !== null && userProfile.startWorkAge !== undefined && Number(userProfile.startWorkAge) > 0;
          const currentAge = profileAge;
          const gender = retireGender || "female";

          let targetAgeVal = 65;
          let pStartAge = hasProfileStartAge ? Number(userProfile.startWorkAge) : (Number(retireStartAge) || 25);
          let planName = "退休方案";
          let planTag = "推薦情境";
          let customParams = null;
          let customExp = null;
          let savedGoalRef = null;

          if (slotKey === "current") {
            targetAgeVal = Number(retireTargetAge) || 65;
            planName = "當前試算即時狀態";
            planTag = "⚡ LIVE 即時連動";
          } else if (slotKey === "builtin_60") {
            targetAgeVal = 60;
            planName = "60 歲 樂活提早退休";
            planTag = "提前 5 年請領 (減額20%)";
          } else if (slotKey === "builtin_65") {
            targetAgeVal = 65;
            planName = "65 歲 法定標準退休";
            planTag = "法定標準基準 (100%)";
          } else if (slotKey === "builtin_70") {
            targetAgeVal = 70;
            planName = "70 歲 展延極大退休";
            planTag = "延後 5 年請領 (增額20%)";
          } else if (slotKey.startsWith("saved_")) {
            const gid = slotKey.replace("saved_", "");
            const g = (savedRetireGoals || []).find(item => String(item.id) === String(gid));
            if (g) {
              savedGoalRef = g;
              targetAgeVal = Number(g.params?.retireTargetAge) || 65;
              pStartAge = Number(g.params?.retireStartAge) || pStartAge;
              planName = g.name;
              planTag = `📂 自訂目標 (儲存於 ${g.savedAt})`;
              customParams = g.params;
              customExp = g.expectations;
            }
          }

          const startAge = Math.min(40, Math.max(16, pStartAge));
          const targetAge = Math.min(70, Math.max(40, targetAgeVal));
          const totalWorkYears = Math.max(1, targetAge - startAge);
          const pastWorkYears = Math.max(0, currentAge - startAge);
          const yearsToRetire = Math.max(0, targetAge - currentAge);

          // 生命表動態餘命
          const lifeExpData = getMortalityLifeExp(gender, targetAge);
          const dynamicLifeYears = Math.max(10, Math.round(lifeExpData.lifeExp));
          const retireLifeYears = isPremier ? dynamicLifeYears : Math.max(15, LIFE_EXPECTANCY - targetAge);
          const expectedDeathAge = isPremier ? lifeExpData.expectedDeathAge : LIFE_EXPECTANCY;

          // 貸款未清償精算
          const allActiveLoans = [
            ...(BACKEND_LOAN_DATA.mortgage || []).map(l => ({ ...l, loanCategory: "房貸" })),
            ...(BACKEND_LOAN_DATA.car || []).map(l => ({ ...l, loanCategory: "車貸" })),
            ...(BACKEND_LOAN_DATA.credit || []).map(l => ({ ...l, loanCategory: "信貸" }))
          ];
          let totalRemainingLoanAtRetire = 0;
          let monthlyLoanPaymentAtRetire = 0;
          const monthsUntilRetire = yearsToRetire * 12;
          allActiveLoans.forEach(loan => {
            const totalTermMonths = (Number(loan.totalPeriods) || (loan.termYears ? loan.termYears * 12 : 240));
            const paidMonthsSoFar = Number(loan.currentPeriod) || 0;
            const remainingMonthsToday = Math.max(0, totalTermMonths - paidMonthsSoFar);
            const originalPrincipal = Number(loan.principal) || 0;
            const monthlyRate = (Number(loan.interestRate) || 2.1) / 100 / 12;
            let monthlyPmt = Number(loan.monthlyPayment) || 0;
            if (monthlyPmt <= 0 && originalPrincipal > 0 && monthlyRate > 0 && totalTermMonths > 0) {
              monthlyPmt = Math.round(originalPrincipal * (monthlyRate * Math.pow(1 + monthlyRate, totalTermMonths)) / (Math.pow(1 + monthlyRate, totalTermMonths) - 1));
            }
            if (remainingMonthsToday > monthsUntilRetire) {
              const remainingMonthsAtRetire = remainingMonthsToday - monthsUntilRetire;
              let balAtRetire = 0;
              if (monthlyRate > 0 && monthlyPmt > 0) {
                balAtRetire = Math.round(monthlyPmt * (1 - Math.pow(1 + monthlyRate, -remainingMonthsAtRetire)) / monthlyRate);
              } else {
                balAtRetire = Math.round(originalPrincipal * (remainingMonthsAtRetire / totalTermMonths));
              }
              totalRemainingLoanAtRetire += balAtRetire;
              monthlyLoanPaymentAtRetire += monthlyPmt;
            }
          });

          // 每月生活期望現值
          const baseMonthlyLiving = customExp?.retireMonthlyExpense !== undefined ? Number(customExp.retireMonthlyExpense) : Math.max(0, Number(retireMonthlyExpense) || 40000);
          const advTravelD = customExp?.advTravelDomestic !== undefined ? Number(customExp.advTravelDomestic) : Number(advTravelDomestic) || 0;
          const advTravelA = customExp?.advTravelAsia !== undefined ? Number(customExp.advTravelAsia) : Number(advTravelAsia) || 0;
          const advTravelG = customExp?.advTravelGlobal !== undefined ? Number(customExp.advTravelGlobal) : Number(advTravelGlobal) || 0;
          const annualTravelCost = advTravelD * 10000 + advTravelA * 70000 + advTravelG * 200000;
          const monthlyTravel = Math.round(annualTravelCost / 12);
          const advGathering = customExp?.advGatheringCount !== undefined ? Number(customExp.advGatheringCount) : Number(advGatheringCount) || 0;
          const monthlyGathering = Math.round(advGathering * 1500 / 12);
          const bCar = customExp?.advBuyCar !== undefined ? customExp.advBuyCar : advBuyCar;
          const monthlyCarPurchase = bCar === "buy3y" ? Math.round(1000000 / 36) : (bCar === "buy5y" || bCar === "yes") ? Math.round(1000000 / 60) : 0;
          const rType = customExp?.advRentType !== undefined ? customExp.advRentType : advRentType;
          const monthlyRent = rType === "withParking" ? 25000 : rType === "noParking" ? 20000 : 0;
          const carMaint = customExp?.advCarMaintenance !== undefined ? Number(customExp.advCarMaintenance) : Number(advCarMaintenance) || 0;
          const monthlyCarMaintenance = Math.round(carMaint / 12);
          const bCare = customExp?.advBeautyCareCount !== undefined ? Number(customExp.advBeautyCareCount) : Number(advBeautyCareCount) || 0;
          const monthlyBeautyCare = Math.round(bCare * 50000 / 12);
          const totalAdvMonthlyBase = baseMonthlyLiving + monthlyTravel + monthlyGathering + monthlyRent + monthlyCarPurchase + monthlyCarMaintenance + monthlyBeautyCare;

          // 參數設定
          const advInflRate = customParams?.advInflationRate !== undefined ? Number(customParams.advInflationRate) : (Number(advInflationRate) || 0.02);
          const advSelfRate = customParams?.advSelfContribRate !== undefined ? Number(customParams.advSelfContribRate) : (Number(advSelfContribRate) || 0.06);
          const advTotalContribRate = BASE_EMPLOYER_RATE + advSelfRate;
          const advReturnRate = customParams?.advPensionReturnRate !== undefined ? Number(customParams.advPensionReturnRate) : (Number(advPensionReturnRate) || 0.0764);
          const advAccountBal = customParams?.advCurrentAccountBal !== undefined ? Number(customParams.advCurrentAccountBal) : Math.max(0, Number(advCurrentAccountBal) || 0);
          const advWageGrowth = customParams?.advWageGrowthRate !== undefined ? Number(customParams.advWageGrowthRate) : (Number(advWageGrowthRate) || 0.0194);
          const advWageCap = customParams?.advLaborWageCap !== undefined ? Number(customParams.advLaborWageCap) : (Number(advLaborWageCap) || 45800);
          const postRetireRoi = customParams?.advPostRetireRoi !== undefined ? Number(customParams.advPostRetireRoi) : (Number(advPostRetireRoi) || 0.03);

          // 1. 勞保老年給付 (依法定減展額)
          const liWage = isPremier ? advWageCap : MIN_WAGE;
          const liData = calcLaborInsurancePension(liWage, totalWorkYears, targetAge);
          const laborInsuranceMonthly = liData.monthly;
          const laborInsuranceTotal = laborInsuranceMonthly * 12 * retireLifeYears;

          // 2. 勞退新制專戶
          let laborPensionAtRetire = 0;
          if (isPremier) {
            const currentAccountFvAtRetire = Math.round(advAccountBal * Math.pow(1 + advReturnRate, yearsToRetire));
            const advMonthlyPensionRate = advReturnRate / 12;
            const advTotalMonths = yearsToRetire * 12;
            const effectiveMonthlyGrowth = Math.pow(1 + advWageGrowth, 1 / 12) - 1;
            let futureMonthlyContribFv = 0;
            if (advTotalMonths > 0) {
              const initialMonthlyContrib = advWageCap * advTotalContribRate;
              if (Math.abs(advMonthlyPensionRate - effectiveMonthlyGrowth) > 0.00001) {
                const gFactor = (Math.pow(1 + advMonthlyPensionRate, advTotalMonths) - Math.pow(1 + effectiveMonthlyGrowth, advTotalMonths)) / (advMonthlyPensionRate - effectiveMonthlyGrowth);
                futureMonthlyContribFv = Math.round(initialMonthlyContrib * gFactor);
              } else {
                futureMonthlyContribFv = Math.round(initialMonthlyContrib * advTotalMonths * Math.pow(1 + advMonthlyPensionRate, advTotalMonths - 1));
              }
            }
            laborPensionAtRetire = currentAccountFvAtRetire + futureMonthlyContribFv;
          } else {
            const basePensionMonthlyContrib = Math.round(MIN_WAGE * BASE_EMPLOYER_RATE);
            const basePensionMonthlyRate = BASE_PENSION_RETURN / 12;
            const basePensionTotalMonths = totalWorkYears * 12;
            laborPensionAtRetire = Math.round(basePensionMonthlyContrib * (Math.pow(1 + basePensionMonthlyRate, basePensionTotalMonths) - 1) / basePensionMonthlyRate);
          }
          const laborPensionMonthly = Math.round(laborPensionAtRetire / (retireLifeYears * 12));

          // 3. 投資組合月現金流
          const twStockMarketVal = twStocks.reduce((sum, s) => sum + (Number(s.currentPrice || s.price) || 0) * (Number(s.shares) || 0), 0);
          const usStockMarketVal = usStocks.reduce((sum, s) => sum + (Number(s.currentPrice || s.price) || 0) * (Number(s.shares) || 0) * 32.2, 0);
          const fundMarketVal = funds.reduce((sum, f) => sum + (f.currency === "USD" ? (Number(f.nav) || 0) * (Number(f.shares) || 0) * 32.2 : (Number(f.nav) || 0) * (Number(f.shares) || 0)), 0);
          const goldMarketVal = golds.reduce((sum, g) => sum + (Number(g.currentPrice || g.avgPrice) || 0) * (Number(g.weight) || 0), 0);
          const currentPortfolioVal = Math.round(twStockMarketVal + usStockMarketVal + fundMarketVal + goldMarketVal);
          const portfolioReturnData = calcPortfolioWeighted5YReturn(twStocks, usStocks, funds, golds);
          const retireInvestGrowthRate = portfolioReturnData.weightedReturnPct / 100;
          const portfolioAtRetire = Math.round(currentPortfolioVal * Math.pow(1 + retireInvestGrowthRate, yearsToRetire));
          const portfolioMonthly = Math.round(portfolioAtRetire / (retireLifeYears * 12));

          // 4. 商業保險年金配息 (嚴格限已繳清且本人受益)
          let currentInsuranceAnnual = 0;
          (insuranceData.savings || []).forEach(s => {
            const isPaid = (Number(s.currentPeriod) || 0) >= (Number(s.totalPeriods) || 1);
            const isSelf = (s.interestBeneficiary || "").includes("本人");
            if (!isPaid || !isSelf) return;
            const mult = s.divFreq === "月配" ? 12 : s.divFreq === "季配" ? 4 : s.divFreq === "半年配" ? 2 : 1;
            const rate = s.currency === "USD" ? 32.2 : 1;
            let grossAnn = (Number(s.divAmt) || 0) * mult * rate;
            if (s.currency !== "USD" && (Number(s.divAmt) || 0) >= 20000) {
              grossAnn = Math.max(0, grossAnn - Math.round(grossAnn * 0.0211));
            }
            currentInsuranceAnnual += grossAnn;
          });
          (insuranceData.investment || []).forEach(i => {
            const isPaid = (Number(i.currentPeriod) || 0) >= (Number(i.totalPeriods) || 1);
            const isSelf = (i.interestBeneficiary || "").includes("本人");
            if (!isPaid || !isSelf) return;
            const mult = i.divFreq === "年配" ? 1 : i.divFreq === "季配" ? 4 : 12;
            const rate = i.currency === "USD" ? 32.2 : 1;
            currentInsuranceAnnual += (Number(i.divAmt) || 0) * mult * rate;
          });
          currentInsuranceAnnual = Math.round(currentInsuranceAnnual);

          let insuranceAssetValue = 0;
          (insuranceData.savings || []).forEach(s => {
            const isSelf = (s.interestBeneficiary || "").includes("本人") || (s.principalBeneficiary || "").includes("本人");
            if (!isSelf) return;
            const rate = s.currency === "USD" ? 32.2 : 1;
            if (s.reserveValue !== undefined && s.reserveValue !== null) {
              insuranceAssetValue += Number(s.reserveValue) || 0;
            } else {
              const isPaid = (Number(s.currentPeriod) || 0) >= (Number(s.totalPeriods) || 1);
              if (isPaid && s.principal) {
                insuranceAssetValue += (Number(s.principal) || 0) * rate;
              } else {
                const totalPaid = (Number(s.periodPremium) || 0) * (Number(s.currentPeriod) || 0) * rate;
                insuranceAssetValue += Math.round(totalPaid * 0.7);
              }
            }
          });
          (insuranceData.investment || []).forEach(i => {
            const isSelf = (i.interestBeneficiary || "").includes("本人") || (i.principalBeneficiary || "").includes("本人");
            if (!isSelf) return;
            const rate = i.currency === "USD" ? 32.2 : 1;
            if (i.accountValue !== undefined && i.accountValue !== null) {
              insuranceAssetValue += (Number(i.accountValue) || 0) * rate;
            } else {
              const isPaid = (Number(i.currentPeriod) || 0) >= (Number(i.totalPeriods) || 1);
              if (isPaid && i.principal) {
                insuranceAssetValue += (Number(i.principal) || 0) * rate;
              } else {
                const totalPaid = (Number(i.periodPremium) || 0) * (Number(i.currentPeriod) || 0) * rate;
                insuranceAssetValue += Math.round(totalPaid * 0.7);
              }
            }
          });
          insuranceAssetValue = Math.round(insuranceAssetValue);
          const insuranceTotalAtRetire = insuranceAssetValue > 0 ? insuranceAssetValue : (currentInsuranceAnnual * retireLifeYears);
          const insuranceMonthly = Math.round(insuranceTotalAtRetire / (retireLifeYears * 12));

          // 支出終值與總需求準備金
          const effMonthlyBase = isPremier ? totalAdvMonthlyBase : baseMonthlyLiving;
          const effInflRate = isPremier ? advInflRate : BASE_INFLATION_RATE;
          const futureMonthlyExp = Math.round(effMonthlyBase * Math.pow(1 + effInflRate, yearsToRetire));

          let totalNeeded = 0;
          if (isPremier) {
            const realDiscountRate = (1 + postRetireRoi) / (1 + advInflRate) - 1;
            const postRetireMonthlyRealR = realDiscountRate / 12;
            const postRetireTotalMonths = retireLifeYears * 12;
            const advStaticPureLivingNeeded = futureMonthlyExp * 12 * retireLifeYears;
            const advDynamicLivingNeeded = (postRetireMonthlyRealR > 0 && postRetireTotalMonths > 0)
              ? Math.round(futureMonthlyExp * (1 - Math.pow(1 + postRetireMonthlyRealR, -postRetireTotalMonths)) / postRetireMonthlyRealR)
              : advStaticPureLivingNeeded;
            totalNeeded = advDynamicLivingNeeded + totalRemainingLoanAtRetire;
          } else {
            totalNeeded = futureMonthlyExp * 12 * retireLifeYears + totalRemainingLoanAtRetire;
          }

          // 預估累積總資產
          const projectedAssets = laborInsuranceTotal + laborPensionAtRetire + portfolioAtRetire + insuranceTotalAtRetire;
          const projectedProgressPct = totalNeeded > 0 ? Math.round((projectedAssets / totalNeeded) * 1000) / 10 : 0;

          // 零用金收支分析
          const govMonthlyTotal = laborInsuranceMonthly + laborPensionMonthly;
          const totalSupportMonthly = govMonthlyTotal + portfolioMonthly + insuranceMonthly;
          const monthlyGap = totalSupportMonthly - futureMonthlyExp;
          const isEnough = monthlyGap >= 0;

          // 成因診斷標記
          const reasons = [];
          if (liData.ageDiff < 0) {
            const earlyLoss = Math.round(liData.rawMonthly * Math.abs(liData.rateAdj));
            reasons.push({ type: "warn", text: `勞保提前減額 -${(Math.abs(liData.rateAdj) * 100).toFixed(0)}% (每月短少 ${fmt(earlyLoss)} 元)` });
          } else if (liData.ageDiff > 0) {
            const delayBonus = Math.round(liData.rawMonthly * liData.rateAdj);
            reasons.push({ type: "bonus", text: `勞保延後增額 +${(liData.rateAdj * 100).toFixed(0)}% (每月增加 +${fmt(delayBonus)} 元)` });
          } else {
            reasons.push({ type: "ok", text: "法定 65 歲標準請領 (給付係數 100%)" });
          }

          if (totalRemainingLoanAtRetire > 0) {
            reasons.push({ type: "warn", text: `退休未清償貸款餘額 ${fmt(totalRemainingLoanAtRetire)} 元 (月繳 ${fmt(monthlyLoanPaymentAtRetire)} 元)` });
          } else {
            reasons.push({ type: "ok", text: "貸款已全數結清無負債" });
          }

          const inflDiff = Math.max(0, futureMonthlyExp - effMonthlyBase);
          reasons.push({ type: "infl", text: `${yearsToRetire}年通膨膨脹增加 ${fmt(inflDiff)} 元/月` });

          return {
            slotKey,
            planName,
            planTag,
            targetAge,
            startAge,
            currentAge,
            retireLifeYears,
            expectedDeathAge,
            totalWorkYears,
            yearsToRetire,
            baseMonthlyLiving: effMonthlyBase,
            futureMonthlyExp,
            totalRemainingLoanAtRetire,
            monthlyLoanPaymentAtRetire,
            effectiveMonthlyNeedTotal: futureMonthlyExp + monthlyLoanPaymentAtRetire,
            laborInsuranceMonthly,
            liStatus: liData.ageDiff < 0 ? `提前請領 減額 -${(Math.abs(liData.rateAdj) * 100).toFixed(0)}%` : liData.ageDiff > 0 ? `延後請領 展延 +${(liData.rateAdj * 100).toFixed(0)}%` : "標準請領 100%",
            laborPensionAtRetire,
            laborPensionMonthly,
            portfolioAtRetire,
            portfolioMonthly,
            insuranceTotalAtRetire,
            insuranceMonthly,
            totalSupportMonthly,
            govMonthlyTotal,
            isEnough,
            monthlyGap: Math.abs(monthlyGap),
            signedMonthlyGap: monthlyGap,
            totalNeeded,
            projectedAssets,
            projectedProgressPct,
            capitalGap: Math.abs(projectedAssets - totalNeeded),
            reasons,
            savedGoalRef,
            rawParams: customParams || {
              retireStartAge: startAge,
              retireCurrentAge: currentAge,
              retireTargetAge: targetAge,
              advInflationRate: advInflRate,
              advSelfContribRate: advSelfRate,
              advPensionReturnRate: advReturnRate,
              advCurrentAccountBal: advAccountBal,
              advWageGrowthRate: advWageGrowth,
              advLaborWageCap: advWageCap,
              advPostRetireRoi: postRetireRoi
            },
            rawExpectations: customExp || {
              retireMonthlyExpense: baseMonthlyLiving,
              advTravelDomestic: advTravelD,
              advTravelAsia: advTravelA,
              advTravelGlobal: advTravelG,
              advGatheringCount: advGathering,
              advBuyCar: bCar,
              advRentType: rType,
              advCarMaintenance: carMaint,
              advBeautyCareCount: bCare
            }
          };
        };

        // 取得當前所選欄位之完整對照數據
        const activeColumns = compareSlots.slice(0, compareColumnCount).map(k => getScenarioMetrics(k));

        // 套用此方案至主頁面試算
        const handleApplyScenario = (scenario) => {
          if (!scenario) return;
          if (scenario.rawParams) {
            if (scenario.rawParams.retireTargetAge !== undefined) setRetireTargetAge(scenario.rawParams.retireTargetAge);
            if (scenario.rawParams.retireStartAge !== undefined) setRetireStartAge(scenario.rawParams.retireStartAge);
            if (scenario.rawParams.advInflationRate !== undefined) setAdvInflationRate(scenario.rawParams.advInflationRate);
            if (scenario.rawParams.advSelfContribRate !== undefined) setAdvSelfContribRate(scenario.rawParams.advSelfContribRate);
            if (scenario.rawParams.advPensionReturnRate !== undefined) setAdvPensionReturnRate(scenario.rawParams.advPensionReturnRate);
            if (scenario.rawParams.advCurrentAccountBal !== undefined) setAdvCurrentAccountBal(scenario.rawParams.advCurrentAccountBal);
            if (scenario.rawParams.advWageGrowthRate !== undefined) setAdvWageGrowthRate(scenario.rawParams.advWageGrowthRate);
            if (scenario.rawParams.advLaborWageCap !== undefined) setAdvLaborWageCap(scenario.rawParams.advLaborWageCap);
            if (scenario.rawParams.advPostRetireRoi !== undefined) setAdvPostRetireRoi(scenario.rawParams.advPostRetireRoi);
          }
          if (scenario.rawExpectations) {
            if (scenario.rawExpectations.retireMonthlyExpense !== undefined) setRetireMonthlyExpense(scenario.rawExpectations.retireMonthlyExpense);
            if (scenario.rawExpectations.advTravelDomestic !== undefined) setAdvTravelDomestic(scenario.rawExpectations.advTravelDomestic);
            if (scenario.rawExpectations.advTravelAsia !== undefined) setAdvTravelAsia(scenario.rawExpectations.advTravelAsia);
            if (scenario.rawExpectations.advTravelGlobal !== undefined) setAdvTravelGlobal(scenario.rawExpectations.advTravelGlobal);
            if (scenario.rawExpectations.advGatheringCount !== undefined) setAdvGatheringCount(scenario.rawExpectations.advGatheringCount);
            if (scenario.rawExpectations.advBuyCar !== undefined) setAdvBuyCar(scenario.rawExpectations.advBuyCar);
            if (scenario.rawExpectations.advRentType !== undefined) setAdvRentType(scenario.rawExpectations.advRentType);
            if (scenario.rawExpectations.advCarMaintenance !== undefined) setAdvCarMaintenance(scenario.rawExpectations.advCarMaintenance);
            if (scenario.rawExpectations.advBeautyCareCount !== undefined) setAdvBeautyCareCount(scenario.rawExpectations.advBeautyCareCount);
          }
          setShowRetireCompareModal(false);
          alert(`✅ 已成功將【${scenario.planName} (${scenario.targetAge}歲退休)】的所有設定參數套用至主頁面試算！`);
        };

        const handleSlotChange = (colIdx, newKey) => {
          const updated = [...compareSlots];
          updated[colIdx] = newKey;
          setCompareSlots(updated);
        };

        return (
          <div
            style={{
              position: "fixed",
              inset: 0,
