          <div className="card">
            <h3 style={{ ...SF, fontSize: 16, ...ink, margin: "0 0 12px", display: "flex", alignItems: "center", gap: 8 }}>
              <span>📊 中華民國遺產稅三級超額累進稅率結構表（遺產淨額 = 總遺產 - 免稅額 - 扣除額）</span>
            </h3>
            <div className="ft-table-wrapper">
              <table className="ft">
                <thead>
                  <tr>
                    <th>遺產淨額級距 (扣除免稅與扣除額後)</th>
                    <th style={{ textAlign: "center" }}>法定稅率</th>
                    <th style={{ textAlign: "right" }}>速算累進差額</th>
                    <th>實務試算與申報說明</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td><b>5,000 萬元以下</b></td>
                    <td style={{ textAlign: "center", fontWeight: 700, color: "var(--green)" }}>10%</td>
                    <td style={{ textAlign: "right" }}>NT$ 0</td>
                    <td style={{ fontSize: 12, ...soft }}>絕大多數傳承家庭適用，基本免稅額+各項扣除額常可抵銷 2,000~3,000 萬淨資產</td>
                  </tr>
                  <tr>
                    <td><b>超過 5,000 萬元至 1 億元</b></td>
                    <td style={{ textAlign: "center", fontWeight: 700, color: "var(--gold)" }}>15%</td>
                    <td style={{ textAlign: "right" }}>NT$ 250 萬元</td>
                    <td style={{ fontSize: 12, ...soft }}>應納稅額 = (遺產淨額 × 15%) - 250 萬元</td>
                  </tr>
                  <tr>
                    <td><b>超過 1 億元部分</b></td>

    let monthlyLoanPaymentAtRetire = 0;
    const loanRetireDetails = allActiveLoans.map(loan => {
      const remainingMonths = Number(loan.monthsLeft) || 0;
      const monthlyPayment = Number(loan.monthly) || 0;
      const annualRate = (Number(loan.rate) || 2.0) / 100;
      const monthlyRate = annualRate / 12;
      const currentBal = Number(loan.remaining) || 0;

      if (remainingMonths <= monthsUntilRetire) {
        return {
          id: loan.id,
          name: loan.name,
          category: loan.loanCategory,
          clearedBeforeRetire: true,
          balAtRetire: 0,
          monthsLeftAtRetire: 0,
          monthlyPaymentAtRetire: 0
        };
      }

      const monthsLeftAtRetire = remainingMonths - monthsUntilRetire;
      let balAtRetire = 0;
      if (monthlyRate > 0) {
        balAtRetire = Math.round(monthlyPayment * (1 - Math.pow(1 + monthlyRate, -monthsLeftAtRetire)) / monthlyRate);
      } else {
        balAtRetire = Math.round(monthlyPayment * monthsLeftAtRetire);
      }
      balAtRetire = Math.min(currentBal, Math.max(0, balAtRetire));

      totalRemainingLoanAtRetire += balAtRetire;
      monthlyLoanPaymentAtRetire += monthlyPayment;

      return {
        id: loan.id,
        name: loan.name,
        category: loan.loanCategory,
        clearedBeforeRetire: false,
        balAtRetire,
        monthsLeftAtRetire,
        monthlyPaymentAtRetire: monthlyPayment
      };
    });

    // -------------------------------------------------------------------------
    // 2.2 保險資產價值 (保價金/帳戶淨值優先，未提供則依累計已繳保費折算)
    // -------------------------------------------------------------------------
    let insuranceAssetValue = 0;
    let insuranceEstimateHasFallback = false;
    (insuranceData.savings || []).forEach(s => {
      const isSelf = (s.interestBeneficiary || "").includes("本人") || (s.principalBeneficiary || "").includes("本人");
      if (!isSelf) return;
      const rate = s.currency === "USD" ? 32.2 : 1;
      if (s.reserveValue !== undefined && s.reserveValue !== null) {
        insuranceAssetValue += Number(s.reserveValue) || 0;
      } else {
        const isPaid = (Number(s.currentPeriod) || 0) >= (Number(s.totalPeriods) || 1);
        if (isPaid && s.principal) {
          insuranceAssetValue += (Number(s.principal) || 0) * rate;
        } else {
          const totalPaid = (Number(s.periodPremium) || 0) * (Number(s.currentPeriod) || 0) * rate;
          insuranceAssetValue += Math.round(totalPaid * 0.7);
          insuranceEstimateHasFallback = true;
        }
      }
    });
    (insuranceData.investment || []).forEach(i => {
      const isSelf = (i.interestBeneficiary || "").includes("本人") || (i.principalBeneficiary || "").includes("本人");
      if (!isSelf) return;
      const rate = i.currency === "USD" ? 32.2 : 1;
      if (i.accountValue !== undefined && i.accountValue !== null) {
        insuranceAssetValue += (Number(i.accountValue) || 0) * rate;
      } else {
        const isPaid = (Number(i.currentPeriod) || 0) >= (Number(i.totalPeriods) || 1);
        if (isPaid && i.principal) {
          insuranceAssetValue += (Number(i.principal) || 0) * rate;
        } else {
          const totalPaid = (Number(i.periodPremium) || 0) * (Number(i.currentPeriod) || 0) * rate;
          insuranceAssetValue += Math.round(totalPaid * 0.7);
          insuranceEstimateHasFallback = true;
        }
      }
    });
    insuranceAssetValue = Math.round(insuranceAssetValue);

    // -------------------------------------------------------------------------
    // 3. 基礎試算 (初估基準方案)
    // -------------------------------------------------------------------------
    const baseMonthlyLiving = Math.max(0, Number(retireMonthlyExpense) || 40000);
    const basePensionMonthlyContrib = Math.round(MIN_WAGE * BASE_EMPLOYER_RATE); // 1,788
    const basePensionMonthlyRate = BASE_PENSION_RETURN / 12;
    const basePensionTotalMonths = totalWorkYears * 12;
    const baseLaborPensionAtRetire = Math.round(
      basePensionMonthlyContrib * (Math.pow(1 + basePensionMonthlyRate, basePensionTotalMonths) - 1) / basePensionMonthlyRate
    );
    const basePastPensionMonths = pastWorkYears * 12;
    const baseLaborPensionCurrentAcc = basePastPensionMonths > 0
      ? Math.round(basePensionMonthlyContrib * (Math.pow(1 + basePensionMonthlyRate, basePastPensionMonths) - 1) / basePensionMonthlyRate)
      : 0;

    // 勞保老年給付 (依法定提前/延後減展額機制計算)
    const baseLiData = calcLaborInsurancePension(MIN_WAGE, totalWorkYears, targetAge);
    const baseLaborInsuranceMonthly = baseLiData.monthly;
    const baseLaborInsuranceTotal = baseLaborInsuranceMonthly * 12 * retireLifeYears;

    // 初估版標準通膨複利膨脹: Present * (1 + i)^N
    const baseFutureMonthlyExp = Math.round(baseMonthlyLiving * Math.pow(1 + BASE_INFLATION_RATE, yearsToRetire));
    const basePureLivingNeeded = baseFutureMonthlyExp * 12 * retireLifeYears;
    const baseTotalNeeded = basePureLivingNeeded + totalRemainingLoanAtRetire;
    const baseCurrentAssets = baseLaborPensionCurrentAcc + currentPortfolioVal + (insuranceAssetValue > 0 ? insuranceAssetValue : currentInsuranceAnnual * 10);
    const baseProgressPct = baseTotalNeeded > 0 ? Math.min(100, Math.round((baseCurrentAssets / baseTotalNeeded) * 1000) / 10) : 0;
    const basePortfolioAtRetire = Math.round(currentPortfolioVal * Math.pow(1 + retireInvestGrowthRate, yearsToRetire));
    const baseInsuranceTotalAtRetire = insuranceAssetValue > 0 ? insuranceAssetValue : (currentInsuranceAnnual * retireLifeYears);
    const baseProjectedAssets = baseLaborInsuranceTotal + baseLaborPensionAtRetire + basePortfolioAtRetire + baseInsuranceTotalAtRetire;
    const baseProjectedProgressPct = baseTotalNeeded > 0 ? Math.round((baseProjectedAssets / baseTotalNeeded) * 1000) / 10 : 0;

    // -------------------------------------------------------------------------
    // 4. 進階試算 (👑 Premier 訂閱專屬細項)
    // -------------------------------------------------------------------------
    const advInflRate = Number(advInflationRate) || 0.02; // 2%~5%
    const advSelfRate = Number(advSelfContribRate) || 0.06; // 0%~6%
    const advTotalContribRate = BASE_EMPLOYER_RATE + advSelfRate; // 6% + 自提
    const advReturnRate = Number(advPensionReturnRate) || 0.0764; // 7.64% ~ 15.6%
    const advAccountBal = Math.max(0, Number(advCurrentAccountBal) || 0); // 目前專戶金額
    const advWageGrowth = Number(advWageGrowthRate) || 0.0194; // 薪資年成長率

    // 退休生活期望細項支出 (現值月均化)
    const annualTravelCost = (Number(advTravelDomestic) || 0) * 10000 + (Number(advTravelAsia) || 0) * 70000 + (Number(advTravelGlobal) || 0) * 200000;
    const monthlyTravel = Math.round(annualTravelCost / 12);
    const annualGatheringCost = (Number(advGatheringCount) || 0) * 1500;
    const monthlyGathering = Math.round(annualGatheringCost / 12);
    // 購車或換車需求 (3年攤提: 100萬/36約27778元/月; 5年攤提: 100萬/60約16667元/月)
    const monthlyCarPurchase = advBuyCar === "buy3y" ? Math.round(1000000 / 36) : advBuyCar === "buy5y" || advBuyCar === "yes" ? Math.round(1000000 / 60) : 0;
    const monthlyRent = advRentType === "withParking" ? 25000 : advRentType === "noParking" ? 20000 : 0;
    // 汽車保養和維修 (自由填寫年金額，月均化)
    const annualCarMaintenance = Math.max(0, Number(advCarMaintenance) || 0);
    const monthlyCarMaintenance = Math.round(annualCarMaintenance / 12);
    // 醫美保養: 每次 5 萬
    const annualBeautyCare = (Number(advBeautyCareCount) || 0) * 50000;
    const monthlyBeautyCare = Math.round(annualBeautyCare / 12);

    // 訂閱版每月份總需求支出 (現值)
    const totalAdvMonthlyBase = baseMonthlyLiving + monthlyTravel + monthlyGathering + monthlyRent + monthlyCarPurchase + monthlyCarMaintenance + monthlyBeautyCare;

    // 勞保老年給付 (尊榮版支援最高級距 45,800 元，並依法定提前減額/展延增額機制精算)
    const advWageCap = Number(advLaborWageCap) || 45800;
    const advLiData = calcLaborInsurancePension(advWageCap, totalWorkYears, targetAge);
    const advLaborInsuranceMonthly = advLiData.monthly;
    const advLaborInsuranceTotal = advLaborInsuranceMonthly * 12 * retireLifeYears;

    // 通膨折算退休當年度每月份名目需求: TotalBase * (1 + i)^N
    const advFutureMonthlyExp = Math.round(totalAdvMonthlyBase * Math.pow(1 + advInflRate, yearsToRetire));
    
    // 退休總需資金精算：
    // (A) 靜態提領：advFutureMonthlyExp * 12 * retireLifeYears + 未還清貸款本金
    const advStaticPureLivingNeeded = advFutureMonthlyExp * 12 * retireLifeYears;
    const advStaticTotalNeeded = advStaticPureLivingNeeded + totalRemainingLoanAtRetire;
    // (B) 動態再投資折現池 (考量退休後資金池投報率 r 與退休後持續通膨 i 之實質折現率) + 退休未還清貸款本金
    const postRetireRoi = Number(advPostRetireRoi) || 0.03;
    const realDiscountRate = (1 + postRetireRoi) / (1 + advInflRate) - 1; // 費雪實質折現率
    const postRetireMonthlyRealR = realDiscountRate / 12;
    const postRetireTotalMonths = retireLifeYears * 12;
    const advDynamicLivingNeeded = postRetireMonthlyRealR > 0 && postRetireTotalMonths > 0
      ? Math.round(advFutureMonthlyExp * (1 - Math.pow(1 + postRetireMonthlyRealR, -postRetireTotalMonths)) / postRetireMonthlyRealR)
      : advStaticPureLivingNeeded;
    const advDynamicTotalNeeded = advDynamicLivingNeeded + totalRemainingLoanAtRetire;
    // 依動態再投資池作為尊榮版總需標準
    const advTotalNeeded = advDynamicTotalNeeded;
    const advSavedDiff = Math.max(0, advStaticTotalNeeded - advDynamicTotalNeeded);

    // 訂閱版勞退個人專戶本利和 (專戶現值滾存 + 考量薪資成長之提撥複利終值)
    // 依選定之投保級距浮動起算，隨薪資成長率逐年複利
    const currentAccountFvAtRetire = Math.round(advAccountBal * Math.pow(1 + advReturnRate, yearsToRetire));
    const advMonthlyPensionRate = advReturnRate / 12;
    const advTotalMonths = yearsToRetire * 12;
    const effectiveMonthlyGrowth = Math.pow(1 + advWageGrowth, 1 / 12) - 1;
    let futureMonthlyContribFv = 0;
    if (advTotalMonths > 0) {
      const initialMonthlyContrib = advWageCap * advTotalContribRate; // 浮動級距起算
      if (Math.abs(advMonthlyPensionRate - effectiveMonthlyGrowth) > 0.00001) {
        // 幾何成長年金終值公式
        const gFactor = (Math.pow(1 + advMonthlyPensionRate, advTotalMonths) - Math.pow(1 + effectiveMonthlyGrowth, advTotalMonths)) / (advMonthlyPensionRate - effectiveMonthlyGrowth);
        futureMonthlyContribFv = Math.round(initialMonthlyContrib * gFactor);
      } else {
        futureMonthlyContribFv = Math.round(initialMonthlyContrib * advTotalMonths * Math.pow(1 + advMonthlyPensionRate, advTotalMonths - 1));
      }
    }
    const advLaborPensionAtRetire = currentAccountFvAtRetire + futureMonthlyContribFv;

    // 訂閱版資產與達成率 (保險資產精算估值 + 投資組合複利方案C)
    const advCurrentAssets = advAccountBal + currentPortfolioVal + (insuranceAssetValue > 0 ? insuranceAssetValue : currentInsuranceAnnual * 10);
    const advProgressPct = advTotalNeeded > 0 ? Math.min(100, Math.round((advCurrentAssets / advTotalNeeded) * 1000) / 10) : 0;
    const advPortfolioAtRetire = Math.round(currentPortfolioVal * Math.pow(1 + retireInvestGrowthRate, yearsToRetire));
    const advInsuranceTotalAtRetire = insuranceAssetValue > 0 ? insuranceAssetValue : (currentInsuranceAnnual * retireLifeYears);
    const advProjectedAssets = advLaborInsuranceTotal + advLaborPensionAtRetire + advPortfolioAtRetire + advInsuranceTotalAtRetire;
    const advProjectedProgressPct = advTotalNeeded > 0 ? Math.round((advProjectedAssets / advTotalNeeded) * 1000) / 10 : 0;

    // 基準方案對照 (若只靠基礎勞保最低工資 29,800 + 雇主 6% 勞退)
    const basePlanTotalAtRetire = baseLaborInsuranceTotal + baseLaborPensionAtRetire;
    const basePlanMonthlyProvide = Math.round(basePlanTotalAtRetire / (retireLifeYears * 12));
    const basePlanCoveragePct = advFutureMonthlyExp > 0 ? Math.round((basePlanMonthlyProvide / advFutureMonthlyExp) * 1000) / 10 : 0;

    // -------------------------------------------------------------------------
    // 4.1 退休零用金是否足夠與短缺原因精算分析
    // -------------------------------------------------------------------------
    const calcPocketMoneyAnalysis = () => {
      const activeFutureExp = isPremier ? advFutureMonthlyExp : baseFutureMonthlyExp;
      const activeLiMonthly = isPremier ? advLaborInsuranceMonthly : baseLaborInsuranceMonthly;
      const activeLpTotal = isPremier ? advLaborPensionAtRetire : baseLaborPensionAtRetire;
      const activeLpMonthly = Math.round(activeLpTotal / (retireLifeYears * 12));
      const activePortfolioAtRetire = isPremier ? advPortfolioAtRetire : basePortfolioAtRetire;
      const activePortMonthly = Math.round(activePortfolioAtRetire / (retireLifeYears * 12));
      const activeInsAtRetire = isPremier ? advInsuranceTotalAtRetire : baseInsuranceTotalAtRetire;
      const activeInsMonthly = Math.round(activeInsAtRetire / (retireLifeYears * 12));

      // 政府社會保險月化現金流 (勞保 + 勞退)
      const govMonthlyTotal = activeLiMonthly + activeLpMonthly;
      // 四大支柱全部月化支援力
      const totalSupportMonthly = govMonthlyTotal + activePortMonthly + activeInsMonthly;
      // 零用金每月差額 (正數代表盈餘，負數代表不足)
      const monthlyGap = totalSupportMonthly - activeFutureExp;
      const isEnough = monthlyGap >= 0;

      // 短缺或盈餘成因多項解析清單
      const reasons = [];

      // 1. 勞保提前/延後狀態解析
      const activeLiData = isPremier ? advLiData : baseLiData;
      if (activeLiData.ageDiff < 0) {
        const earlyLossMonthly = Math.round(activeLiData.rawMonthly * Math.abs(activeLiData.rateAdj));
        reasons.push({
          type: "warn",
          title: "提前退休勞保減額衝擊",
          amountText: `每月短少 ${fmt(earlyLossMonthly)} 元`,
          desc: `於 ${targetAge} 歲請領勞保年金，遭依法定減額 ${(Math.abs(activeLiData.rateAdj) * 100).toFixed(0)}%，此減額終身適用。`
        });
      } else if (activeLiData.ageDiff > 0) {
        const delayedBonusMonthly = Math.round(activeLiData.rawMonthly * activeLiData.rateAdj);
        reasons.push({
          type: "bonus",
          title: "延後請領展延增額獎勵",
          amountText: `每月增加 +${fmt(delayedBonusMonthly)} 元`,
          desc: `延後至 ${targetAge} 歲請領勞保年金，依法終身增給 ${(activeLiData.rateAdj * 100).toFixed(0)}%。`
        });
      }

      // 2. 獨立房貸與負債狀態解析
      if (totalRemainingLoanAtRetire > 0) {
        reasons.push({
          type: "warn",
          title: "獨立房貸/貸款尚未結清",
          amountText: `總需額外清償 ${fmt(totalRemainingLoanAtRetire)} 元 (退休初期需月繳 ${fmt(monthlyLoanPaymentAtRetire)} 元)`,
          desc: "退休當下名下仍有貸款，需額外預留專款清償，絕不可擠壓生活零用金。"
        });
      } else {
        reasons.push({
          type: "ok",
          title: "房貸全數結清，零用金零負擔",
          amountText: "負債清償 $0 元",
          desc: "所有貸款預計於退休前順利清償完畢，所有月收入均為純支配零用金。"
        });
      }

      // 3. 通膨侵蝕解析
      const inflDiff = activeFutureExp - (isPremier ? totalAdvMonthlyBase : baseMonthlyLiving);
      if (inflDiff > 0) {
        reasons.push({
          type: "info",
          title: `長期通膨購買力侵蝕 (${(isPremier ? advInflRate : BASE_INFLATION_RATE) * 100}%/年)`,
          amountText: `每月名目支出增加 ${fmt(inflDiff)} 元`,
          desc: `歷經 ${yearsToRetire} 年通膨累積，原現值 ${fmt(isPremier ? totalAdvMonthlyBase : baseMonthlyLiving)} 元需膨脹至 ${fmt(activeFutureExp)} 元方能維持同等生活水準。`
        });
      }

      // 4. 勞退自提與薪資成長效應 (尊榮版)
      if (isPremier && advSelfRate > 0) {
        reasons.push({
          type: "bonus",
          title: `勞退自提 ${(advSelfRate * 100).toFixed(0)}% 複利助攻`,
          amountText: `退休專戶累積達 ${fmt(advLaborPensionAtRetire)} 元`,
          desc: `自提 6% 結合每年 ${(advWageGrowth * 100).toFixed(2)}% 薪資調幅與基金複利，顯著強化月退現金流。`
        });
      }

      // 5. 總體支援力判斷
      if (!isEnough) {
        const totalCapitalGap = Math.round(Math.abs(monthlyGap) * 12 * retireLifeYears);
        reasons.push({
          type: "alert",
          title: "四大支柱支援力不足",
          amountText: `每月差額 ${fmt(Math.abs(monthlyGap))} 元 (總資本缺口約 ${fmt(totalCapitalGap)} 元)`,
          desc: "現有社保年金與投資累積速度未達期望生活水準，建議透過增加個人投資或延後退休年齡彌補。"
        });
      } else {
        reasons.push({
          type: "ok",
          title: "退休零用金充裕有餘",
          amountText: `每月多出盈餘 ${fmt(monthlyGap)} 元`,
          desc: "四大支柱預估終值高於生活與負債總支出，退休後能享有充足且具安全邊際的休閒零用金。"
        });
      }

      return {
        isEnough,
        monthlyGap: Math.abs(monthlyGap),
        signedMonthlyGap: monthlyGap,
        activeFutureExp,
        totalSupportMonthly,
        govMonthlyTotal,
        reasons
      };
    };

    // -------------------------------------------------------------------------
    // 5. 儲存退休目標快照處理
    // -------------------------------------------------------------------------
    const handleSaveGoal = () => {
      const activeData = retireCalculatedResult ? retireCalculatedResult.snapshot : {
        monthlyNeeded: isPremier ? advFutureMonthlyExp : baseFutureMonthlyExp,
        totalNeeded: isPremier ? advTotalNeeded : baseTotalNeeded,
        staticTotalNeeded: isPremier ? advStaticTotalNeeded : baseTotalNeeded,
        progressPct: isPremier ? advProgressPct : baseProgressPct,
        projectedAssets: isPremier ? advProjectedAssets : baseProjectedAssets,
        projectedProgressPct: isPremier ? advProjectedProgressPct : baseProjectedProgressPct,
        laborInsuranceMonthly: isPremier ? advLaborInsuranceMonthly : baseLaborInsuranceMonthly,
        laborInsuranceTotal: isPremier ? advLaborInsuranceTotal : baseLaborInsuranceTotal,
        laborPensionAtRetire: isPremier ? advLaborPensionAtRetire : baseLaborPensionAtRetire,
        laborPensionCurrentAcc: isPremier ? advAccountBal : baseLaborPensionCurrentAcc,
        portfolioAtRetire: isPremier ? advPortfolioAtRetire : basePortfolioAtRetire,
        insuranceTotalAtRetire: isPremier ? advInsuranceTotalAtRetire : baseInsuranceTotalAtRetire,
        targetAge,
        startAge,
        currentAge,
      };

      const defaultName = `目標 ${savedRetireGoals.length + 1}（${targetAge}歲退休•月需${fmt(activeData.monthlyNeeded)}）`;
      const name = prompt("請自訂此退休目標名稱：", defaultName);
      if (!name || !name.trim()) return;

      const newGoal = {
        id: Date.now().toString(),
        name: name.trim(),
        savedAt: new Date().toLocaleDateString("zh-TW"),
        params: {
          retireStartAge: startAge,
          retireCurrentAge: currentAge,
          retireTargetAge: targetAge,
          advInflationRate: advInflRate,
          advSelfContribRate: advSelfRate,
          advPensionReturnRate: advReturnRate,
          advCurrentAccountBal: advAccountBal,
          advWageGrowthRate: advWageGrowth,
          advLaborWageCap: advWageCap,
          advPostRetireRoi: postRetireRoi
        },
        expectations: {
          retireMonthlyExpense: baseMonthlyLiving,
          advTravelDomestic: Number(advTravelDomestic) || 0,
          advTravelAsia: Number(advTravelAsia) || 0,
          advTravelGlobal: Number(advTravelGlobal) || 0,
          advGatheringCount: Number(advGatheringCount) || 0,
          advBuyCar: advBuyCar,
          advRentType: advRentType,
          advCarMaintenance: Number(advCarMaintenance) || 0,
          advBeautyCareCount: Number(advBeautyCareCount) || 0
        },
        pillarsSnapshot: {
          laborInsuranceMonthly: activeData.laborInsuranceMonthly,
          laborInsuranceTotal: activeData.laborInsuranceTotal,
          laborPensionAtRetire: activeData.laborPensionAtRetire,
          laborPensionCurrentAcc: activeData.laborPensionCurrentAcc,
          currentPortfolioVal: currentPortfolioVal,
          portfolioAtRetire: activeData.portfolioAtRetire,
          currentInsuranceAnnual: currentInsuranceAnnual,
          insuranceTotalAtRetire: activeData.insuranceTotalAtRetire,
          monthlyNeeded: activeData.monthlyNeeded,
          totalNeeded: activeData.totalNeeded,
          staticTotalNeeded: activeData.staticTotalNeeded,
          progressPct: activeData.progressPct,
          projectedAssets: activeData.projectedAssets,
          projectedProgressPct: activeData.projectedProgressPct
        }
      };

      const updated = [newGoal, ...savedRetireGoals];
      setSavedRetireGoals(updated);
      setActiveRetireGoalId(newGoal.id);
      try {
        localStorage.setItem("wealthory_saved_retire_goals", JSON.stringify(updated));
      } catch (e) {}
      alert(`✅ 已成功儲存退休目標：「${newGoal.name}」！\n包含當時的基本參數、生活期望與四大支柱明細狀態。`);
    };

    const handleLoadGoal = (goal) => {
      if (!goal) return;
      if (goal.params) {
        if (goal.params.retireStartAge !== undefined) setRetireStartAge(goal.params.retireStartAge);
        if (goal.params.retireCurrentAge !== undefined) setRetireCurrentAge(goal.params.retireCurrentAge);
        if (goal.params.retireTargetAge !== undefined) setRetireTargetAge(goal.params.retireTargetAge);
        if (goal.params.advInflationRate !== undefined) setAdvInflationRate(goal.params.advInflationRate);
        if (goal.params.advSelfContribRate !== undefined) setAdvSelfContribRate(goal.params.advSelfContribRate);
        if (goal.params.advPensionReturnRate !== undefined) setAdvPensionReturnRate(goal.params.advPensionReturnRate);
        if (goal.params.advCurrentAccountBal !== undefined) setAdvCurrentAccountBal(goal.params.advCurrentAccountBal);
        if (goal.params.advWageGrowthRate !== undefined) setAdvWageGrowthRate(goal.params.advWageGrowthRate);
        if (goal.params.advLaborWageCap !== undefined) setAdvLaborWageCap(goal.params.advLaborWageCap);
        if (goal.params.advPostRetireRoi !== undefined) setAdvPostRetireRoi(goal.params.advPostRetireRoi);
      }
      if (goal.expectations) {
        if (goal.expectations.retireMonthlyExpense !== undefined) setRetireMonthlyExpense(goal.expectations.retireMonthlyExpense);
        if (goal.expectations.advTravelDomestic !== undefined) setAdvTravelDomestic(goal.expectations.advTravelDomestic);
        if (goal.expectations.advTravelAsia !== undefined) setAdvTravelAsia(goal.expectations.advTravelAsia);
        if (goal.expectations.advTravelGlobal !== undefined) setAdvTravelGlobal(goal.expectations.advTravelGlobal);
        if (goal.expectations.advGatheringCount !== undefined) setAdvGatheringCount(goal.expectations.advGatheringCount);
        if (goal.expectations.advBuyCar !== undefined) setAdvBuyCar(goal.expectations.advBuyCar);
        if (goal.expectations.advRentType !== undefined) setAdvRentType(goal.expectations.advRentType);
        if (goal.expectations.advCarMaintenance !== undefined) setAdvCarMaintenance(goal.expectations.advCarMaintenance);
        if (goal.expectations.advBeautyCareCount !== undefined) setAdvBeautyCareCount(goal.expectations.advBeautyCareCount);
      }
      setActiveRetireGoalId(goal.id);
      // 清除計算鎖定，讓使用者可以檢視載入後的最新參數
      setRetireCalculatedResult(null);
    };

    const handleDeleteGoal = (id, e) => {
      e.stopPropagation();
      if (!confirm("確定要刪除此儲存的退休目標嗎？")) return;
      const updated = savedRetireGoals.filter(g => g.id !== id);
      setSavedRetireGoals(updated);
      if (activeRetireGoalId === id) setActiveRetireGoalId(null);
      try {
        localStorage.setItem("wealthory_saved_retire_goals", JSON.stringify(updated));
      } catch (err) {}
    };

    // 點擊「計算退休金成果」按鈕：抓取目前所有參數並鎖定生成看板
    const handleCalculateRetirement = () => {
      const pocketAnalysis = calcPocketMoneyAnalysis();
      const snapshot = {
        targetAge,
        startAge,
        currentAge,
        retireLifeYears,
        expectedDeathAge,
        monthlyNeeded: isPremier ? advFutureMonthlyExp : baseFutureMonthlyExp,
        totalNeeded: isPremier ? advTotalNeeded : baseTotalNeeded,
        staticTotalNeeded: isPremier ? advStaticTotalNeeded : baseTotalNeeded,
        progressPct: isPremier ? advProgressPct : baseProgressPct,
        projectedAssets: isPremier ? advProjectedAssets : baseProjectedAssets,
        projectedProgressPct: isPremier ? advProjectedProgressPct : baseProjectedProgressPct,
        laborInsuranceMonthly: isPremier ? advLaborInsuranceMonthly : baseLaborInsuranceMonthly,
        laborInsuranceTotal: isPremier ? advLaborInsuranceTotal : baseLaborInsuranceTotal,
        laborPensionAtRetire: isPremier ? advLaborPensionAtRetire : baseLaborPensionAtRetire,
        laborPensionCurrentAcc: isPremier ? advAccountBal : baseLaborPensionCurrentAcc,
        portfolioAtRetire: isPremier ? advPortfolioAtRetire : basePortfolioAtRetire,
        insuranceTotalAtRetire: isPremier ? advInsuranceTotalAtRetire : baseInsuranceTotalAtRetire,
        totalRemainingLoanAtRetire,
        monthlyLoanPaymentAtRetire,
        advSavedDiff,
        postRetireRoi,
        advInflRate: isPremier ? advInflRate : BASE_INFLATION_RATE,
        pocketAnalysis,
        calculatedAt: new Date().toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
      };

      setRetireCalculatedResult({ snapshot });
      // 平滑滾動至最頂端成果看板
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    // 點擊「修改退休條件」按鈕：退回編輯狀態，隱藏成果看板
    const handleResetCalculation = () => {
      setRetireCalculatedResult(null);
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    // -------------------------------------------------------------------------
    // 下拉選單數值產生器
    // -------------------------------------------------------------------------
    const startAgeOptions = [];
    for (let a = 16; a <= 40; a++) startAgeOptions.push(a);

    const targetAgeOptions = [];
    for (let a = 40; a <= 70; a++) targetAgeOptions.push(a);

    const currentAgeOptions = [];
    for (let a = 16; a <= 70; a++) currentAgeOptions.push(a);

    // 當前畫面運算的展示數據（若有鎖定快照則以快照為準，否則以即時計算為準）
    const disp = retireCalculatedResult ? retireCalculatedResult.snapshot : {
      targetAge,
      startAge,
      currentAge,
      retireLifeYears,
      expectedDeathAge,
      monthlyNeeded: isPremier ? advFutureMonthlyExp : baseFutureMonthlyExp,
      totalNeeded: isPremier ? advTotalNeeded : baseTotalNeeded,
      staticTotalNeeded: isPremier ? advStaticTotalNeeded : baseTotalNeeded,
      progressPct: isPremier ? advProgressPct : baseProgressPct,
      projectedAssets: isPremier ? advProjectedAssets : baseProjectedAssets,
      projectedProgressPct: isPremier ? advProjectedProgressPct : baseProjectedProgressPct,
      laborInsuranceMonthly: isPremier ? advLaborInsuranceMonthly : baseLaborInsuranceMonthly,
      laborInsuranceTotal: isPremier ? advLaborInsuranceTotal : baseLaborInsuranceTotal,
      laborPensionAtRetire: isPremier ? advLaborPensionAtRetire : baseLaborPensionAtRetire,
      laborPensionCurrentAcc: isPremier ? advAccountBal : baseLaborPensionCurrentAcc,
      portfolioAtRetire: isPremier ? advPortfolioAtRetire : basePortfolioAtRetire,
      insuranceTotalAtRetire: isPremier ? advInsuranceTotalAtRetire : baseInsuranceTotalAtRetire,
      totalRemainingLoanAtRetire,
      monthlyLoanPaymentAtRetire,
      advSavedDiff,
      postRetireRoi,
      advInflRate: isPremier ? advInflRate : BASE_INFLATION_RATE,
      pocketAnalysis: calcPocketMoneyAnalysis(),
    };

    return (
      <section>
        {/* 頂部標題與會員徽章 */}
        <div style={{ marginBottom: 18 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
            <div>
              <h2 style={{ ...SF, fontSize: 20, ...ink, margin: 0, display: "flex", alignItems: "center", gap: 8 }}>
                <span>🏖️</span> {isPremier ? "退休規劃（👑 Premier 尊榮版）" : "退休規劃初估"}
              </h2>
              <p style={{ fontSize: 13, ...soft, margin: "4px 0 0" }}>
                {isPremier
                  ? "整合四大支柱、自選投報率、專戶滾存與退休生活期望細項之全方位精算"
                  : "勞保 + 勞退 + 目前投資組合 + 目前保險收益綜合初估"}
              </p>
            </div>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <span className={isPremier ? "tag-gold" : "tag-g"} style={{ fontSize: 12 }}>
                {isPremier ? "👑 Premier 會員專屬方案已啟用" : "標準免費版"}
              </span>
              {!isPremier && (
                <button
                  className="btn"
                  style={{ background: "var(--gold)", color: "#1c2430", fontWeight: 700, fontSize: 12 }}
                  onClick={() => setShowUpgradeModal(true)}
                >
                  升級解鎖尊榮精算
                </button>
              )}
            </div>
          </div>
        </div>

        {/* =================================================================== */}
        {/* 🌟 只有在按下「計算按鈕」完成後，最上方才會出現的兩大看板： */}
        {/* 看板 A: 零用金充足度與資金缺口分析 (標示紅色/綠色) */}
        {/* 看板 B: 符合需求後試算成果看板 (含鎖定參數、儲存目標與修改條件按鈕) */}
        {/* =================================================================== */}
        {retireCalculatedResult && (
          <div style={{ marginBottom: 24, animation: "fadeIn 0.3s ease" }}>
            {/* 🔴/🟢 看板 A: 退休零用金是否足夠與資金缺口多項診斷看板 */}
            <div
              className="card"
              style={{
                marginBottom: 16,
                background: disp.pocketAnalysis.isEnough
                  ? "linear-gradient(135deg, rgba(240,253,244,0.95), rgba(255,255,255,0.98))"
                  : "linear-gradient(135deg, rgba(254,242,242,0.95), rgba(255,255,255,0.98))",
                border: disp.pocketAnalysis.isEnough ? "2px solid #10b981" : "2px solid #ef4444",
                boxShadow: disp.pocketAnalysis.isEnough ? "0 4px 14px rgba(16,185,129,0.15)" : "0 4px 14px rgba(239,68,68,0.15)"
              }}
            >
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ fontSize: 24 }}>{disp.pocketAnalysis.isEnough ? "🟢" : "🔴"}</span>
                  <div>
                    <div style={{ fontSize: 17, fontWeight: 800, color: disp.pocketAnalysis.isEnough ? "#15803d" : "#b91c1c" }}>
                      {disp.pocketAnalysis.isEnough ? "【檢驗合格】退休零用金充足無虞" : "【警示提示】退休零用金不足！"}
                    </div>
                    <div style={{ fontSize: 12, color: "#64748b", marginTop: 2 }}>
                      {disp.pocketAnalysis.isEnough
                        ? `每月預估盈餘約 ${fmt(disp.pocketAnalysis.monthlyGap)} 元（四大支柱月化支援力 ${fmt(disp.pocketAnalysis.totalSupportMonthly)} > 期望月需 ${fmt(disp.pocketAnalysis.activeFutureExp)}）`
                        : `每月預估短缺 ${fmt(disp.pocketAnalysis.monthlyGap)} 元（期望月需 ${fmt(disp.pocketAnalysis.activeFutureExp)} > 四大支柱月化支援力 ${fmt(disp.pocketAnalysis.totalSupportMonthly)}）`}
                    </div>
                  </div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <div style={{ fontSize: 11, ...soft }}>每月份缺口/盈餘金額</div>
                  <div style={{ fontSize: 22, fontWeight: 900, color: disp.pocketAnalysis.isEnough ? "#15803d" : "#dc2626" }}>
                    {disp.pocketAnalysis.isEnough ? `+ ${fmt(disp.pocketAnalysis.monthlyGap)}` : `- ${fmt(disp.pocketAnalysis.monthlyGap)}`} <span style={{ fontSize: 13, fontWeight: 500 }}>元/月</span>
                  </div>
                </div>
              </div>

              {/* 多項成因分析與細項標示列表 */}
              <div style={{ borderTop: "1px dashed rgba(0,0,0,0.1)", paddingTop: 12 }}>
                <div style={{ fontSize: 12, fontWeight: 700, ...ink, marginBottom: 8 }}>
                  📋 零用金收支平衡分析與關鍵影響成因明細：
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 10 }}>
                  {disp.pocketAnalysis.reasons.map((r, idx) => {
                    const badgeBg = r.type === "warn" ? "rgba(239,68,68,0.1)" : r.type === "alert" ? "rgba(220,38,38,0.15)" : r.type === "bonus" ? "rgba(245,158,11,0.15)" : r.type === "ok" ? "rgba(16,185,129,0.12)" : "rgba(37,99,235,0.1)";
                    const badgeColor = r.type === "warn" || r.type === "alert" ? "#b91c1c" : r.type === "bonus" ? "#b45309" : r.type === "ok" ? "#15803d" : "#1d4ed8";
                    const borderCol = r.type === "warn" || r.type === "alert" ? "#fecaca" : r.type === "bonus" ? "#fde68a" : r.type === "ok" ? "#bbf7d0" : "#bfdbfe";

                    return (
                      <div
                        key={`reason-${idx}`}
                        style={{
                          background: "#ffffff",
                          border: `1px solid ${borderCol}`,
                          borderRadius: 8,
                          padding: "10px 12px",
                          fontSize: 12
                        }}
                      >
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                          <span style={{ fontWeight: 700, color: badgeColor }}>{r.title}</span>
                          <span style={{ fontSize: 11, fontWeight: 800, background: badgeBg, color: badgeColor, padding: "2px 8px", borderRadius: 12 }}>
                            {r.amountText}
                          </span>
                        </div>
                        <div style={{ fontSize: 11, color: "#475569", lineHeight: 1.5 }}>
                          {r.desc}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* 🎯 看板 B: 符合需求後試算成果看板 (含鎖定參數標註、修改退休條件與儲存按鈕) */}
            <div
              className="card"
              style={{
                marginBottom: 20,
                background: isPremier
                  ? "linear-gradient(135deg, rgba(254,243,199,0.7), rgba(240,249,255,0.9))"
                  : "linear-gradient(135deg, rgba(240,249,255,0.8), rgba(254,243,199,0.5))",
                border: isPremier ? "1px solid rgba(245,158,11,0.6)" : "1px solid rgba(186,230,253,0.8)",
                boxShadow: "0 2px 8px rgba(0,0,0,0.04)"
              }}
            >
              {/* 看板標題列與操作按鈕群 */}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
                <div>
                  <div style={{ fontSize: 16, fontWeight: 800, color: isPremier ? "#b45309" : "#0369a1", display: "flex", alignItems: "center", gap: 6 }}>
                    <span>🎯</span> 符合需求後試算成果看板
                    <span style={{ fontSize: 11, background: "rgba(0,0,0,0.06)", color: "#475569", padding: "2px 8px", borderRadius: 10, fontWeight: 500 }}>
                      🔒 參數已鎖定（{disp.targetAge}歲退休 • 計算時間 {disp.calculatedAt}）
                    </span>
                  </div>
                </div>

                <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                  {/* 🌟 需求 4：比較儲存方案按鈕 (彈出多方案橫向完整對比看板) */}
                  <button
                    className="btn"
                    style={{
                      background: "#ffffff",
                      color: "#1e40af",
                      border: "1px solid #bfdbfe",
                      fontSize: 12,
                      padding: "7px 14px",
                      fontWeight: 700,
                      borderRadius: 6,
                      display: "flex",
                      alignItems: "center",
                      gap: 6,
                      boxShadow: "0 1px 3px rgba(0,0,0,0.05)",
                      cursor: "pointer"
                    }}
                    onClick={() => setShowRetireCompareModal(true)}
                  >
                    <span>📊</span> 比較儲存方案
                  </button>

                  {/* 儲存退休目標按鈕 */}
                  {isPremier && (
                    <button
                      className="btn"
                      style={{
                        background: "linear-gradient(135deg, #10b981, #059669)",
                        color: "#fff",
                        fontSize: 12,
                        padding: "7px 16px",
                        fontWeight: 700,
                        borderRadius: 6,
                        display: "flex",
                        alignItems: "center",
                        gap: 6,
                        boxShadow: "0 2px 4px rgba(16,185,129,0.25)"
                      }}
                      onClick={handleSaveGoal}
                    >
                      <span>💾</span> 儲存退休目標
                    </button>
                  )}
                </div>
              </div>

              {/* 數據卡片列 */}
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 16, marginBottom: 16 }}>
                {/* 每月共需 */}
                <div style={{ background: "#ffffff", padding: "14px 18px", borderRadius: 8, boxShadow: "0 1px 3px rgba(0,0,0,0.05)" }}>
                  <div style={{ fontSize: 12, ...soft, marginBottom: 4 }}>
                    {isPremier ? "退休後每月共需要 (通膨折算後)" : "希望退休每月生活費 (現值)"}
                  </div>
                  <div style={{ fontSize: 22, fontWeight: 900, color: isPremier ? "#b45309" : "var(--ink)" }}>
                    ${fmt(disp.monthlyNeeded)} <span style={{ fontSize: 12, fontWeight: 400, color: "var(--ink-soft)" }}>元/月</span>
                  </div>
                  <div style={{ fontSize: 11, ...soft, marginTop: 4 }}>
                    {isPremier
                      ? `現值等同每月份 ${fmt(totalAdvMonthlyBase)} 元生活零用金需求`
                      : `經 2% 通膨複利折算退休時需 ${fmt(disp.monthlyNeeded)} 元/月`}
                  </div>
                </div>

                {/* 總需資金 */}
                <div style={{ background: "#ffffff", padding: "14px 18px", borderRadius: 8, boxShadow: "0 1px 3px rgba(0,0,0,0.05)" }}>
                  <div style={{ fontSize: 12, ...soft, marginBottom: 4, display: "flex", justifyContent: "space-between" }}>
                    <span>退休總需準備金 ({disp.retireLifeYears} 年)</span>
                    {isPremier && (
                      <span className="tag-g" style={{ fontSize: 10, padding: "1px 6px" }}>
                        動態實質折現
                      </span>
                    )}
                  </div>
                  <div style={{ fontSize: 20, fontWeight: 800, color: "#dc2626" }}>
                    ${fmt(disp.totalNeeded)} <span style={{ fontSize: 12, fontWeight: 400, color: "var(--ink-soft)" }}>元</span>
                  </div>
                  <div style={{ fontSize: 11, ...soft, marginTop: 4 }}>
                    {disp.totalRemainingLoanAtRetire > 0 ? (
                      <span>
                        含未清償貸款 <strong>${fmt(disp.totalRemainingLoanAtRetire)}</strong> 元 + 生活準備金
                      </span>
                    ) : (
                      <span>房貸全數清償完畢，全額為純零用金資產池</span>
                    )}
                  </div>
                </div>

                {/* 目前累積進度 % */}
                <div style={{ background: "#ffffff", padding: "14px 18px", borderRadius: 8, boxShadow: "0 1px 3px rgba(0,0,0,0.05)" }}>
                  <div style={{ fontSize: 12, ...soft, marginBottom: 4, display: "flex", justifyContent: "space-between" }}>
                    <span>目前累積進度 %</span>
                    <span style={{ fontSize: 10, color: "#64748b" }}>現值計算</span>
                  </div>
                  <div style={{ fontSize: 22, fontWeight: 800, color: disp.progressPct >= 50 ? "#059669" : "#2563eb" }}>
                    {disp.progressPct}%
                  </div>
                  <div style={{ fontSize: 11, ...soft, marginTop: 4 }}>
                    已備專戶與投資約 <strong>${fmt(isPremier ? advCurrentAssets : baseCurrentAssets)}</strong> 元
                    <div style={{ fontSize: 10, color: "#94a3b8", marginTop: 2 }}>（以目前已持有之現值計算）</div>
                  </div>
                </div>

                {/* 預估達成率 % */}
                <div style={{ background: "#ffffff", padding: "14px 18px", borderRadius: 8, boxShadow: "0 1px 3px rgba(0,0,0,0.05)" }}>
                  <div style={{ fontSize: 12, ...soft, marginBottom: 4, display: "flex", justifyContent: "space-between" }}>
                    <span>預估退休達成率 %</span>
                    <span style={{ fontSize: 10, color: "#059669" }}>退休終值</span>
                  </div>
                  <div style={{ fontSize: 22, fontWeight: 800, color: disp.projectedProgressPct >= 100 ? "#059669" : "#d97706" }}>
                    {disp.projectedProgressPct}%
                  </div>
                  <div style={{ fontSize: 11, ...soft, marginTop: 4 }}>
                    四大支柱預估約 <strong>${fmt(disp.projectedAssets)}</strong> 元
                    <div style={{ fontSize: 10, color: "#94a3b8", marginTop: 2 }}>（含未來薪資提撥、年金與複利滾存）</div>
                  </div>
                </div>
              </div>

              {/* 進度條 */}
              <div>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, fontWeight: 600, marginBottom: 6 }}>
                  <span>目前進度 ({disp.progressPct}%)</span>
                  <span>目標：100% (${fmt(disp.totalNeeded)} 元)</span>
                </div>
                <div style={{ width: "100%", height: 12, background: "rgba(0,0,0,0.08)", borderRadius: 6, overflow: "hidden" }}>
                  <div
                    style={{
                      width: `${Math.min(100, disp.progressPct)}%`,
                      height: "100%",
                      background: isPremier
                        ? "linear-gradient(90deg, #f59e0b, #10b981)"
                        : "linear-gradient(90deg, #3b82f6, #10b981)",
                      borderRadius: 6,
                      transition: "width 0.4s ease"
                    }}
                  />
                </div>
              </div>

              {/* 已儲存退休目標方案按鈕列表 */}
              {isPremier && savedRetireGoals.length > 0 && (
                <div style={{ marginTop: 16, paddingTop: 14, borderTop: "1px dashed rgba(245,158,11,0.5)" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, flexWrap: "wrap", gap: 8 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: "#92400e", display: "flex", alignItems: "center", gap: 6 }}>
                      <span>📂</span> 已儲存的退休目標（點擊即時切換載入當時參數、期望與四大支柱明細）：
                    </div>
                    <button
                      type="button"
                      onClick={() => setShowRetireCompareModal(true)}
                      style={{
                        fontSize: 11,
                        padding: "4px 12px",
                        borderRadius: 14,
                        background: "#1e40af",
                        color: "#ffffff",
                        border: "none",
                        fontWeight: 700,
                        cursor: "pointer",
                        display: "flex",
                        alignItems: "center",
                        gap: 4,
                        boxShadow: "0 1px 3px rgba(30,64,175,0.25)"
                      }}
                    >
                      <span>🍎</span> 跨方案規格比較 (2~3欄)
                    </button>
                  </div>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    {savedRetireGoals.map(g => {
                      const isActive = activeRetireGoalId === g.id;
                      return (
                        <div
                          key={g.id}
                          onClick={() => handleLoadGoal(g)}
                          style={{
                            display: "inline-flex",
                            alignItems: "center",
                            gap: 8,
                            padding: "6px 12px",
                            borderRadius: 20,
                            fontSize: 12,
                            cursor: "pointer",
                            background: isActive ? "#1e40af" : "#ffffff",
                            color: isActive ? "#ffffff" : "var(--ink)",
                            border: isActive ? "1px solid #1e40af" : "1px solid var(--border)",
                            boxShadow: isActive ? "0 2px 6px rgba(30,64,175,0.25)" : "0 1px 2px rgba(0,0,0,0.04)",
                            transition: "all 0.2s ease"
                          }}
                          title={`儲存日期：${g.savedAt} | 退休月需：${fmt(g.pillarsSnapshot?.monthlyNeeded || 0)}`}
                        >
                          <span style={{ fontWeight: 700 }}>📌 {g.name}</span>
                          <span style={{ fontSize: 11, opacity: 0.85 }}>
                            (月需 ${fmt(g.pillarsSnapshot?.monthlyNeeded || 0)} • {g.pillarsSnapshot?.projectedProgressPct || 0}%)
                          </span>
                          <span
                            onClick={(e) => handleDeleteGoal(g.id, e)}
                            style={{
                              marginLeft: 4,
                              fontSize: 12,
                              color: isActive ? "#ffedd5" : "#94a3b8",
                              fontWeight: 800,
                              padding: "0 2px"
                            }}
                            title="刪除此目標"
                          >
                            ✕
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          </div>
        )}

        {/* =================================================================== */}
        {/* 2. 退休基本參數設定卡片 */}
        {/* =================================================================== */}
        <div className="card" style={{ marginBottom: 20 }}>
          <div style={{ fontSize: 15, fontWeight: 700, ...ink, marginBottom: 14, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span>⚙️</span> 退休基本參數設定
            </div>
            {isPremier && <span className="tag-gold" style={{ fontSize: 11 }}>自訂參數已開啟</span>}
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 14 }}>
            {/* 計算性別 (連動個人檔案與生命表) */}
            <div>
              <label style={{ display: "block", fontSize: 12, fontWeight: 600, ...soft, marginBottom: 6 }}>
                生理性別 (連動個人檔案與生命表)
              </label>
              <select
                className="input-field"
                value={retireGender}
                onChange={e => setRetireGender(e.target.value)}
                style={{ width: "100%", padding: "8px 12px" }}
              >
                <option value="male">男性 (生理性別)</option>
                <option value="female">女性 (生理性別)</option>
              </select>
            </div>

            {/* 開始工作年齡 (基本資料有填則串聯鎖定，未填才開放自選) */}
            <div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                <label style={{ fontSize: 12, fontWeight: 600, ...soft, margin: 0 }}>
                  開始工作年齡 (16~40 歲)
                </label>
                {hasProfileStartAge ? (
                  <span className="tag-blue" style={{ fontSize: 10, padding: "1px 6px" }}>🔒 基本資料已連動</span>
                ) : (
                  <span className="tag-amber" style={{ fontSize: 10, padding: "1px 6px" }}>基本資料未填•開放自選</span>
                )}
              </div>
              {hasProfileStartAge ? (
                <div style={{
                  width: "100%",
                  padding: "8px 12px",
                  background: "#f8fafc",
                  borderRadius: 6,
                  border: "1px solid #cbd5e1",
                  fontSize: 13,
                  fontWeight: 700,
                  color: "var(--ink)",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "space-between"
                }}>
                  <span>{startAge} 歲起進入職場</span>
                  <span style={{ fontSize: 11, color: "#64748b", fontWeight: 400 }}>（已於基本資料設定）</span>
                </div>
              ) : (
                <select
                  className="input-field"
                  value={startAge}
                  onChange={e => {
                    const val = Number(e.target.value);
                    setRetireStartAge(val);
                  }}
                  style={{ width: "100%", padding: "8px 12px" }}
                >
                  {startAgeOptions.map(age => (
                    <option key={age} value={age}>{age} 歲</option>
                  ))}
                </select>
              )}
            </div>

            {/* 目前年齡 (無論初估版還是尊榮版皆強制串聯基本資料年齡) */}
            <div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                <label style={{ fontSize: 12, fontWeight: 600, ...soft, margin: 0 }}>
                  目前年齡 (計算已累積資產)
                </label>
                <span className="tag-blue" style={{ fontSize: 10, padding: "1px 6px" }}>🔒 強制連動基本資料</span>
              </div>
              <div style={{
                width: "100%",
                padding: "8px 12px",
                background: "#f8fafc",
                borderRadius: 6,
                border: "1px solid #cbd5e1",
                fontSize: 13,
                fontWeight: 700,
                color: "var(--ink)",
                display: "flex",
                alignItems: "center",
                justifyContent: "space-between"
              }}>
                <span>{currentAge} 歲</span>
                <span style={{ fontSize: 11, color: "#64748b", fontWeight: 400 }}>（出生於 {userProfile.birthDate || "1990"}）</span>
              </div>
            </div>

            {/* 希望退休年齡 (40~70 歲，支援提前請領與延後請領) */}
            <div>
              <label style={{ display: "block", fontSize: 12, fontWeight: 600, ...soft, marginBottom: 6 }}>
                希望退休年齡 (40~70 歲)
              </label>
              <select
                className="input-field"
                value={targetAge}
                onChange={e => {
                  const val = Number(e.target.value);
                  setRetireTargetAge(val);
                  if (currentAge > val) setRetireCurrentAge(val);
                }}
                style={{ width: "100%", padding: "8px 12px" }}
              >
                {targetAgeOptions.map(age => (
                  <option key={age} value={age}>
                    {age} 歲 {age < 65 ? `(提前請領 -${(Math.min(5, 65 - age) * 4)}%)` : age > 65 ? `(展延請領 +${(Math.min(5, age - 65) * 4)}%)` : "(法定基準 100%)"}
                  </option>
                ))}
              </select>
            </div>

            {/* 每年通膨率 (進階自選 / 初估固定 2%) */}
            <div>
              <label style={{ display: "block", fontSize: 12, fontWeight: 600, ...soft, marginBottom: 6 }}>
                每年通膨率增加 {isPremier ? "(2%~5%)" : "(標準固定 2%)"}
              </label>
              {isPremier ? (
                <select
                  className="input-field"
                  value={advInflRate}
                  onChange={e => setAdvInflationRate(Number(e.target.value))}
                  style={{ width: "100%", padding: "8px 12px" }}
                >
                  <option value={0.02}>2.0% (央行長期通膨目標)</option>
                  <option value={0.025}>2.5% (穩健微幅通膨)</option>
                  <option value={0.03}>3.0% (中度實質通膨)</option>
                  <option value={0.035}>3.5% (生活有感通膨)</option>
                  <option value={0.04}>4.0% (較高物價通膨)</option>
                  <option value={0.05}>5.0% (嚴峻通膨情境)</option>
                </select>
              ) : (
                <input
                  type="text"
                  disabled
                  value="固定每年 2.0%（標準版預設）"
                  className="input-field"
                  style={{ width: "100%", padding: "8px 12px", background: "#f1f5f9", color: "#64748b" }}
                />
              )}
            </div>

            {/* 勞退自提比例 (進階 0%~6% / 初估固定 0%) */}
            <div>
              <label style={{ display: "block", fontSize: 12, fontWeight: 600, ...soft, marginBottom: 6 }}>
                退休金提撥率 {isPremier ? "(雇主6% + 自提)" : "(雇主固定 6%)"}
              </label>
              {isPremier ? (
                <select
                  className="input-field"
                  value={advSelfRate}
                  onChange={e => setAdvSelfContribRate(Number(e.target.value))}
                  style={{ width: "100%", padding: "8px 12px" }}
                >
                  <option value={0.06}>自提 6% (合計提撥 12%，尊榮推薦)</option>
                  <option value={0.05}>自提 5% (合計提撥 11%)</option>
                  <option value={0.04}>自提 4% (合計提撥 10%)</option>
                  <option value={0.03}>自提 3% (合計提撥 9%)</option>
                  <option value={0.02}>自提 2% (合計提撥 8%)</option>
                  <option value={0.01}>自提 1% (合計提撥 7%)</option>
                  <option value={0.00}>僅雇主提撥 (合計提撥 6%)</option>
                </select>
              ) : (
                <input
                  type="text"
                  disabled
                  value="雇主固定 6%（初估無自提）"
                  className="input-field"
                  style={{ width: "100%", padding: "8px 12px", background: "#f1f5f9", color: "#64748b" }}
                />
              )}
            </div>

            {/* 勞動基金投報率 (進階自選 / 初估固定 7.64%) */}
            <div>
              <label style={{ display: "block", fontSize: 12, fontWeight: 600, ...soft, marginBottom: 6 }}>
                勞退專戶年化投報率
              </label>
              {isPremier ? (
                <select
                  className="input-field"
                  value={advReturnRate}
                  onChange={e => setAdvPensionReturnRate(Number(e.target.value))}
                  style={{ width: "100%", padding: "8px 12px" }}
                >
                  <option value={0.0764}>7.64% (勞動基金長期平均，基準推薦)</option>
                  <option value={0.05}>5.00% (保守防禦估算)</option>
                  <option value={0.06}>6.00% (穩健平衡估算)</option>
                  <option value={0.09}>9.00% (積極成長估算)</option>
                  <option value={0.118}>11.80% (近 5 年年化平均)</option>
                  <option value={0.156}>15.60% (近 3 年多頭年化表現)</option>
                </select>
              ) : (
                <input
                  type="text"
                  disabled
                  value="固定 7.64%（勞動基金長期平均）"
                  className="input-field"
                  style={{ width: "100%", padding: "8px 12px", background: "#f1f5f9", color: "#64748b" }}
                />
              )}
            </div>

            {/* 目前專戶金額 */}
            {isPremier && (
              <div>
                <label style={{ display: "block", fontSize: 12, fontWeight: 600, ...soft, marginBottom: 6 }}>
                  目前勞退個人專戶累積金額
                </label>
                <div style={{ position: "relative" }}>
                  <input
                    type="number"
                    className="input-field"
                    value={advAccountBal || ""}
                    onChange={e => setAdvCurrentAccountBal(Number(e.target.value) || 0)}
                    placeholder="請輸入現有專戶金額"
                    style={{ width: "100%", padding: "8px 12px", paddingRight: 36, fontWeight: 600 }}
                  />
                  <span style={{ position: "absolute", right: 12, top: 9, fontSize: 13, ...soft }}>元</span>
                </div>
              </div>
            )}

            {/* 6. 目前薪資年成長率：(下拉式選單) */}
            {isPremier && (
              <div>
                <label style={{ display: "block", fontSize: 12, fontWeight: 600, ...soft, marginBottom: 6 }}>
                  預估未來薪資年成長率
                </label>
                <select
                  className="input-field"
                  value={advWageGrowth}
                  onChange={e => setAdvWageGrowthRate(Number(e.target.value))}
                  style={{ width: "100%", padding: "8px 12px" }}
                >
                  <option value={0.0194}>1.94% (主計總處近10年薪資年複合成長中位數)</option>
                  <option value={0.01}>1.00% (保守調薪)</option>
                  <option value={0.025}>2.50% (穩健企業調薪)</option>
                  <option value={0.035}>3.50% (成長型產業調薪)</option>
                  <option value={0.05}>5.00% (快速晉升調薪)</option>
                  <option value={0.00}>0.00% (不考慮調薪)</option>
                </select>
              </div>
            )}

            {/* 7. 勞保老年年金最高投保級距設定 */}
            {isPremier && (
              <div>
                <label style={{ display: "block", fontSize: 12, fontWeight: 600, ...soft, marginBottom: 6 }}>
                  勞保老年年金月投保薪資級距
                </label>
                <select
                  className="input-field"
                  value={advLaborWageCap}
                  onChange={e => setAdvLaborWageCap(Number(e.target.value))}
                  style={{ width: "100%", padding: "8px 12px" }}
                >
                  <option value={45800}>法定最高投保級距 45,800 元 (尊榮建議)</option>
                  <option value={43900}>第 13 級 43,900 元</option>
                  <option value={42000}>第 12 級 42,000 元</option>
                  <option value={38200}>第 10 級 38,200 元</option>
                  <option value={29800}>最低工資基準 29,800 元 (初估標準)</option>
                </select>
              </div>
            )}

            {/* 8. 退休後資金池年化保守再投資報酬率 (動態提領) */}
            {isPremier && (
              <div>
                <label style={{ display: "block", fontSize: 12, fontWeight: 600, ...soft, marginBottom: 6 }}>
                  退休後資產池保守再投資年化收益
                </label>
                <select
                  className="input-field"
                  value={advPostRetireRoi}
                  onChange={e => setAdvPostRetireRoi(Number(e.target.value))}
                  style={{ width: "100%", padding: "8px 12px" }}
                >
                  <option value={0.03}>年化 3.0% 保守再投資收益 (邊存邊領)</option>
                  <option value={0.02}>年化 2.0% 極保守收益</option>
                  <option value={0.04}>年化 4.0% 穩健股債收益</option>
                  <option value={0.05}>年化 5.0% 股債平衡收益</option>
                  <option value={0.00}>0.0% 靜態現金提領 (不生息)</option>
                </select>
              </div>
            )}

            {/* 9. 投資組合累積期成長率 */}
            <div>
              <label style={{ display: "block", fontSize: 12, fontWeight: 600, ...soft, marginBottom: 6 }}>
                目前投資組合近 5 年加權報酬率
              </label>
              <div style={{ position: "relative" }}>
                <input
                  type="text"
                  disabled
                  value={`${(retireInvestGrowthRate * 100).toFixed(1)}% / 年 (持股市值加權)`}
                  className="input-field"
                  style={{ width: "100%", padding: "8px 12px", background: "#f8fafc", color: "#1e3a8a", fontWeight: 700 }}
                />
              </div>
            </div>
          </div>

          {/* 參數摘要列 */}
          <div style={{ marginTop: 14, paddingTop: 12, borderTop: "1px dashed rgba(0,0,0,0.08)", fontSize: 12, ...soft, display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
            <div>
              累計總工作期：<strong>{totalWorkYears} 年</strong> ｜ 距離退休尚餘：<strong>{yearsToRetire} 年</strong> ｜ 預估退休後生活期：<strong>{retireLifeYears} 年</strong>
              {isPremier ? (
                <span style={{ fontSize: 11, color: "#92400e", marginLeft: 6 }}>
                  (依第七回生命表 {retireGender === "female" ? "女性" : "男性"} {targetAge} 歲條件餘命動態推算至 {expectedDeathAge} 歲)
                </span>
              ) : (
                <span style={{ fontSize: 11, color: "#64748b", marginLeft: 6 }}>
                  (依一般平均壽命 85 歲靜態估算)
                </span>
              )}
            </div>
            <div style={{ color: "#2563eb", fontWeight: 600 }}>
              {isPremier ? `✦ 勞保：${advLiData.statusText}` : `✦ 勞保：${baseLiData.statusText}`}
            </div>
          </div>
        </div>

        {/* =================================================================== */}
        {/* 3. 🏖️ 退休生活期望 (訂閱版專屬細項 / 非訂閱提示) */}
        {/* =================================================================== */}
        {isPremier ? (
          <div className="card" style={{ marginBottom: 20 }}>
            <div style={{ fontSize: 15, fontWeight: 700, ...ink, marginBottom: 14, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span>🏖️</span> 退休生活期望細項自選（👑 Premier 尊榮版專屬精算）
              </div>
              <span className="tag-gold" style={{ fontSize: 11 }}>生活費動態加總</span>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 14 }}>
              {/* 希望退休每月份生活費 (現值) */}
              <div>
                <label style={{ display: "block", fontSize: 12, fontWeight: 600, ...soft, marginBottom: 6 }}>
                  希望退休每月份基礎生活費 (現值)
                </label>
                <div style={{ position: "relative" }}>
                  <input
                    type="number"
                    className="input-field"
                    value={baseMonthlyLiving || ""}
                    onChange={e => setRetireMonthlyExpense(Number(e.target.value) || 0)}
                    style={{ width: "100%", padding: "8px 12px", paddingRight: 36, fontWeight: 600 }}
                  />
                  <span style={{ position: "absolute", right: 12, top: 9, fontSize: 13, ...soft }}>元</span>
                </div>
              </div>

              {/* 國內旅遊 (3日遊, 1萬/次) */}
              <div>
                <label style={{ display: "block", fontSize: 12, fontWeight: 600, ...soft, marginBottom: 6 }}>
                  國內旅遊 (3日遊，1萬元/次)
                </label>
                <div style={{ position: "relative" }}>
                  <input
                    type="number"
                    className="input-field"
                    value={advTravelDomestic}
                    onChange={e => setAdvTravelDomestic(Number(e.target.value) || 0)}
                    style={{ width: "100%", padding: "8px 12px", paddingRight: 36, fontWeight: 600 }}
                  />
                  <span style={{ position: "absolute", right: 12, top: 9, fontSize: 13, ...soft }}>次/年</span>
                </div>
              </div>

              {/* 亞洲旅遊 (5日遊, 7萬/次) */}
              <div>
                <label style={{ display: "block", fontSize: 12, fontWeight: 600, ...soft, marginBottom: 6 }}>
                  亞洲旅遊 (5日遊，7萬元/次)
                </label>
                <div style={{ position: "relative" }}>
                  <input
                    type="number"
                    className="input-field"
                    value={advTravelAsia}
                    onChange={e => setAdvTravelAsia(Number(e.target.value) || 0)}
                    style={{ width: "100%", padding: "8px 12px", paddingRight: 36, fontWeight: 600 }}
                  />
                  <span style={{ position: "absolute", right: 12, top: 9, fontSize: 13, ...soft }}>次/年</span>
                </div>
              </div>

              {/* 歐美長程旅遊 (10日遊, 20萬/次) */}
              <div>
                <label style={{ display: "block", fontSize: 12, fontWeight: 600, ...soft, marginBottom: 6 }}>
                  歐美長程旅遊 (10日遊，20萬元/次)
                </label>
                <div style={{ position: "relative" }}>
                  <input
                    type="number"
                    className="input-field"
                    value={advTravelGlobal}
                    onChange={e => setAdvTravelGlobal(Number(e.target.value) || 0)}
                    style={{ width: "100%", padding: "8px 12px", paddingRight: 36, fontWeight: 600 }}
                  />
                  <span style={{ position: "absolute", right: 12, top: 9, fontSize: 13, ...soft }}>次/年</span>
                </div>
              </div>

              {/* 朋友聚餐 (1500元/次) */}
              <div>
                <label style={{ display: "block", fontSize: 12, fontWeight: 600, ...soft, marginBottom: 6 }}>
                  朋友聚餐社交 (1,500元/次)
                </label>
                <div style={{ position: "relative" }}>
                  <input
                    type="number"
                    className="input-field"
                    value={advGatheringCount}
                    onChange={e => setAdvGatheringCount(Number(e.target.value) || 0)}
                    style={{ width: "100%", padding: "8px 12px", paddingRight: 36, fontWeight: 600 }}
                  />
                  <span style={{ position: "absolute", right: 12, top: 9, fontSize: 13, ...soft }}>次/年</span>
                </div>
              </div>

              {/* 退休購車或換車需求 */}
              <div>
                <label style={{ display: "block", fontSize: 12, fontWeight: 600, ...soft, marginBottom: 6 }}>
                  購車或換車計畫 (預估100萬)
                </label>
                <select
                  className="input-field"
                  value={advBuyCar}
                  onChange={e => setAdvBuyCar(e.target.value)}
                  style={{ width: "100%", padding: "8px 12px" }}
                >
                  <option value="no">無購車/換車需求 ($0/月)</option>
                  <option value="buy5y">5年換車一次 (月攤提約 $16,667 元)</option>
                  <option value="buy3y">3年換車一次 (月攤提約 $27,778 元)</option>
                </select>
              </div>

              {/* 汽車保養維修年支出 */}
              <div>
                <label style={{ display: "block", fontSize: 12, fontWeight: 600, ...soft, marginBottom: 6 }}>
                  車輛定期保養與牌照稅費 (年)
                </label>
                <div style={{ position: "relative" }}>
                  <input
                    type="number"
                    className="input-field"
                    value={advCarMaintenance || ""}
                    onChange={e => setAdvCarMaintenance(Number(e.target.value) || 0)}
                    style={{ width: "100%", padding: "8px 12px", paddingRight: 36, fontWeight: 600 }}
                  />
                  <span style={{ position: "absolute", right: 12, top: 9, fontSize: 13, ...soft }}>元/年</span>
                </div>
              </div>

              {/* 租屋規劃 */}
              <div>
                <label style={{ display: "block", fontSize: 12, fontWeight: 600, ...soft, marginBottom: 6 }}>
                  退休租屋住宿需求
                </label>
                <select
                  className="input-field"
                  value={advRentType}
                  onChange={e => setAdvRentType(e.target.value)}
                  style={{ width: "100%", padding: "8px 12px" }}
                >
                  <option value="none">自有住宅，無租金支出 ($0/月)</option>
                  <option value="noParking">租賃無車位住宅 (預估 $20,000 元/月)</option>
                  <option value="withParking">租賃附車位住宅 (預估 $25,000 元/月)</option>
                </select>
              </div>

              {/* 醫美抗老保養 (5萬/次) */}
              <div>
                <label style={{ display: "block", fontSize: 12, fontWeight: 600, ...soft, marginBottom: 6 }}>
                  醫美抗老保養 (每次5萬元)
                </label>
                <div style={{ position: "relative" }}>
                  <input
                    type="number"
                    className="input-field"
                    value={advBeautyCareCount}
                    onChange={e => setAdvBeautyCareCount(Number(e.target.value) || 0)}
                    style={{ width: "100%", padding: "8px 12px", paddingRight: 36, fontWeight: 600 }}
                  />
                  <span style={{ position: "absolute", right: 12, top: 9, fontSize: 13, ...soft }}>次/年</span>
                </div>
              </div>
            </div>

            {/* 期望細項加總現值摘要 */}
            <div style={{ marginTop: 14, paddingTop: 12, borderTop: "1px dashed rgba(0,0,0,0.08)", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
              <div style={{ fontSize: 12, ...soft }}>

                      <input className="inp" type="number" step="0.01" placeholder="個股填0，ETF約0.2~0.4%" value={newTwStock.mgmtFee} onChange={e => setNewTwStock({ ...newTwStock, mgmtFee: e.target.value })} />
                    </div>
                  </div>

                  {/* 即時配息試算預覽 (含扣費後實領與月均配息) */}
                  {Boolean(newTwStock.shares && (newTwStock.divPerShare !== undefined && newTwStock.divPerShare !== "")) && (() => {
                    const mult = newTwStock.divFreq === "年配" ? 1 : newTwStock.divFreq === "月配" ? 12 : newTwStock.divFreq === "半年配" ? 2 : newTwStock.divFreq === "不配息" ? 0 : 4;
                    const singleGross = (Number(newTwStock.shares) || 0) * (Number(newTwStock.divPerShare) || 0);
                    const annGross = singleGross * mult;
                    const feeAmt = Math.round(annGross * ((Number(newTwStock.feeRate) || 0) / 100));
                    const mgmtAmt = Math.round(annGross * ((Number(newTwStock.mgmtFee) || 0) / 100));
                    const singleNhi = singleGross >= 20000 ? Math.round(singleGross * 0.0211) : 0;
                    const annNhi = singleNhi * mult;
                    const totalCost = feeAmt + mgmtAmt + annNhi;
                    const annNet = Math.max(0, annGross - totalCost);
                    return (
                      <div style={{ padding: "8px 12px", background: "var(--paper)", borderRadius: 6, fontSize: 12, display: "flex", flexDirection: "column", gap: 4, color: "var(--ink)" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap" }}>
                          <span>預估毛息：<b>{fmt(annGross)} /年</b></span>
                          <span style={{ color: "var(--seal)" }}>扣費 (手續+管理+健保)：<b>-{fmt(totalCost)}</b></span>
                        </div>
                        <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", borderTop: "1px dashed var(--line)", paddingTop: 4 }}>
                          <span>本年度累積配息 (實領)：<b style={{ color: "var(--green)" }}>{fmt(annNet)}</b></span>
                          <span>每月平均約配息 (實領)：<b style={{ color: "#B8860B" }}>{fmt(Math.round(annNet / 12))} /月</b></span>
                          {Boolean(Number(newTwStock.price) && Number(newTwStock.shares)) && (
                            <span style={{ color: "#0284C7" }}>預估獲利率：<b>{(((annNet) / (Number(newTwStock.shares) * Number(newTwStock.price))) * 100).toFixed(2)}%</b></span>
                          )}
                        </div>
                      </div>
                    );
                  })()}

                  <div style={{ fontSize: 11, color: "var(--ink-soft)" }}>

                  </div>
                </div>
              )}

              {/* 表單 2: 美股 */}

                    <input className="inp" placeholder="標的名稱 (例: Schwab US Dividend ETF)" value={newUsStock.name} onChange={e => setNewUsStock({ ...newUsStock, name: e.target.value })} />

                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>

                    </div>
                    <div>
                      <div style={{ fontSize: 11, ...soft, marginBottom: 4 }}>現價 (USD)</div>
                      <input className="inp" type="number" step="0.1" placeholder="例: 225 或 512" value={newUsStock.currentPrice} onChange={e => setNewUsStock({ ...newUsStock, currentPrice: e.target.value })} />
                    </div>
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>

                        <option value="季配">季配</option>
                        <option value="月配">月配</option>
                        <option value="半年配">半年配</option>

                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>

                    <div>
                      <div style={{ fontSize: 11, ...soft, marginBottom: 4 }}>ETF內扣管理費 (%/年)</div>

                    </div>
                  </div>
                  <div style={{ fontSize: 11, color: "var(--seal)", marginTop: 2 }}>
                    ℹ️ 美股屬於海外所得依法免課 2.11% 二代健保；系統將自動扣除 IRS 30% 外國人預扣稅。
                  </div>
                </div>

              {/* 表單 3: 基金 */}
              {investType === "fund" && (
                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>

                    </div>
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                    <div>
                      <div style={{ fontSize: 11, ...soft, marginBottom: 4 }}>交易手續費率 (%)</div>
                      <input className="inp" type="number" step="0.01" placeholder="存摺約0.15%或免收" value={newGold.feeRate} onChange={e => setNewGold({ ...newGold, feeRate: e.target.value })} />
                    </div>
                    <div>
                      <div style={{ fontSize: 11, ...soft, marginBottom: 4 }}>備註說明</div>
                      <input className="inp" placeholder="例: 長線抗通膨避險" value={newGold.note} onChange={e => setNewGold({ ...newGold, note: e.target.value })} />
                    </div>
                  </div>
                  {Boolean(newGold.weight && newGold.avgPrice) && (
                    <div style={{ padding: "8px 12px", background: "var(--paper)", borderRadius: 6, fontSize: 12, display: "flex", justifyContent: "space-between", color: "var(--ink)" }}>
                      <span>總投資成本：<b>{fmt(Number(newGold.weight) * Number(newGold.avgPrice))}</b></span>
                      {Boolean(newGold.currentPrice) && (
                        <span>預估現值：<b style={{ color: "var(--gold)" }}>{fmt(Number(newGold.weight) * Number(newGold.currentPrice))}</b></span>
                      )}
                    </div>
                  )}
                </div>
              )}

              <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 20 }}>
                <button className="btnl" onClick={() => setShowAddInvestModal(false)}>取消</button>
                <button className="btn" onClick={handleSaveInvest}>儲存並加入投資組合</button>
              </div>
            </div>
          </div>
        )}

        {/* 🌟 頂部快捷「刪除目前持有標的」管理視窗 (Modal) */}
        {showManageDeleteModal && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 105, padding: 16 }}>

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>

                  <h3 style={{ ...SF, fontSize: 18, ...ink, margin: 0 }}>🗑️ 刪除目前持有的標的</h3>
                  <div style={{ fontSize: 12, ...soft, marginTop: 2 }}>請點選您欲從投資組合中移除的標的</div>
                </div>
                <button onClick={() => setShowManageDeleteModal(false)} style={{ background: "transparent", border: "none", fontSize: 20, cursor: "pointer", ...soft }}>✕</button>

              {/* 台股清單 */}
              <div style={{ marginBottom: 18 }}>

                </div>
                {twStocks.length === 0 ? (
                  <div style={{ fontSize: 12, ...soft, padding: "8px 12px", background: "var(--paper)", borderRadius: 6 }}>目前無台股持有標的</div>

        {selectedPolicy && (

            <div className="card" style={{ maxWidth: 680, width: "100%", padding: 26, borderRadius: 10, boxShadow: "0 20px 40px rgba(0,0,0,0.3)", maxHeight: "92vh", overflowY: "auto", background: "#fff" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14, borderBottom: "1px solid var(--line-soft)", paddingBottom: 12 }}>
                <div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                    <span className="tag-gold">🏛️ 原始核定保單資料庫</span>
                    <span style={{ fontFamily: "monospace", fontSize: 12, fontWeight: 700, color: "var(--ink-soft)" }}>{selectedPolicy.policyNo}</span>
                  </div>
                  <h3 style={{ ...SF, fontSize: 19, ...ink, margin: 0 }}>{selectedPolicy.name}</h3>
                  <div style={{ fontSize: 12, ...soft, marginTop: 4 }}>
                    承保機構：<b>{selectedPolicy.company}</b> ｜ 險種：<b>{selectedPolicy.categoryName}</b> ｜ 狀態：<span style={{ color: "var(--green)", fontWeight: 700 }}>● 正常有效投保中</span>
                  </div>
                </div>
                <button onClick={() => setSelectedPolicy(null)} style={{ background: "transparent", border: "none", fontSize: 22, cursor: "pointer", ...soft, lineHeight: 1 }}>✕</button>
              </div>

              {/* 擬真原廠電子保單防偽圖照卡片 或 實際拍照上傳原件展示 */}
              {selectedPolicy.photo ? (
                <div style={{ background: "#0F172A", borderRadius: 8, padding: 12, marginBottom: 18, textAlign: "center" }}>
